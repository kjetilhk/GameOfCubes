<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Test 2: Cloth Simulation - XPBD Dynamics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../src/common.css">
</head>
<body>
<div id="intro"><div class="card">
  <h1>Test 2: Cloth</h1>
  <p>XPBD compliant cloth simulation. Pinned at top corners by default. Tilt or drag to drape, shake to ripple, tap & grab to pull fabric, or toggle pins to release.</p>
  <button id="go">Start</button>
</div></div>
<div id="fps">-- FPS</div>
<div id="note"></div>
<div id="hud">
  <a id="back" href="../../">← Tests</a>
  <button id="pins">Unpin</button>
  <button id="selfcol">Self Collision: Off</button>
  <button id="cube">Add Cube</button>
  <button id="shake" class="hidden">Shake</button>
  <button id="reset">Reset</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../../src/xpbd.js"></script>
<script src="../../src/viewcube.js"></script>
<script src="../../src/room.js"></script>
<script>
(() => {
'use strict';

const V = THREE.Vector3;
const world = new XPBD.World({ dt: 1/60, substeps: 18, linearDamping: 0.7 });
const { bodies, particles, box } = world;

/* ================= rendering & room ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 50);
const lights = RoomEnv.createLighting(scene);
let wallGroup = null;

function resize(){
  wallGroup = RoomEnv.updateRoom(camera, renderer, world, lights, wallGroup, scene);
}
window.addEventListener('resize', resize);
resize();

/* ================= cotton texture & material ================= */
const cottonTex = RoomEnv.createFabricTextures({
  color: '#ede5d8',
  threads: 32,
  size: 512,
  repeat: 30
});

const clothMat = new THREE.MeshStandardMaterial({
  color: 0xf6f0e6,
  map: cottonTex.map,
  bumpMap: cottonTex.bumpMap,
  bumpScale: 0.001,
  roughness: 0.90,
  metalness: 0.0,
  side: THREE.DoubleSide
});

/* ================= cloth mesh ================= */
let activeCloth = null;
let clothMesh = null;
const pinMarkers = [];
const pinMat = new THREE.MeshPhysicalMaterial({ color: 0xd4a047, roughness: 0.22, metalness: 0.85, clearcoat: 0.15 });
const pinGeom = new THREE.SphereGeometry(0.04, 16, 16);

function buildClothMesh(cloth){
  if (clothMesh) { scene.remove(clothMesh); clothMesh.geometry.dispose(); }
  for (const m of pinMarkers) scene.remove(m);
  pinMarkers.length = 0;

  const { nx, ny } = cloth;
  const geom = new THREE.BufferGeometry();
  const posArr = new Float32Array(nx * ny * 3);
  const uvs = new Float32Array(nx * ny * 2);
  const indices = [];

  for (let j = 0; j < ny; j++){
    for (let i = 0; i < nx; i++){
      const idx = j * nx + i;
      uvs[idx * 2] = i / (nx - 1);
      uvs[idx * 2 + 1] = 1 - j / (ny - 1);
      if (i < nx - 1 && j < ny - 1){
        const a = idx, b = idx + 1, c = idx + nx, d = idx + nx + 1;
        indices.push(a, c, b);
        indices.push(b, c, d);
      }
    }
  }

  geom.setIndex(indices);
  geom.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  geom.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

  clothMesh = new THREE.Mesh(geom, clothMat);
  clothMesh.castShadow = true;
  clothMesh.receiveShadow = true;
  scene.add(clothMesh);

  for (let k = 0; k < 2; k++){
    const pm = new THREE.Mesh(pinGeom, pinMat);
    scene.add(pm);
    pinMarkers.push(pm);
  }
}

function syncClothMesh(){
  if (!activeCloth || !clothMesh) return;
  const posAttr = clothMesh.geometry.attributes.position;
  const arr = posAttr.array;
  const parts = activeCloth.particles;
  for (let i = 0; i < parts.length; i++){
    const p = parts[i].x;
    arr[i*3] = p.x;
    arr[i*3 + 1] = p.y;
    arr[i*3 + 2] = p.z;
  }
  posAttr.needsUpdate = true;
  clothMesh.geometry.computeVertexNormals();

  if (pinMarkers[0] && parts[0]) {
    pinMarkers[0].position.copy(parts[0].x);
    pinMarkers[0].visible = activeCloth.pinned.has(0);
  }
  const rightCorner = activeCloth.nx - 1;
  if (pinMarkers[1] && parts[rightCorner]) {
    pinMarkers[1].position.copy(parts[rightCorner].x);
    pinMarkers[1].visible = activeCloth.pinned.has(rightCorner);
  }
}

/* ================= rigid cubes ================= */
const cubeSpawner = RoomEnv.createCubeSpawner({
  scene,
  world,
  palette: [0x5080b0, 0x5a9a78, 0xd06850, 0xcca038, 0x8a6cb0],
  maxCubes: 20,
  sizeRange: 0.38,
  spawnPos: (b) => new V((Math.random() - 0.5) * b.hx * 0.7, b.hy * 0.7, -b.d * 0.5)
});

/* ================= scene init ================= */
let pinsActive = true;
let selfColActive = false;

function initScene(){
  cubeSpawner.clear();
  world.clear();
  world.selfCollision = selfColActive;

  // High-resolution cloth: 48x48 particles (doubled segment density from 24x24)
  const nx = 48, ny = 48;
  activeCloth = world.addCloth({
    nx, ny,
    width: 1.6, height: 1.6,
    center: new V(0, box.hy * 0.35, -box.d * 0.5),
    mass: 1.6,
    compliance: 0.000004,     // Inextensible regularized cotton warp & weft
    shearCompliance: 0.02,    // Natural diagonal weave drape
    bendCompliance: 0,        // Zero paper spring-back
    pinnedCorners: pinsActive ? [0, nx - 1] : []
  });

  buildClothMesh(activeCloth);
  syncClothMesh();
  document.getElementById('pins').textContent = pinsActive ? 'Unpin' : 'Pin Top';
}
initScene();

/* ================= input & raycast cloth grabbing ================= */
const dragger = RoomEnv.createParticleDragger({
  camera,
  world,
  getTargetParticles: () => activeCloth ? activeCloth.particles : null,
  pickRadius: 0.20
});

RoomEnv.setupMotionSensors({
  world,
  onPointerDrag: dragger.handlePointer
});

/* ================= HUD button listeners ================= */
function togglePins() {
  if (!activeCloth) return;
  pinsActive = !pinsActive;
  activeCloth.togglePin(0);
  activeCloth.togglePin(activeCloth.nx - 1);
  document.getElementById('pins').textContent = pinsActive ? 'Unpin' : 'Pin Top';
}

function toggleSelfCol() {
  selfColActive = !selfColActive;
  world.selfCollision = selfColActive;
  const selfColBtn = document.getElementById('selfcol');
  selfColBtn.textContent = selfColActive ? 'Self Collision: On' : 'Self Collision: Off';
  selfColBtn.classList.toggle('active', selfColActive);
  RoomEnv.showNote(selfColActive ? 'Self collision enabled' : 'Self collision disabled', 1500);
}

function shake() {
  for (const p of particles){
    if (p.invM > 0){
      p.v.add(new V((Math.random() - 0.5) * 4, Math.random() * 3.5, (Math.random() - 0.5) * 2));
    }
  }
  for (const b of bodies){
    b.v.add(new V((Math.random() - 0.5) * 4, Math.random() * 3, (Math.random() - 0.3) * 2));
    b.w.add(new V((Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15));
  }
}

document.getElementById('pins').addEventListener('click', togglePins);
document.getElementById('selfcol').addEventListener('click', toggleSelfCol);
document.getElementById('cube').addEventListener('click', () => cubeSpawner.spawnCube());
document.getElementById('reset').addEventListener('click', initScene);
document.getElementById('shake').addEventListener('click', shake);

// Desktop keyboard shortcuts
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); cubeSpawner.spawnCube(); }
  else if (e.key === 'p' || e.key === 'P') togglePins();
  else if (e.key === 'c' || e.key === 'C') toggleSelfCol();
  else if (e.key === 'r' || e.key === 'R') initScene();
  else if (e.key === 's' || e.key === 'S') shake();
});

/* ================= animation loop ================= */
const tickFps = RoomEnv.createFpsMeter();
let acc = 0, last = performance.now();

function frame(now){
  tickFps(now);
  acc += Math.min((now - last) / 1000, 0.1);
  last = now;
  let n = 0;
  while (acc >= world.dt && n < 3){ world.step(); acc -= world.dt; n++; }
  if (n === 3) acc = 0;

  syncClothMesh();
  cubeSpawner.sync();

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
