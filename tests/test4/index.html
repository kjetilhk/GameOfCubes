<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Test 4: Cloth Over Sphere - XPBD Dynamics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../src/common.css">
<style>
  #cloth-controls {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top, 0px));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 5px;
    background: rgba(14, 19, 26, 0.78);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    padding: 7px 14px;
    z-index: 4;
    pointer-events: auto;
  }

  .cloth-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .cloth-dial {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 96px;
  }

  .cloth-dial-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }

  .cloth-dial-val {
    color: #f2b632;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.70rem;
  }

  .cloth-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.18);
    outline: none;
    cursor: pointer;
    margin: 2px 0;
  }

  .cloth-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #f2b632;
    border: 2px solid #ffffff;
    box-shadow: 0 0 6px rgba(242, 182, 50, 0.7);
    cursor: pointer;
  }

  .cloth-slider::-moz-range-thumb {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #f2b632;
    border: 2px solid #ffffff;
    box-shadow: 0 0 6px rgba(242, 182, 50, 0.7);
    cursor: pointer;
  }

  #note {
    top: calc(92px + env(safe-area-inset-top, 0px));
  }

  @media (max-width: 720px) {
    #cloth-controls {
      top: calc(44px + env(safe-area-inset-top, 0px));
      width: calc(100% - 20px);
      max-width: 420px;
      padding: 6px 10px;
      gap: 4px;
    }
    .cloth-row {
      justify-content: space-between;
      gap: 8px;
    }
    .cloth-dial {
      flex: 1;
      min-width: 0;
    }
    #note {
      top: calc(124px + env(safe-area-inset-top, 0px));
    }
  }
</style>
</head>
<body>
<div id="fps">-- FPS</div>
<div id="note"></div>

<div id="cloth-controls">
  <div class="cloth-row">
    <div class="cloth-dial">
      <div class="cloth-dial-header">
        <span>Stretch</span>
        <span id="val-stretch" class="cloth-dial-val">10%</span>
      </div>
      <input id="slider-stretch" class="cloth-slider" type="range" min="0" max="100" step="1" value="10">
    </div>
    <div class="cloth-dial">
      <div class="cloth-dial-header">
        <span>Shear</span>
        <span id="val-shear" class="cloth-dial-val">20%</span>
      </div>
      <input id="slider-shear" class="cloth-slider" type="range" min="0" max="100" step="1" value="20">
    </div>
    <div class="cloth-dial">
      <div class="cloth-dial-header">
        <span>Bending</span>
        <span id="val-bend" class="cloth-dial-val">0%</span>
      </div>
      <input id="slider-bend" class="cloth-slider" type="range" min="0" max="100" step="1" value="0">
    </div>
  </div>
  <div class="cloth-row">
    <div class="cloth-dial">
      <div class="cloth-dial-header">
        <span>Friction</span>
        <span id="val-friction" class="cloth-dial-val">28%</span>
      </div>
      <input id="slider-friction" class="cloth-slider" type="range" min="0" max="100" step="1" value="28">
    </div>
    <div class="cloth-dial">
      <div class="cloth-dial-header">
        <span>Damping</span>
        <span id="val-damping" class="cloth-dial-val">0.8</span>
      </div>
      <input id="slider-damping" class="cloth-slider" type="range" min="0" max="3.0" step="0.1" value="0.8">
    </div>
    <div class="cloth-dial">
      <div class="cloth-dial-header">
        <span>Mass</span>
        <span id="val-mass" class="cloth-dial-val">1.5kg</span>
      </div>
      <input id="slider-mass" class="cloth-slider" type="range" min="0.2" max="5.0" step="0.1" value="1.5">
    </div>
  </div>
</div>

<div id="hud">
  <a id="back" href="../../">← Tests</a>
  <button id="reset">Reset</button>
  <button id="selfcol" class="active">Self Collision: On</button>
  <button id="wire">Wireframe</button>
  <button id="cube">Drop Cube</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../../src/xpbd.js?v=19"></script>
<script src="../../src/room.js?v=19"></script>
<script>
(() => {
'use strict';

const V = THREE.Vector3;
const world = new XPBD.World({ dt: 1/60, substeps: 24, linearDamping: 0.8 });
world.selfCollision = true;

const { bodies, particles } = world;

/* ================= rendering & room ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 50);
const lights = RoomEnv.createLighting(scene);
let wallGroup = null;

/* ================= 3D Orbit Camera (No Gyro) ================= */
const orbitTarget = new V(0, 0.05, -1.2);
let orbitControls = null;

function resize(){
  wallGroup = RoomEnv.updateRoom(camera, renderer, world, lights, wallGroup, scene);
  if (orbitControls) orbitControls.update();
}
window.addEventListener('resize', resize);

/* ================= Obstacle: 0.7m Diameter Sphere ================= */
const sphereRadius = 0.35;
const sphereCenter = new V(0, 0.0, -1.2);
world.addSphere(sphereRadius, sphereCenter, 0.28);

const sphereMesh = new THREE.Mesh(
  new THREE.SphereGeometry(sphereRadius, 64, 48),
  new THREE.MeshPhysicalMaterial({
    color: 0x242a34,
    roughness: 0.16,
    metalness: 0.22,
    clearcoat: 0.40,
    clearcoatRoughness: 0.12
  })
);
sphereMesh.position.copy(sphereCenter);
sphereMesh.castShadow = true;
sphereMesh.receiveShadow = true;
scene.add(sphereMesh);

// Studio pedestal stand connecting sphere bottom to floor
const pedHeight = 1.5 - sphereRadius; // 1.15m
const pedRadius = 0.065;
const pedMesh = new THREE.Mesh(
  new THREE.CylinderGeometry(pedRadius, pedRadius * 1.35, pedHeight, 32),
  new THREE.MeshStandardMaterial({
    color: 0x1a1e26,
    roughness: 0.65,
    metalness: 0.12
  })
);
pedMesh.position.set(0, -1.5 + pedHeight / 2, -1.2);
pedMesh.castShadow = true;
pedMesh.receiveShadow = true;
scene.add(pedMesh);

/* ================= Procedural Woven Fabric Textures ================= */
const fabricTex = RoomEnv.createFabricTextures({
  color: '#b83b32',
  threads: 64,
  size: 512,
  repeat: 24,
  isTerracotta: true
});

const clothMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  map: fabricTex.map,
  bumpMap: fabricTex.bumpMap,
  bumpScale: 0.0012,
  roughness: 0.88,
  metalness: 0.02,
  side: THREE.DoubleSide
});

/* ================= Dynamic Cloth Mesh ================= */
let activeCloth = null;
let clothMesh = null;

function buildClothMesh(cloth){
  if (clothMesh) { scene.remove(clothMesh); clothMesh.geometry.dispose(); }

  const { nx, ny } = cloth;
  const geom = new THREE.BufferGeometry();
  const posArr = new Float32Array(nx * ny * 3);
  const uvs = new Float32Array(nx * ny * 2);
  const indices = [];

  for (let j = 0; j < ny; j++){
    for (let i = 0; i < nx; i++){
      const idx = j * nx + i;
      uvs[idx * 2] = i / (nx - 1);
      uvs[idx * 2 + 1] = 1 - j / (ny - 1);
      if (i < nx - 1 && j < ny - 1){
        const a = idx, b = idx + 1, c = idx + nx, d = idx + nx + 1;
        indices.push(a, c, b);
        indices.push(b, c, d);
      }
    }
  }

  geom.setIndex(indices);
  geom.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  geom.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

  clothMesh = new THREE.Mesh(geom, clothMat);
  clothMesh.castShadow = true;
  clothMesh.receiveShadow = true;
  scene.add(clothMesh);
}

function syncClothMesh(){
  if (!activeCloth || !clothMesh) return;
  const posAttr = clothMesh.geometry.attributes.position;
  const arr = posAttr.array;
  const parts = activeCloth.particles;
  for (let i = 0; i < parts.length; i++){
    const p = parts[i].x;
    arr[i*3] = p.x;
    arr[i*3 + 1] = p.y;
    arr[i*3 + 2] = p.z;
  }
  posAttr.needsUpdate = true;
  clothMesh.geometry.computeVertexNormals();
}

/* ================= Rigid Dropped Cubes ================= */
const cubeSpawner = RoomEnv.createCubeSpawner({
  scene,
  world,
  palette: [0x5080b0, 0x5a9a78, 0xd06850, 0xcca038, 0x8a6cb0],
  maxCubes: 16,
  sizeRange: 0.28,
  spawnPos: () => new V((Math.random() - 0.5) * 0.3, 1.25, -1.2 + (Math.random() - 0.5) * 0.3)
});

/* ================= Cloth Attribute Sliders & Mapping ================= */
const sliderStretch = document.getElementById('slider-stretch');
const valStretch = document.getElementById('val-stretch');
const sliderShear = document.getElementById('slider-shear');
const valShear = document.getElementById('val-shear');
const sliderBend = document.getElementById('slider-bend');
const valBend = document.getElementById('val-bend');
const sliderFriction = document.getElementById('slider-friction');
const valFriction = document.getElementById('val-friction');
const sliderDamping = document.getElementById('slider-damping');
const valDamping = document.getElementById('val-damping');
const sliderMass = document.getElementById('slider-mass');
const valMass = document.getElementById('val-mass');

// Map slider percentages to physical XPBD compliance & material parameters
function getStretchCompliance(pct) {
  // 0% -> 0 (rigid threads), 10% -> 0.000004 (default cotton), 100% -> 0.004 (stretchy elastic)
  return pct <= 0 ? 0 : 0.004 * Math.pow(pct / 100, 3);
}

function getShearCompliance(pct) {
  // 0% -> 0 (locked diagonal), 20% -> 0.02 (default cotton drape), 100% -> 0.10 (fluid bias folds)
  return (pct / 100) * 0.10;
}

function getBendCompliance(pct) {
  // 0% -> 0 (disabled / soft cloth), 1%..100% -> 2-hop bending stiffness from soft felt to stiff leather
  if (pct <= 0) return 0;
  return 0.02 * Math.pow(1 - pct / 100, 3) + 0.000002;
}

function applyClothAttributes() {
  const stretchPct = Number(sliderStretch.value);
  const shearPct = Number(sliderShear.value);
  const bendPct = Number(sliderBend.value);
  const frictionPct = Number(sliderFriction.value);
  const dampingVal = Number(sliderDamping.value);
  const massVal = Number(sliderMass.value);

  valStretch.textContent = stretchPct + '%';
  valShear.textContent = shearPct + '%';
  valBend.textContent = bendPct + '%';
  valFriction.textContent = frictionPct + '%';
  valDamping.textContent = dampingVal.toFixed(1);
  valMass.textContent = massVal.toFixed(1) + 'kg';

  const mu = frictionPct / 100;
  world.linearDamping = dampingVal;
  if (world.spheres.length > 0) {
    world.spheres[0].friction = mu;
  }

  if (activeCloth) {
    activeCloth.setStretchCompliance(getStretchCompliance(stretchPct));
    activeCloth.setShearCompliance(getShearCompliance(shearPct));
    activeCloth.setBendCompliance(getBendCompliance(bendPct));
    activeCloth.setFriction(mu);
    activeCloth.setMass(massVal);
  }
}

sliderStretch.addEventListener('input', applyClothAttributes);
sliderShear.addEventListener('input', applyClothAttributes);
sliderBend.addEventListener('input', applyClothAttributes);
sliderFriction.addEventListener('input', applyClothAttributes);
sliderDamping.addEventListener('input', applyClothAttributes);
sliderMass.addEventListener('input', applyClothAttributes);

/* ================= Scene Initialization ================= */
let selfColActive = true;
let wireActive = false;

function initScene(){
  cubeSpawner.clear();
  world.clear();

  const stretchPct = Number(sliderStretch.value);
  const shearPct = Number(sliderShear.value);
  const bendPct = Number(sliderBend.value);
  const mu = Number(sliderFriction.value) / 100;
  const dampingVal = Number(sliderDamping.value);
  const massVal = Number(sliderMass.value);

  world.linearDamping = dampingVal;
  // Re-add static sphere obstacle with current friction
  world.addSphere(sphereRadius, sphereCenter, mu);
  world.selfCollision = selfColActive;

  // Cloth: 1.5m x 1.5m horizontal plane, starts 1m above sphere center (y = 1.0m)
  const nx = 48, ny = 48;
  activeCloth = world.addCloth({
    nx, ny,
    width: 1.5, height: 1.5,
    center: new V(0, 1.0, -1.2),
    plane: 'xz',
    mass: massVal,
    compliance: getStretchCompliance(stretchPct),
    shearCompliance: getShearCompliance(shearPct),
    bendCompliance: getBendCompliance(bendPct),
    friction: mu,
    pinnedCorners: []
  });

  buildClothMesh(activeCloth);
  syncClothMesh();
}
initScene();

/* ================= Interactive Raycast Grab & Orbit Controls ================= */
const dragger = RoomEnv.createParticleDragger({
  camera,
  world,
  getTargetParticles: () => activeCloth ? activeCloth.particles : null,
  pickRadius: 0.16
});

orbitControls = RoomEnv.createOrbitControls(camera, orbitTarget, {
  dist: 3.2,
  pitch: 0.28,
  yaw: 0.0,
  minDist: 1.6,
  maxDist: 5.5,
  minPitch: -0.25,
  maxPitch: 1.25,
  onPointerDrag: dragger.handlePointer
});
resize();

/* ================= HUD Button Handlers ================= */
function toggleSelfCol(){
  selfColActive = !selfColActive;
  world.selfCollision = selfColActive;
  const selfColBtn = document.getElementById('selfcol');
  selfColBtn.textContent = selfColActive ? 'Self Collision: On' : 'Self Collision: Off';
  selfColBtn.classList.toggle('active', selfColActive);
  RoomEnv.showNote(selfColActive ? 'Cloth self-collision enabled' : 'Cloth self-collision disabled', 1500);
}

function toggleWireframe(){
  wireActive = !wireActive;
  clothMat.wireframe = wireActive;
  const wireBtn = document.getElementById('wire');
  wireBtn.classList.toggle('active', wireActive);
  wireBtn.textContent = wireActive ? 'Wireframe: On' : 'Wireframe';
}

document.getElementById('selfcol').addEventListener('click', toggleSelfCol);
document.getElementById('wire').addEventListener('click', toggleWireframe);
document.getElementById('cube').addEventListener('click', () => cubeSpawner.spawnCube());
document.getElementById('reset').addEventListener('click', () => {
  initScene();
  RoomEnv.showNote('Simulation reset. Cloth dropping over sphere.', 1500);
});

// Desktop keyboard shortcuts
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); cubeSpawner.spawnCube(); }
  else if (e.key === 'w' || e.key === 'W') toggleWireframe();
  else if (e.key === 'c' || e.key === 'C') toggleSelfCol();
  else if (e.key === 'r' || e.key === 'R') initScene();
});

/* ================= Animation Loop ================= */
const tickFps = RoomEnv.createFpsMeter();
let acc = 0, last = performance.now();

function frame(now){
  tickFps(now);
  acc += Math.min((now - last) / 1000, 0.1);
  last = now;
  let n = 0;
  while (acc >= world.dt && n < 3){ world.step(); acc -= world.dt; n++; }
  if (n === 3) acc = 0;

  syncClothMesh();
  cubeSpawner.sync();

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

RoomEnv.showNote('Cloth dropping over 0.7m sphere. Drag background to orbit camera, or grab cloth to lift.', 4500);

})();
</script>
</body>
</html>
