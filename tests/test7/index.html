<style>
  #hud {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: calc(14px + env(safe-area-inset-left, 0px));
    bottom: auto;
    right: auto;
    width: auto;
    padding: 0;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;

  .hud-btn {
    background: rgba(18, 22, 30, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.18);

    border-radius: 999px;
    font-family: inherit;
    font-size: 0.82rem;

    -webkit-user-select: none;
  }
  .hud-btn:hover {
    background: rgba(0, 229, 255, 0.22);
    border-color: rgba(0, 229, 255, 0.60);
    color: #ffffff;
  }
  .hud-btn:active {
    background: rgba(0, 229, 255, 0.35);
    border-color: rgba(0, 229, 255, 0.90);
  }

  /* Compact low-profile analog joystick at bottom center */
  #joystick-container {
    position: fixed;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    z-index: 30;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: auto;
  }

  #joystick-base {
    width: 82px;
    height: 82px;
    border-radius: 50%;
    background: rgba(14, 18, 26, 0.45);
    border: 1.5px solid rgba(0, 229, 255, 0.35);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    position: relative;
    touch-action: none;
    cursor: grab;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  }
  #joystick-base:active {
    cursor: grabbing;

    box-shadow: 0 2px 10px rgba(0, 229, 255, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.8);

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../../src/xpbd.js?v=9"></script>
<script src="../../src/room.js?v=9"></script>
<script src="../../src/car.js?v=9"></script>
<script>
(() => {
'use strict';

const V = THREE.Vector3;

/* ================= XPBD World Physics Engine ================= */
// Tuned with low friction and high restitution so crash cubes react dynamically
const world = new XPBD.World({
  dt: 1/60,
  substeps: 20,
  positionIterations: 3,
  velocityIterations: 2,
  muStatic: 0.28,    // Low static friction - cubes slide easily upon impact
  muDynamic: 0.20,   // Low dynamic friction - cubes tumble and skid smoothly
  restitution: 0.45, // Bouncy contact restitution
  density: 35,       // Lightweight: mass ~0.5 - 1.0 kg (vs 4.2 kg car)
  linearDamping: 0.15,
  angularDamping: 0.40
});

/* ================= Open World Boundary Setup ================= */
// Centered boundary box (no collision wall at z = 0)
function setOpenWorldBounds() {
  world.box.hx = 90;
  world.box.hy = 1.5;
  world.box.d = 180;
  world.walls = [
    { n: new V( 1, 0, 0), o: -90 },  // Left: x >= -90
    { n: new V(-1, 0, 0), o: -90 },  // Right: x <= 90
    { n: new V( 0, 1, 0), o: -1.5 }, // Ground floor: y >= -1.5
    { n: new V( 0,-1, 0), o: -60 },  // High ceiling: y <= 60
    { n: new V( 0, 0, 1), o: -90 },  // Back: z >= -90
    { n: new V( 0, 0,-1), o: -90 }   // Front: z <= 90
  ];
  world.center.set(0, 0, 0);
}
setOpenWorldBounds();

/* ================= Rendering & Studio Setup ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1117);
scene.fog = new THREE.FogExp2(0x0e1117, 0.012);

const camera = new THREE.PerspectiveCamera(44, 1, 0.05, 180);

// Overhead Directional Light with soft PCF contact shadows around buggy, jumps & cubes
const sunLight = new THREE.DirectionalLight(0xfff5ea, 0.95);
sunLight.position.set(4, 22, 3);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 55;
sunLight.shadow.camera.left = -14;
sunLight.shadow.camera.right = 14;
sunLight.shadow.camera.top = 14;
sunLight.shadow.camera.bottom = -14;
sunLight.shadow.bias = -0.0002;
sunLight.shadow.normalBias = 0.02;
sunLight.shadow.radius = 2.0;
scene.add(sunLight);
scene.add(sunLight.target);

const fillLight = new THREE.DirectionalLight(0x7090b0, 0.45);
fillLight.position.set(-20, 20, -20);
scene.add(fillLight);

const ambLight = new THREE.AmbientLight(0x222a36, 0.65);
scene.add(ambLight);

// Vast Open Ground Plane
const groundGeom = new THREE.PlaneGeometry(180, 180);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x13171f,
  roughness: 0.88,
  metalness: 0.08,
  side: THREE.DoubleSide
});
const groundMesh = new THREE.Mesh(groundGeom, groundMat);
groundMesh.rotation.x = -Math.PI / 2;
groundMesh.position.y = -1.5;
groundMesh.receiveShadow = true;
scene.add(groundMesh);

// Visual Grid on Ground Plane
const grid = new THREE.GridHelper(180, 90, 0x00e5ff, 0x1c222d);
grid.position.y = -1.498;
scene.add(grid);

function resize() {
  const W = window.innerWidth, H = window.innerHeight;
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  setOpenWorldBounds();
}
window.addEventListener('resize', resize);
resize();

// Strictly disable phone gyro / accelerometer sensors for Test 7
window.addEventListener('devicemotion', e => e.stopImmediatePropagation(), true);
window.addEventListener('deviceorientation', e => e.stopImmediatePropagation(), true);

/* ================= 2X FIGURE-8 RACETRACK WITH INNER & OUTER BORDERS ================= */
// Dimensions doubled: Rx = 14m, Rz = 24m (Span: 48m long x 28m wide)
// Road lane width: 3.8m with distinct 3D inner and outer border curbs
const trackGroup = new THREE.Group();
scene.add(trackGroup);

const Rx = 14.0, Rz = 24.0;
const trackWidth = 3.8;
const halfW = trackWidth * 0.5;
const N_SEGS = 220;

const roadPositions = [];
const roadNormals = [];
const roadUvs = [];
const roadIndices = [];

const innerPositions = [];
const innerColors = [];
const innerIndices = [];
let innerVertCount = 0;

const outerPositions = [];
const outerColors = [];
const outerIndices = [];
let outerVertCount = 0;

const linePositions = [];
const lineIndices = [];
let lineVertCount = 0;

for (let i = 0; i <= N_SEGS; i++) {
  const t = (i / N_SEGS) * Math.PI * 2;
  const xc = Rx * Math.sin(2 * t);
  const zc = Rz * Math.sin(t);

  const dx = 2 * Rx * Math.cos(2 * t);
  const dz = Rz * Math.cos(t);
  const len = Math.hypot(dx, dz);
  const nx = -dz / len;
  const nz = dx / len;

  const lx = xc + nx * halfW;
  const lz = zc + nz * halfW;
  const rx = xc - nx * halfW;
  const rz = zc - nz * halfW;

  roadPositions.push(lx, -1.492, lz);
  roadPositions.push(rx, -1.492, rz);
  roadNormals.push(0, 1, 0, 0, 1, 0);
  roadUvs.push(0, i / 5, 1, i / 5);

  if (i < N_SEGS) {
    const v0 = i * 2, v1 = i * 2 + 1, v2 = (i + 1) * 2, v3 = (i + 1) * 2 + 1;
    roadIndices.push(v0, v1, v2);
    roadIndices.push(v2, v1, v3);

    const distCenter = Math.hypot(xc, zc);
    const isRed = (Math.floor(i / 2) % 2) === 0;
    const r = isRed ? 0.95 : 0.95;
    const g = isRed ? 0.16 : 0.95;
    const b = isRed ? 0.22 : 0.98;

    const tNext = ((i + 1) / N_SEGS) * Math.PI * 2;
    const xcN = Rx * Math.sin(2 * tNext), zcN = Rz * Math.sin(tNext);
    const dxN = 2 * Rx * Math.cos(2 * tNext), dzN = Rz * Math.cos(tNext);
    const lenN = Math.hypot(dxN, dzN);
    const nxN = -dzN / lenN, nzN = dxN / lenN;

    const lxN = xcN + nxN * halfW, lzN = zcN + nzN * halfW;
    const rxN = xcN - nxN * halfW, rzN = zcN - nzN * halfW;

    const kw = 0.32; // curb width

    // 1. INNER BORDER (Raised 3D curb along inner edge facing loop infield)
    // Runs all the way around each loop, opening only at central intersection
    if (distCenter > 3.6) {
      const k0 = innerVertCount;
      // Beveled curb face
      innerPositions.push(lx, -1.492, lz);
      innerPositions.push(lx + nx * (kw * 0.5), -1.38, lz + nz * (kw * 0.5));
      innerPositions.push(lxN, -1.492, lzN);
      innerPositions.push(lxN + nxN * (kw * 0.5), -1.38, lzN + nzN * (kw * 0.5));

      innerPositions.push(lx + nx * (kw * 0.5), -1.38, lz + nz * (kw * 0.5));
      innerPositions.push(lx + nx * kw, -1.492, lz + nz * kw);
      innerPositions.push(lxN + nxN * (kw * 0.5), -1.38, lzN + nzN * (kw * 0.5));
      innerPositions.push(lxN + nxN * kw, -1.492, lzN + nzN * kw);

      for (let c = 0; c < 8; c++) innerColors.push(r, g, b);
      innerIndices.push(k0, k0+1, k0+2, k0+2, k0+1, k0+3);
      innerIndices.push(k0+4, k0+5, k0+6, k0+6, k0+5, k0+7);
      innerVertCount += 8;
    }

    // 2. OUTER BORDER (Raised 3D curb along perimeter edge of racetrack)
    if (distCenter > 3.6) {
      const k0 = outerVertCount;
      outerPositions.push(rx, -1.492, rz);
      outerPositions.push(rx - nx * (kw * 0.5), -1.38, rz - nz * (kw * 0.5));
      outerPositions.push(rxN, -1.492, rzN);
      outerPositions.push(rxN - nxN * (kw * 0.5), -1.38, rzN - nzN * (kw * 0.5));

      outerPositions.push(rx - nx * (kw * 0.5), -1.38, rz - nz * (kw * 0.5));
      outerPositions.push(rx - nx * kw, -1.492, rz - nz * kw);
      outerPositions.push(rxN - nxN * (kw * 0.5), -1.38, rzN - nzN * (kw * 0.5));
      outerPositions.push(rxN - nxN * kw, -1.492, rzN - nzN * kw);

      for (let c = 0; c < 8; c++) outerColors.push(r, g, b);
      outerIndices.push(k0, k0+1, k0+2, k0+2, k0+1, k0+3);
      outerIndices.push(k0+4, k0+5, k0+6, k0+6, k0+5, k0+7);
      outerVertCount += 8;
    }

    // 3. Yellow Dashed Centerline on straights
    if (distCenter > 2.8 && (i % 4 < 2)) {
      const lw = 0.08;
      const ly = -1.490;
      const l0 = lineVertCount;
      linePositions.push(xc + nx * lw, ly, zc + nz * lw);
      linePositions.push(xc - nx * lw, ly, zc - nz * lw);
      linePositions.push(xcN + nxN * lw, ly, zcN + nzN * lw);
      linePositions.push(xcN - nxN * lw, ly, zcN - nzN * lw);

      lineIndices.push(l0, l0 + 1, l0 + 2, l0 + 2, l0 + 1, l0 + 3);
      lineVertCount += 4;
    }
  }
}

// Assemble Road Asphalt Mesh
const roadGeom = new THREE.BufferGeometry();
roadGeom.setAttribute('position', new THREE.Float32BufferAttribute(roadPositions, 3));
roadGeom.setAttribute('normal', new THREE.Float32BufferAttribute(roadNormals, 3));
roadGeom.setAttribute('uv', new THREE.Float32BufferAttribute(roadUvs, 2));
roadGeom.setIndex(roadIndices);
const roadMat = new THREE.MeshStandardMaterial({
  color: 0x1a1e27,
  roughness: 0.82,
  metalness: 0.12,
  side: THREE.DoubleSide
});
const roadMesh = new THREE.Mesh(roadGeom, roadMat);
roadMesh.receiveShadow = true;
trackGroup.add(roadMesh);

// Assemble Inner Border Curb Mesh
const innerGeom = new THREE.BufferGeometry();
innerGeom.setAttribute('position', new THREE.Float32BufferAttribute(innerPositions, 3));
innerGeom.setAttribute('color', new THREE.Float32BufferAttribute(innerColors, 3));
innerGeom.setIndex(innerIndices);
innerGeom.computeVertexNormals();
const borderMat = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.45,
  metalness: 0.08,
  side: THREE.DoubleSide
});
const innerMesh = new THREE.Mesh(innerGeom, borderMat);
innerMesh.receiveShadow = true;
trackGroup.add(innerMesh);

// Assemble Outer Border Curb Mesh
const outerGeom = new THREE.BufferGeometry();
outerGeom.setAttribute('position', new THREE.Float32BufferAttribute(outerPositions, 3));
outerGeom.setAttribute('color', new THREE.Float32BufferAttribute(outerColors, 3));
outerGeom.setIndex(outerIndices);
outerGeom.computeVertexNormals();
const outerMesh = new THREE.Mesh(outerGeom, borderMat);
outerMesh.receiveShadow = true;
trackGroup.add(outerMesh);

// Assemble Centerline Mesh
const lineGeom = new THREE.BufferGeometry();
lineGeom.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
lineGeom.setIndex(lineIndices);
lineGeom.computeVertexNormals();
const lineMat = new THREE.MeshBasicMaterial({ color: 0xffd700, side: THREE.DoubleSide });
trackGroup.add(new THREE.Mesh(lineGeom, lineMat));

// Checkered Start / Finish Line across full 3.8m lane width
const startFinishGroup = new THREE.Group();
const sfChecks = 10;
const sfLen = 0.6;
for (let c = 0; c < sfChecks; c++) {
  for (let r = 0; r < 2; r++) {
    const isWhite = (c + r) % 2 === 0;
    const checkGeom = new THREE.PlaneGeometry(trackWidth / sfChecks, sfLen / 2);
    const checkMat = new THREE.MeshBasicMaterial({ color: isWhite ? 0xf0f4f8 : 0x11141a, side: THREE.DoubleSide });
    const checkMesh = new THREE.Mesh(checkGeom, checkMat);
    checkMesh.rotation.x = -Math.PI / 2;
    checkMesh.position.set(
      -trackWidth / 2 + (c + 0.5) * (trackWidth / sfChecks),
      -1.489,
      (r - 0.5) * (sfLen / 2)
    );
    startFinishGroup.add(checkMesh);
  }
}
startFinishGroup.position.set(0, 0, -2.5);
trackGroup.add(startFinishGroup);

// Infield Island Turf Beds (North & South Loop Interiors)
const turfMat = new THREE.MeshStandardMaterial({ color: 0x15221b, roughness: 0.90, metalness: 0.05, side: THREE.DoubleSide });
const northTurfGeom = new THREE.CircleGeometry(8.5, 32);
const northTurfMesh = new THREE.Mesh(northTurfGeom, turfMat);
northTurfMesh.rotation.x = -Math.PI / 2;
northTurfMesh.position.set(0, -1.496, 13.5);
northTurfMesh.receiveShadow = true;
trackGroup.add(northTurfMesh);

const southTurfGeom = new THREE.CircleGeometry(8.5, 32);
const southTurfMesh = new THREE.Mesh(southTurfGeom, turfMat);
southTurfMesh.rotation.x = -Math.PI / 2;
southTurfMesh.position.set(0, -1.496, -13.5);
southTurfMesh.receiveShadow = true;
trackGroup.add(southTurfMesh);

// Corner Apex Cones
const coneGeom = new THREE.ConeGeometry(0.18, 0.42, 12);
const coneMat = new THREE.MeshStandardMaterial({ color: 0xff4500, roughness: 0.35, side: THREE.DoubleSide });
const apexPositions = [
  [0, 23.5],
  [13.5, 0.0],
  [0, -23.5],
  [-13.5, 0.0]
];
for (const [cx, cz] of apexPositions) {
  const cone = new THREE.Mesh(coneGeom, coneMat);
  cone.position.set(cx, -1.5 + 0.21, cz);
  cone.castShadow = true;
  trackGroup.add(cone);
}

/* ================= Jumps & Ramps Physics System ================= */
class Ramp {
  constructor({
    x = 0,
    z = 0,
    width = 3.8,
    length = 4.2,
    height = 0.60,
    heading = 0,
    type = 'tabletop'
  } = {}) {
    this.x = x;
    this.z = z;
    this.width = width;
    this.length = length;
    this.height = height;
    this.heading = heading;
    this.type = type;
    this.cos = Math.cos(heading);
    this.sin = Math.sin(heading);
    this.floorY = -1.5;
  }

  getHeight(px, pz) {
    const dx = px - this.x;
    const dz = pz - this.z;
    const u = dx * this.cos - dz * this.sin;
    const v = dx * this.sin + dz * this.cos;
    if (Math.abs(u) > this.width * 0.5 || Math.abs(v) > this.length * 0.5) return null;
    const s = (v + this.length * 0.5) / this.length;
    if (this.type === 'tabletop') {
      if (s < 0.40) return this.floorY + (s / 0.40) * this.height;
      if (s < 0.60) return this.floorY + this.height;
      return this.floorY + ((1.0 - s) / 0.40) * this.height;
    } else { // wedge kicker ramp
      return this.floorY + s * this.height;
    }
  }
}

function buildRampMesh(ramp) {
  const W = ramp.width, L = ramp.length, H = ramp.height;
  const halfW = W * 0.5;
  const positions = [];
  const indices = [];

  function addQuad(p0, p1, p2, p3) {
    const idx = positions.length / 3;
    positions.push(...p0, ...p1, ...p2, ...p3);
    indices.push(idx, idx + 1, idx + 2, idx + 2, idx + 1, idx + 3);
  }

  function addTri(p0, p1, p2) {
    const idx = positions.length / 3;
    positions.push(...p0, ...p1, ...p2);
    indices.push(idx, idx + 1, idx + 2);
  }

  if (ramp.type === 'tabletop') {
    const z0 = -L * 0.5, y0 = 0;
    const z1 = -L * 0.5 + L * 0.40, y1 = H;
    const z2 = -L * 0.5 + L * 0.60, y2 = H;
    const z3 = L * 0.5, y3 = 0;

    addQuad([-halfW, y0, z0], [halfW, y0, z0], [-halfW, y1, z1], [halfW, y1, z1]);
    addQuad([-halfW, y1, z1], [halfW, y1, z1], [-halfW, y2, z2], [halfW, y2, z2]);
    addQuad([-halfW, y2, z2], [halfW, y2, z2], [-halfW, y3, z3], [halfW, y3, z3]);

    addTri([-halfW, y0, z0], [-halfW, y1, z1], [-halfW, y0, z1]);
    addQuad([-halfW, y0, z1], [-halfW, y1, z1], [-halfW, y0, z2], [-halfW, y2, z2]);
    addTri([-halfW, y0, z2], [-halfW, y2, z2], [-halfW, y3, z3]);

    addTri([halfW, y1, z1], [halfW, y0, z0], [halfW, y0, z1]);
    addQuad([halfW, y1, z1], [halfW, y0, z1], [halfW, y2, z2], [halfW, y0, z2]);
    addTri([halfW, y2, z2], [halfW, y0, z2], [halfW, y3, z3]);

    addQuad([-halfW, y0, z3], [halfW, y0, z3], [-halfW, y0, z0], [halfW, y0, z0]);
  } else {
    const z0 = -L * 0.5, y0 = 0;
    const z1 = L * 0.5, y1 = H;

    addQuad([-halfW, y0, z0], [halfW, y0, z0], [-halfW, y1, z1], [halfW, y1, z1]);
    addQuad([halfW, y0, z1], [-halfW, y0, z1], [halfW, y1, z1], [-halfW, y1, z1]);
    addTri([-halfW, y0, z0], [-halfW, y1, z1], [-halfW, y0, z1]);
    addTri([halfW, y0, z0], [halfW, y0, z1], [halfW, y1, z1]);
    addQuad([-halfW, y0, z1], [halfW, y0, z1], [-halfW, y0, z0], [halfW, y0, z0]);
  }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geom.setIndex(indices);
  geom.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    color: ramp.type === 'wedge' ? 0x2e3848 : 0x222a36,
    roughness: 0.65,
    metalness: 0.20,
    side: THREE.DoubleSide
  });

  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.set(ramp.x, -1.5, ramp.z);
  mesh.rotation.y = ramp.heading;
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  // Add decorative neon hazard trim along ramp edges
  const edgeGeom = new THREE.BoxGeometry(ramp.width * 0.98, 0.04, 0.08);
  const edgeMat = new THREE.MeshBasicMaterial({ color: ramp.type === 'wedge' ? 0xff2a40 : 0x00e5ff, side: THREE.DoubleSide });
  const edgeMesh = new THREE.Mesh(edgeGeom, edgeMat);
  edgeMesh.position.set(0, ramp.height, ramp.type === 'wedge' ? ramp.length * 0.48 : 0);
  mesh.add(edgeMesh);

  return mesh;
}

// 1. North Straight Tabletop Jump (launch along North approach straight)
const ramp1 = new Ramp({
  x: 8.5,
  z: 8.0,
  width: 3.8,
  length: 4.6,
  height: 0.62,
  heading: 0.76,
  type: 'tabletop'
});

// 2. South Return Tabletop Jump (launch along South return straight towards origo)
const ramp2 = new Ramp({
  x: -8.5,
  z: -8.0,
  width: 3.8,
  length: 4.6,
  height: 0.62,
  heading: 0.76,
  type: 'tabletop'
});

// 3. Infield Stunt Kicker Mega Ramp (high-angle kicker aimed at cube pyramid)
const ramp3 = new Ramp({
  x: -5.5,
  z: 4.5,
  width: 3.2,
  length: 3.2,
  height: 0.72,
  heading: 0.55,
  type: 'wedge'
});

world.ramps = [ramp1, ramp2, ramp3];
scene.add(buildRampMesh(ramp1));
scene.add(buildRampMesh(ramp2));
scene.add(buildRampMesh(ramp3));

/* ================= 32 DYNAMIC CRASHABLE CUBES ON THE TRACK ================= */
const cubeBodies = [];
const cubeMeshes = [];
const cubeInitialStates = [];

const CUBE_COLORS = [
  0xff5722, // Blaze Orange
  0xffc107, // Racing Amber
  0x00e676, // Neon Emerald
  0xff1744, // Crimson Red
  0x00b0ff, // Azure Blue
  0xd500f9  // Electric Purple
];

const cubeMatMap = new Map();
function getCubeMaterial(color) {
  if (!cubeMatMap.has(color)) {
    cubeMatMap.set(color, new THREE.MeshPhysicalMaterial({
      color: color,
      roughness: 0.25,
      metalness: 0.10,
      clearcoat: 0.75,
      clearcoatRoughness: 0.10,
      side: THREE.DoubleSide
    }));
  }
  return cubeMatMap.get(color);
}

function spawnCrashCube(size, x, y, z, colorIndex = 0) {
  const b = world.addCube(size, new V(x, y, z));
  // Lightweight mass so crashing at speed creates explosive dynamic momentum transfer
  const m = 28 * size * size * size; // mass ~ 0.5 - 1.1 kg
  b.invM = 1 / m;
  b.invI = 6 / (m * size * size);

  const geom = new THREE.BoxGeometry(size, size, size);
  const mat = getCubeMaterial(CUBE_COLORS[colorIndex % CUBE_COLORS.length]);
  const mesh = new THREE.Mesh(geom, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);

  cubeBodies.push(b);
  cubeMeshes.push(mesh);
  cubeInitialStates.push({
    body: b,
    initX: new V(x, y, z),
    initQ: new THREE.Quaternion(0, 0, 0, 1),
    size: size
  });

  return b;
}

let cIdx = 0;

// 1. Formation 1: North Straight Crash Barrier (8 Cubes directly across roadway)
// Positioned at x = 5.8, z = 5.2 spanning across the 3.8m lane width
const bw1 = 0.38;
for (let r = 0; r < 2; r++) {
  const cy = -1.5 + bw1 * 0.5 + r * bw1;
  spawnCrashCube(bw1, 5.8 - 1.5 * bw1, cy, 5.2 - 0.8 * bw1, cIdx++);
  spawnCrashCube(bw1, 5.8 - 0.5 * bw1, cy, 5.2 - 0.2 * bw1, cIdx++);
  spawnCrashCube(bw1, 5.8 + 0.5 * bw1, cy, 5.2 + 0.2 * bw1, cIdx++);
  spawnCrashCube(bw1, 5.8 + 1.5 * bw1, cy, 5.2 + 0.8 * bw1, cIdx++);
}

// 2. Formation 2: South Straight Crash Barrier (8 Cubes directly across roadway)
const bw2 = 0.38;
for (let r = 0; r < 2; r++) {
  const cy = -1.5 + bw2 * 0.5 + r * bw2;
  spawnCrashCube(bw2, -5.8 - 1.5 * bw2, cy, -5.2 + 0.8 * bw2, cIdx++);
  spawnCrashCube(bw2, -5.8 - 0.5 * bw2, cy, -5.2 + 0.2 * bw2, cIdx++);
  spawnCrashCube(bw2, -5.8 + 0.5 * bw2, cy, -5.2 - 0.2 * bw2, cIdx++);
  spawnCrashCube(bw2, -5.8 + 1.5 * bw2, cy, -5.2 - 0.8 * bw2, cIdx++);
}

// 3. Formation 3: Stunt Jump Landing Pyramid (6 Cubes in flight path of Ramp 1)
const s3 = 0.36;
const jpx = 11.2, jpz = 11.0;
// Row 1 (3 cubes)
spawnCrashCube(s3, jpx - s3, -1.5 + s3 * 0.5, jpz - s3 * 0.5, cIdx++);
spawnCrashCube(s3, jpx, -1.5 + s3 * 0.5, jpz, cIdx++);
spawnCrashCube(s3, jpx + s3, -1.5 + s3 * 0.5, jpz + s3 * 0.5, cIdx++);
// Row 2 (2 cubes)
spawnCrashCube(s3, jpx - s3 * 0.5, -1.5 + s3 * 1.5, jpz - s3 * 0.25, cIdx++);
spawnCrashCube(s3, jpx + s3 * 0.5, -1.5 + s3 * 1.5, jpz + s3 * 0.25, cIdx++);
// Row 3 (1 apex cube)
spawnCrashCube(s3, jpx, -1.5 + s3 * 2.5, jpz, cIdx++);

// 4. Formation 4: North Turn Apex Drift Pyramid (6 Cubes on apex curve)
const s4 = 0.38;
const ax = 0.0, az = 24.0;
spawnCrashCube(s4, ax - s4, -1.5 + s4 * 0.5, az, cIdx++);
spawnCrashCube(s4, ax, -1.5 + s4 * 0.5, az, cIdx++);
spawnCrashCube(s4, ax + s4, -1.5 + s4 * 0.5, az, cIdx++);
spawnCrashCube(s4, ax - s4 * 0.5, -1.5 + s4 * 1.5, az, cIdx++);
spawnCrashCube(s4, ax + s4 * 0.5, -1.5 + s4 * 1.5, az, cIdx++);
spawnCrashCube(s4, ax, -1.5 + s4 * 2.5, az, cIdx++);

// 5. Formation 5: Central Crossover Block (4 Cubes right at center crossing)
const s5 = 0.36;
spawnCrashCube(s5, -s5 * 0.55, -1.5 + s5 * 0.5, -s5 * 0.55, cIdx++);
spawnCrashCube(s5,  s5 * 0.55, -1.5 + s5 * 0.5, -s5 * 0.55, cIdx++);
spawnCrashCube(s5, -s5 * 0.55, -1.5 + s5 * 0.5,  s5 * 0.55, cIdx++);
spawnCrashCube(s5,  s5 * 0.55, -1.5 + s5 * 0.5,  s5 * 0.55, cIdx++);

/* ================= Instantiate Reusable Buggy ================= */
const buggy = new RCCar(world, scene, {
  x: 0,
  z: -2.0,
  scale: 1.0,
  chassisMass: 4.2,
  bodyColor: 0x00e5ff, // Electric Cyan
  rimColor: 0xffb300,  // Racing Anodized Gold
  suspensionPreset: 'medium',
  maxSpeed: 13.0,
  engineForce: 58.0,
  brakeForce: 70.0,
  maxSteerAngle: 0.40,
  steerSpeed: 4.5
});
window.buggy = buggy;
window.world = world;

/* ================= Chase Camera Setup (Perfect Screen Center) ================= */
// Calibrated so buggy is centered both horizontally and vertically in screen viewport
const chaseDistance = 3.6; // distance behind buggy
const chaseHeight = 1.35;   // height above buggy
const chaseCamTarget = new V();
const currentLookAt = new V();

function updateChaseCamera(dt, targetPos = null, targetQuat = null, instant = false) {
  const chassisPos = targetPos || buggy.body.x;
  const chassisQuat = targetQuat || buggy.body.q;

  // Exact vertical and horizontal visual center of buggy body
  chaseCamTarget.copy(chassisPos).add(new V(0, 0.08, 0));

  const forwardDir = new V(0, 0, -1).applyQuaternion(chassisQuat);
  const upDir = new V(0, 1, 0).applyQuaternion(chassisQuat);

  const desiredPos = new V()
    .copy(chassisPos)
    .addScaledVector(forwardDir, -chaseDistance)
    .addScaledVector(upDir, chaseHeight);

  if (instant) {
    camera.position.copy(desiredPos);
    currentLookAt.copy(chaseCamTarget);
  } else {
    // Tight responsive follow keeps car rock-solid in screen center
    const smooth = Math.min(1.0, 18.0 * dt);
    camera.position.lerp(desiredPos, smooth);
    currentLookAt.lerp(chaseCamTarget, smooth);
  }
  camera.lookAt(currentLookAt);
}

// Position camera behind buggy immediately
updateChaseCamera(0, null, null, true);

/* ================= Reset Scene Function ================= */
function resetScene() {
  buggy.reset(0, null, -2.0);
  updateChaseCamera(0, null, null, true);
  for (const s of cubeInitialStates) {
    s.body.x.copy(s.initX);
    s.body.px.copy(s.initX);
    s.body.q.copy(s.initQ);
    s.body.pq.copy(s.initQ);
    s.body.v.set(0, 0, 0);
    s.body.w.set(0, 0, 0);
    s.body.sync();
  }
}
window.resetScene = resetScene;
document.getElementById('btn-reset').addEventListener('click', resetScene);

/* ================= Virtual Joystick Controls ================= */
const baseEl = document.getElementById('joystick-base');
const thumbEl = document.getElementById('joystick-thumb');

let activePointerId = null;
let baseCenterX = 0, baseCenterY = 0;
const maxJoystickRadius = 28; // tight deflection radius for compact 82px base

function updateJoystick(clientX, clientY) {
  let dx = clientX - baseCenterX;
  let dy = clientY - baseCenterY;
  const dist = Math.hypot(dx, dy);
  if (dist > maxJoystickRadius) {
    dx = (dx / dist) * maxJoystickRadius;
    dy = (dy / dist) * maxJoystickRadius;
  }
  thumbEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

  const rawSteer = dx / maxJoystickRadius;       // -1 (left) to +1 (right)
  const throttle = -dy / maxJoystickRadius;      // -1 (reverse) to +1 (forward)

  // Progressive exponential curve: gentle near center, full throw at edges
  const steer = Math.sign(rawSteer) * Math.pow(Math.abs(rawSteer), 1.6);

  buggy.setSteering(steer);
  buggy.setThrottle(throttle);
}

function resetJoystick() {
  thumbEl.style.transform = 'translate(-50%, -50%)';
  buggy.setSteering(0);
  buggy.setThrottle(0);
}

baseEl.addEventListener('pointerdown', e => {
  e.preventDefault();
  activePointerId = e.pointerId;
  const rect = baseEl.getBoundingClientRect();
  baseCenterX = rect.left + rect.width / 2;
  baseCenterY = rect.top + rect.height / 2;
  baseEl.setPointerCapture(e.pointerId);
  updateJoystick(e.clientX, e.clientY);
});

baseEl.addEventListener('pointermove', e => {
  if (e.pointerId === activePointerId) {
    updateJoystick(e.clientX, e.clientY);
  }
});

const endPointer = e => {
  if (e.pointerId === activePointerId) {
    activePointerId = null;
    resetJoystick();
  }
};
baseEl.addEventListener('pointerup', endPointer);
baseEl.addEventListener('pointercancel', endPointer);

/* ================= Keyboard Controls ================= */
const keys = {
  forward: false,
  reverse: false,
  left: false,
  right: false,
  brake: false
};

window.addEventListener('keydown', e => {
  if (e.repeat) return;
  switch (e.code) {
    case 'KeyW': case 'ArrowUp': keys.forward = true; break;
    case 'KeyS': case 'ArrowDown': keys.reverse = true; break;
    case 'KeyA': case 'ArrowLeft': keys.left = true; break;
    case 'KeyD': case 'ArrowRight': keys.right = true; break;
    case 'Space': keys.brake = true; e.preventDefault(); break;
    case 'KeyR': resetScene(); break;
    case 'KeyF': buggy.flipUpright(); break;
  }
});

window.addEventListener('keyup', e => {
  switch (e.code) {
    case 'KeyW': case 'ArrowUp': keys.forward = false; break;
    case 'KeyS': case 'ArrowDown': keys.reverse = false; break;
    case 'KeyA': case 'ArrowLeft': keys.left = false; break;
    case 'KeyD': case 'ArrowRight': keys.right = false; break;
    case 'Space': keys.brake = false; break;
  }
});

/* ================= Animation & Physics Loop ================= */
const tickFps = RoomEnv.createFpsMeter();
let acc = 0, last = performance.now();

// High-refresh display interpolation vectors (eliminates 60Hz-on-120Hz mobile double-imaging)
const prevBodyPos = new V().copy(buggy.body.x);
const prevBodyQuat = new THREE.Quaternion().copy(buggy.body.q);
const interpPos = new V();
const interpQuat = new THREE.Quaternion();

function frame(now) {
  tickFps(now);
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;

  // If not using touch joystick, process keyboard input and deflect visual joystick
  if (activePointerId === null) {
    let kThrottle = 0;
    if (keys.forward) kThrottle += 1.0;
    if (keys.reverse) kThrottle -= 1.0;

    let kSteer = 0;
    if (keys.left) kSteer -= 1.0;
    if (keys.right) kSteer += 1.0;

    buggy.setThrottle(kThrottle);
    buggy.setSteering(kSteer);
    buggy.setBrake(keys.brake);

    // Visual joystick thumb mirrors keyboard state
    const thumbX = kSteer * maxJoystickRadius;
    const thumbY = -kThrottle * maxJoystickRadius;
    thumbEl.style.transform = `translate(calc(-50% + ${thumbX}px), calc(-50% + ${thumbY}px))`;
  }

  // Strictly lock gravity vertically downward
  world.accel.set(0, -9.81, 0);
  world.omega.set(0, 0, 0);
  world.omegaDot.set(0, 0, 0);

  // Physics substeps with state snapshot for 120Hz/high-refresh interpolation
  acc += dt;
  let n = 0;
  prevBodyPos.copy(buggy.body.x);
  prevBodyQuat.copy(buggy.body.q);
  while (acc >= world.dt && n < 3) {
    world.step();
    buggy.step(world.dt);
    acc -= world.dt;
    n++;
  }
  if (n === 3) acc = 0;

  // High-refresh interpolation (eliminates retinal double-image ghosting on 120Hz displays)
  const alpha = Math.min(1.0, Math.max(0.0, acc / world.dt));
  interpPos.lerpVectors(prevBodyPos, buggy.body.x, n > 0 ? alpha : 1.0);
  interpQuat.slerpQuaternions(prevBodyQuat, buggy.body.q, n > 0 ? alpha : 1.0);

  // Sync visuals with interpolated transform
  buggy.updateVisuals(interpPos, interpQuat);

  // Sync all 32 dynamic crash cube visual meshes with XPBD rigid bodies
  for (let i = 0; i < cubeBodies.length; i++) {
    cubeMeshes[i].position.copy(cubeBodies[i].x);
    cubeMeshes[i].quaternion.copy(cubeBodies[i].q);
  }

  // Keep sunlight and contact shadow camera centered overhead the buggy
  sunLight.position.set(interpPos.x + 4, interpPos.y + 22, interpPos.z + 3);
  sunLight.target.position.copy(interpPos);

  // Update chase follow camera behind buggy (centered on screen)
  updateChaseCamera(dt, interpPos, interpQuat);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

RoomEnv.showNote('Race the 2x figure-8 track, smash through cube barriers & hit jumps!', 4500);

})();
</script>
