<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Test 7: RC Buggy & Suspension Dynamics — XPBD Dynamics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../src/common.css?v=5">
<style>
  #hud {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: calc(14px + env(safe-area-inset-left, 0px));
    bottom: auto;
    right: auto;
    width: auto;
    padding: 0;
    margin: 0;
    display: flex;
    gap: 10px;
    z-index: 30;
    pointer-events: auto;
  }

  /* Sleek analog joystick overlay on bottom-left */
  #joystick-container {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    left: calc(28px + env(safe-area-inset-left, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 30;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: auto;
  }

  #joystick-base {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: rgba(18, 22, 30, 0.68);
    border: 2px solid rgba(0, 229, 255, 0.40);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    position: relative;
    touch-action: none;
    cursor: grab;
    box-shadow: 0 10px 32px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 229, 255, 0.10);
  }
  #joystick-base:active {
    cursor: grabbing;
    border-color: rgba(0, 229, 255, 0.85);
  }

  #joystick-thumb {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #00e5ff 0%, #0099cc 100%);
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    box-shadow: 0 4px 18px rgba(0, 229, 255, 0.65), inset 0 2px 4px rgba(255, 255, 255, 0.7);
    transition: transform 0.05s ease-out;
  }

  #joystick-hint {
    font-family: inherit;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.50);
    pointer-events: none;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
</style>
</head>
<body>
<div id="fps">-- FPS</div>
<div id="note"></div>

<div id="hud">
  <a id="back" href="../../">← Tests</a>
</div>

<div id="joystick-container">
  <div id="joystick-base">
    <div id="joystick-thumb"></div>
  </div>
  <div id="joystick-hint">Drive with Joystick or WASD</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../../src/xpbd.js?v=5"></script>
<script src="../../src/room.js?v=5"></script>
<script src="../../src/car.js?v=5"></script>
<script>
(() => {
'use strict';

const V = THREE.Vector3;
const world = new XPBD.World({
  dt: 1/60,
  substeps: 20,
  positionIterations: 3,
  velocityIterations: 2,
  muStatic: 0.65,
  muDynamic: 0.50,
  linearDamping: 0.35,
  angularDamping: 0.75
});

/* ================= rendering & studio setup ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1117);
scene.fog = new THREE.FogExp2(0x0e1117, 0.022);

const camera = new THREE.PerspectiveCamera(44, 1, 0.05, 120);

// Open Plane 3-Point Lighting
const sunLight = new THREE.DirectionalLight(0xfff5ea, 0.95);
sunLight.position.set(15, 25, 20);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 80;
sunLight.shadow.camera.left = -25;
sunLight.shadow.camera.right = 25;
sunLight.shadow.camera.top = 25;
sunLight.shadow.camera.bottom = -25;
sunLight.shadow.bias = -0.0004;
sunLight.shadow.radius = 2.0;
scene.add(sunLight);

const fillLight = new THREE.DirectionalLight(0x7090b0, 0.45);
fillLight.position.set(-15, 15, -15);
scene.add(fillLight);

const ambLight = new THREE.AmbientLight(0x222a36, 0.65);
scene.add(ambLight);

// Vast Open Ground Plane
const groundGeom = new THREE.PlaneGeometry(120, 120);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x161a22,
  roughness: 0.78,
  metalness: 0.12
});
const groundMesh = new THREE.Mesh(groundGeom, groundMat);
groundMesh.rotation.x = -Math.PI / 2;
groundMesh.position.y = -1.5;
groundMesh.receiveShadow = true;
scene.add(groundMesh);

// Sleek Visual Grid on Ground Plane
const grid = new THREE.GridHelper(120, 120, 0x00e5ff, 0x252c38);
grid.position.y = -1.498;
scene.add(grid);

function resize(){
  const W = window.innerWidth, H = window.innerHeight;
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  world.setBox(40, 1.5, 40); // Floor at -1.5, wide open 80m x 80m driving plane
}
window.addEventListener('resize', resize);
resize();

// Strictly disable phone gyro / accelerometer sensors for Test 7
window.addEventListener('devicemotion', e => e.stopImmediatePropagation(), true);
window.addEventListener('deviceorientation', e => e.stopImmediatePropagation(), true);

/* ================= Instantiate Reusable Buggy ================= */
const buggy = new RCCar(world, scene, {
  x: 0,
  z: -1.2,
  scale: 1.0,
  chassisMass: 4.2,
  bodyColor: 0x00e5ff, // Electric Cyan
  rimColor: 0xffb300,  // Racing Anodized Gold
  suspensionPreset: 'medium'
});

/* ================= Chase Camera Setup (Behind Buggy) ================= */
const chaseCamOffset = new V(0, 1.25, 2.75);
const chaseCamTarget = new V();
const currentLookAt = new V();

function updateChaseCamera(dt, instant = false){
  const chassisPos = buggy.body.x;
  chaseCamTarget.copy(chassisPos).add(new V(0, 0.32, 0));

  const forwardDir = new V(0, 0, -1).applyQuaternion(buggy.body.q);
  const upDir = new V(0, 1, 0).applyQuaternion(buggy.body.q);

  const desiredPos = new V()
    .copy(chassisPos)
    .addScaledVector(forwardDir, -chaseCamOffset.z)
    .addScaledVector(upDir, chaseCamOffset.y);

  if (instant){
    camera.position.copy(desiredPos);
    currentLookAt.copy(chaseCamTarget);
  } else {
    const smooth = Math.min(1.0, 8.5 * dt);
    camera.position.lerp(desiredPos, smooth);
    currentLookAt.lerp(chaseCamTarget, smooth);
  }
  camera.lookAt(currentLookAt);
}

// Position camera behind buggy immediately
updateChaseCamera(0, true);

/* ================= Virtual Joystick Controls ================= */
const baseEl = document.getElementById('joystick-base');
const thumbEl = document.getElementById('joystick-thumb');

let activePointerId = null;
let baseCenterX = 0, baseCenterY = 0;
const maxJoystickRadius = 45; // max pixel deflection

function updateJoystick(clientX, clientY){
  let dx = clientX - baseCenterX;
  let dy = clientY - baseCenterY;
  const dist = Math.hypot(dx, dy);
  if (dist > maxJoystickRadius){
    dx = (dx / dist) * maxJoystickRadius;
    dy = (dy / dist) * maxJoystickRadius;
  }
  thumbEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

  const steer = dx / maxJoystickRadius;       // -1 (left) to +1 (right)
  const throttle = -dy / maxJoystickRadius;   // -1 (reverse) to +1 (forward)

  buggy.setSteering(steer);
  buggy.setThrottle(throttle);
}

function resetJoystick(){
  thumbEl.style.transform = 'translate(-50%, -50%)';
  buggy.setSteering(0);
  buggy.setThrottle(0);
}

baseEl.addEventListener('pointerdown', e => {
  e.preventDefault();
  activePointerId = e.pointerId;
  const rect = baseEl.getBoundingClientRect();
  baseCenterX = rect.left + rect.width / 2;
  baseCenterY = rect.top + rect.height / 2;
  baseEl.setPointerCapture(e.pointerId);
  updateJoystick(e.clientX, e.clientY);
});

baseEl.addEventListener('pointermove', e => {
  if (e.pointerId === activePointerId){
    updateJoystick(e.clientX, e.clientY);
  }
});

const endPointer = e => {
  if (e.pointerId === activePointerId){
    activePointerId = null;
    resetJoystick();
  }
};
baseEl.addEventListener('pointerup', endPointer);
baseEl.addEventListener('pointercancel', endPointer);

/* ================= Keyboard Controls ================= */
const keys = {
  forward: false,
  reverse: false,
  left: false,
  right: false,
  brake: false
};

window.addEventListener('keydown', e => {
  if (e.repeat) return;
  switch (e.code) {
    case 'KeyW': case 'ArrowUp': keys.forward = true; break;
    case 'KeyS': case 'ArrowDown': keys.reverse = true; break;
    case 'KeyA': case 'ArrowLeft': keys.left = true; break;
    case 'KeyD': case 'ArrowRight': keys.right = true; break;
    case 'Space': keys.brake = true; e.preventDefault(); break;
    case 'KeyR': buggy.reset(0, null, -1.2); updateChaseCamera(0, true); break;
    case 'KeyF': buggy.flipUpright(); break;
  }
});

window.addEventListener('keyup', e => {
  switch (e.code) {
    case 'KeyW': case 'ArrowUp': keys.forward = false; break;
    case 'KeyS': case 'ArrowDown': keys.reverse = false; break;
    case 'KeyA': case 'ArrowLeft': keys.left = false; break;
    case 'KeyD': case 'ArrowRight': keys.right = false; break;
    case 'Space': keys.brake = false; break;
  }
});

/* ================= Animation & Physics Loop ================= */
const tickFps = RoomEnv.createFpsMeter();
let acc = 0, last = performance.now();

function frame(now){
  tickFps(now);
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;

  // If not using touch joystick, process keyboard input and deflect visual joystick
  if (activePointerId === null) {
    let kThrottle = 0;
    if (keys.forward) kThrottle += 1.0;
    if (keys.reverse) kThrottle -= 1.0;

    let kSteer = 0;
    if (keys.left) kSteer -= 1.0;
    if (keys.right) kSteer += 1.0;

    buggy.setThrottle(kThrottle);
    buggy.setSteering(kSteer);
    buggy.setBrake(keys.brake);

    // Visual joystick thumb mirrors keyboard state
    const thumbX = kSteer * maxJoystickRadius;
    const thumbY = -kThrottle * maxJoystickRadius;
    thumbEl.style.transform = `translate(calc(-50% + ${thumbX}px), calc(-50% + ${thumbY}px))`;
  }

  // Strictly lock gravity vertically downward (no phone gyro tilt)
  world.accel.set(0, -9.81, 0);
  world.omega.set(0, 0, 0);
  world.omegaDot.set(0, 0, 0);

  // Physics substeps
  acc += dt;
  let n = 0;
  while (acc >= world.dt && n < 3){
    world.step();
    buggy.step(world.dt);
    acc -= world.dt;
    n++;
  }
  if (n === 3) acc = 0;

  // Sync visuals
  buggy.updateVisuals();

  // Update chase follow camera behind buggy
  updateChaseCamera(dt);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

RoomEnv.showNote('Use the joystick or WASD / Arrow Keys to drive!', 4000);

})();
</script>
</body>
</html>
