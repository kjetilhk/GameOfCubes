<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Test 3: Soft Body Simulation - XPBD Dynamics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../src/common.css">
</head>
<body>
<div id="intro"><div class="card">
  <h1>Test 3: Soft Body</h1>
  <p>Volumetric XPBD Tetrahedral Mesh with exact volume conservation. Tilt to squash against walls, shake to wobble, drag to poke and stretch, or drop rigid cubes onto it.</p>
  <button id="go">Start</button>
</div></div>
<div id="fps">-- FPS</div>
<div id="note"></div>
<div id="hud">
  <a id="back" href="../../">← Tests</a>
  <button id="stiff">Softer</button>
  <button id="wire">Wireframe</button>
  <button id="cube">Add Cube</button>
  <button id="shake" class="hidden">Shake</button>
  <button id="reset">Reset</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../../src/xpbd.js"></script>
<script src="../../src/room.js"></script>
<script>
(() => {
'use strict';

const V = THREE.Vector3;
const world = new XPBD.World({ dt: 1/60, substeps: 20 });
const { bodies, particles, box } = world;

/* ================= rendering & room ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 50);
const lights = RoomEnv.createLighting(scene);
let wallGroup = null;

function resize(){
  wallGroup = RoomEnv.updateRoom(camera, renderer, world, lights, wallGroup, scene);
}
window.addEventListener('resize', resize);
resize();

/* ================= tet mesh visual ================= */
let activeTetMesh = null;
let tetVisualMesh = null;
let showWire = false;
let softMode = false;

function buildTetVisualMesh(tm){
  if (tetVisualMesh) { scene.remove(tetVisualMesh); tetVisualMesh.geometry.dispose(); }

  const geom = new THREE.BufferGeometry();
  const posArr = new Float32Array(tm.particles.length * 3);
  geom.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  geom.setIndex(tm.surfaceIndices);

  const mat = new THREE.MeshStandardMaterial({
    color: 0x4fbf9f,
    roughness: 0.25,
    metalness: 0.1,
    wireframe: showWire
  });

  tetVisualMesh = new THREE.Mesh(geom, mat);
  tetVisualMesh.castShadow = true;
  tetVisualMesh.receiveShadow = true;
  scene.add(tetVisualMesh);
}

function syncTetVisualMesh(){
  if (!activeTetMesh || !tetVisualMesh) return;
  const posAttr = tetVisualMesh.geometry.attributes.position;
  const arr = posAttr.array;
  const parts = activeTetMesh.particles;
  for (let i = 0; i < parts.length; i++){
    const p = parts[i].x;
    arr[i*3] = p.x;
    arr[i*3 + 1] = p.y;
    arr[i*3 + 2] = p.z;
  }
  posAttr.needsUpdate = true;
  tetVisualMesh.geometry.computeVertexNormals();
}

/* ================= rigid cubes ================= */
const PALETTE = [0x2a5bd7, 0xf2b632, 0xef6f6c, 0x7a5cc4];
const cubeMeshes = [];

function addCube(){
  if (bodies.length >= 8) return;
  const s = 0.38;
  const pos = new V((Math.random() - 0.5) * box.hx * 0.6, box.hy * 0.7, -box.d * 0.5);
  world.addCube(s, pos,
    new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.random()*6, Math.random()*6, Math.random()*6)),
    new V((Math.random() - 0.5) * 0.8, 0, 0));
  const m = new THREE.Mesh(RoomEnv.roundedCube(s, s * 0.12, 4),
    new THREE.MeshStandardMaterial({ color: PALETTE[bodies.length % PALETTE.length], roughness: 0.38 }));
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  cubeMeshes.push(m);
}

/* ================= scene init ================= */
function initScene(){
  for (const m of cubeMeshes){ scene.remove(m); m.geometry.dispose(); m.material.dispose(); }
  cubeMeshes.length = 0;
  world.clear();

  const edgeComp = softMode ? 0.0003 : 0.00003;
  activeTetMesh = world.addTetMesh({
    nx: 3, ny: 3, nz: 3,
    sizeX: 0.85, sizeY: 0.85, sizeZ: 0.85,
    center: new V(0, -box.hy * 0.25, -box.d * 0.5),
    mass: 25.0,
    edgeCompliance: edgeComp,
    volCompliance: 0.0
  });

  buildTetVisualMesh(activeTetMesh);
}
initScene();

/* ================= input & raycast interaction ================= */
let grabbedParticle = null, grabbedOrigInvM = 0;
const raycaster = new THREE.Raycaster();
const mouseVec = new THREE.Vector2();
const planeZ = new THREE.Plane(new V(0, 0, 1), box.d / 2);
const hitPoint = new V();

function handlePointer(e, type){
  mouseVec.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouseVec.y = -(e.clientY / window.innerHeight) * 2 + 1;

  if (type === 'down'){
    raycaster.setFromCamera(mouseVec, camera);
    if (activeTetMesh) {
      let closestP = null, minD = 0.35;
      for (const p of activeTetMesh.particles){
        const dist = raycaster.ray.distanceToPoint(p.x);
        if (dist < minD){ minD = dist; closestP = p; }
      }
      if (closestP) {
        grabbedParticle = closestP;
        grabbedOrigInvM = closestP.invM;
        closestP.invM = 0;
        return true;
      }
    }
  } else if (type === 'up'){
    if (grabbedParticle) {
      grabbedParticle.invM = grabbedOrigInvM;
      grabbedParticle = null;
    }
  } else if (type === 'move' && grabbedParticle){
    raycaster.setFromCamera(mouseVec, camera);
    planeZ.constant = -grabbedParticle.x.z;
    if (raycaster.ray.intersectPlane(planeZ, hitPoint)){
      grabbedParticle.x.copy(hitPoint);
      grabbedParticle.px.copy(hitPoint);
      grabbedParticle.v.set(0, 0, 0);
    }
    return true;
  }
  return false;
}

RoomEnv.setupMotionSensors({
  world,
  onPointerDrag: handlePointer
});

/* ================= HUD button listeners ================= */
document.getElementById('stiff').addEventListener('click', () => {
  softMode = !softMode;
  document.getElementById('stiff').textContent = softMode ? 'Stiffer' : 'Softer';
  const edgeComp = softMode ? 0.0003 : 0.00003;
  if (activeTetMesh) {
    for (const c of activeTetMesh.edgeConstraints) c.compliance = edgeComp;
  }
  RoomEnv.showNote(softMode ? 'Elasticity: Soft & squishy' : 'Elasticity: Firm & stiff', 1500);
});

document.getElementById('wire').addEventListener('click', () => {
  showWire = !showWire;
  document.getElementById('wire').classList.toggle('active', showWire);
  if (tetVisualMesh) tetVisualMesh.material.wireframe = showWire;
});

document.getElementById('cube').addEventListener('click', addCube);
document.getElementById('reset').addEventListener('click', initScene);
document.getElementById('shake').addEventListener('click', () => {
  for (const p of particles){
    if (p.invM > 0){
      p.v.add(new V((Math.random() - 0.5) * 4, Math.random() * 3.5, (Math.random() - 0.5) * 2));
    }
  }
  for (const b of bodies){
    b.v.add(new V((Math.random() - 0.5) * 4, Math.random() * 3, (Math.random() - 0.3) * 2));
    b.w.add(new V((Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15));
  }
});

/* ================= animation loop ================= */
const tickFps = RoomEnv.createFpsMeter();
let acc = 0, last = performance.now();

function frame(now){
  tickFps(now);
  acc += Math.min((now - last) / 1000, 0.1);
  last = now;
  let n = 0;
  while (acc >= world.dt && n < 3){ world.step(); acc -= world.dt; n++; }
  if (n === 3) acc = 0;

  syncTetVisualMesh();
  for (let i = 0; i < bodies.length; i++){
    cubeMeshes[i].position.copy(bodies[i].x);
    cubeMeshes[i].quaternion.copy(bodies[i].q);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
