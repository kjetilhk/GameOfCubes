<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Test 3: Soft Body Simulation - XPBD Dynamics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../src/common.css">
</head>
<body>
<div id="intro"><div class="card">
  <h1>Test 3: Soft Body</h1>
  <p>Volumetric XPBD Tetrahedral Mesh with exact volume conservation. Tilt to squash against walls, shake to wobble, drag to poke and stretch, or drop rigid cubes onto it.</p>
  <button id="go">Start</button>
</div></div>
<div id="fps">-- FPS</div>
<div id="note"></div>
<div id="hud">
  <a id="back" href="../../">← Tests</a>
  <button id="stiff">Stiffer</button>
  <button id="wire">Wireframe</button>
  <button id="cube">Add Cube</button>
  <button id="shake" class="hidden">Shake</button>
  <button id="reset">Reset</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../../src/xpbd.js"></script>
<script src="../../src/viewcube.js"></script>
<script src="../../src/room.js"></script>
<script>
(() => {
'use strict';

const V = THREE.Vector3;
const world = new XPBD.World({ dt: 1/60, substeps: 20 });
const { bodies, particles, box } = world;

/* ================= rendering & room ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 50);
const lights = RoomEnv.createLighting(scene);
let wallGroup = null;

function resize(){
  wallGroup = RoomEnv.updateRoom(camera, renderer, world, lights, wallGroup, scene);
}
window.addEventListener('resize', resize);
resize();

/* ================= tet mesh visual ================= */
let activeTetMesh = null;
let tetVisualMesh = null;
let showWire = false;
let softMode = true;

function buildTetVisualMesh(tm){
  if (tetVisualMesh) { scene.remove(tetVisualMesh); tetVisualMesh.geometry.dispose(); }

  const geom = new THREE.BufferGeometry();
  const posArr = new Float32Array(tm.particles.length * 3);
  geom.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  geom.setIndex(tm.surfaceIndices);

  const mat = new THREE.MeshPhysicalMaterial({
    color: 0x38bdf8,
    roughness: 0.12,
    metalness: 0.02,
    transmission: 0.75,
    ior: 1.333,
    transparent: true,
    opacity: 0.88,
    clearcoat: 0.35,
    clearcoatRoughness: 0.1,
    wireframe: showWire
  });

  tetVisualMesh = new THREE.Mesh(geom, mat);
  tetVisualMesh.castShadow = true;
  tetVisualMesh.receiveShadow = true;
  scene.add(tetVisualMesh);
}

function syncTetVisualMesh(){
  if (!activeTetMesh || !tetVisualMesh) return;
  const posAttr = tetVisualMesh.geometry.attributes.position;
  const arr = posAttr.array;
  const parts = activeTetMesh.particles;
  for (let i = 0; i < parts.length; i++){
    const p = parts[i].x;
    arr[i*3] = p.x;
    arr[i*3 + 1] = p.y;
    arr[i*3 + 2] = p.z;
  }
  posAttr.needsUpdate = true;
  tetVisualMesh.geometry.computeVertexNormals();
}

/* ================= rigid cubes ================= */
const cubeSpawner = RoomEnv.createCubeSpawner({
  scene,
  world,
  palette: [0x2a5bd7, 0xf2b632, 0xef6f6c, 0x7a5cc4],
  maxCubes: 8,
  sizeRange: 0.38,
  spawnPos: (b) => new V((Math.random() - 0.5) * b.hx * 0.6, b.hy * 0.7, -b.d * 0.5)
});

/* ================= scene init ================= */
function initScene(){
  cubeSpawner.clear();
  world.clear();

  // High-resolution continuum soft body: 8x8x8 grid (1,715 tetrahedra, 2,520 elastic edges, 512 particles)
  const edgeComp = softMode ? 0.12 : 0.005;
  activeTetMesh = world.addTetMesh({
    nx: 8, ny: 8, nz: 8,
    sizeX: 0.85, sizeY: 0.85, sizeZ: 0.85,
    center: new V(0, -box.hy * 0.25, -box.d * 0.5),
    mass: 14.0,
    edgeCompliance: edgeComp,
    volCompliance: 0.0
  });

  buildTetVisualMesh(activeTetMesh);
  syncTetVisualMesh();
}
initScene();

/* ================= input & raycast interaction ================= */
const dragger = RoomEnv.createParticleDragger({
  camera,
  world,
  getTargetParticles: () => activeTetMesh ? activeTetMesh.particles : null,
  pickRadius: 0.25
});

RoomEnv.setupMotionSensors({
  world,
  onPointerDrag: dragger.handlePointer
});

/* ================= HUD button listeners ================= */
function toggleStiffness() {
  softMode = !softMode;
  document.getElementById('stiff').textContent = softMode ? 'Stiffer' : 'Softer';
  const edgeComp = softMode ? 0.12 : 0.005;
  if (activeTetMesh) {
    for (const c of activeTetMesh.edgeConstraints) c.compliance = edgeComp;
    for (const c of activeTetMesh.volumeConstraints) c.compliance = 0.0;
  }
  RoomEnv.showNote(softMode ? 'Elasticity: Water / Fluid (extra soft)' : 'Elasticity: Firm rubber', 1500);
}

function toggleWireframe() {
  showWire = !showWire;
  document.getElementById('wire').classList.toggle('active', showWire);
  if (tetVisualMesh) tetVisualMesh.material.wireframe = showWire;
}

function shake() {
  for (const p of particles){
    if (p.invM > 0){
      p.v.add(new V((Math.random() - 0.5) * 4, Math.random() * 3.5, (Math.random() - 0.5) * 2));
    }
  }
  for (const b of bodies){
    b.v.add(new V((Math.random() - 0.5) * 4, Math.random() * 3, (Math.random() - 0.3) * 2));
    b.w.add(new V((Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15));
  }
}

document.getElementById('stiff').addEventListener('click', toggleStiffness);
document.getElementById('wire').addEventListener('click', toggleWireframe);
document.getElementById('cube').addEventListener('click', () => cubeSpawner.spawnCube());
document.getElementById('reset').addEventListener('click', initScene);
document.getElementById('shake').addEventListener('click', shake);

// Desktop keyboard shortcuts
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); cubeSpawner.spawnCube(); }
  else if (e.key === 'w' || e.key === 'W') toggleWireframe();
  else if (e.key === 's' || e.key === 'S') toggleStiffness();
  else if (e.key === 'r' || e.key === 'R') initScene();
});

/* ================= animation loop ================= */
const tickFps = RoomEnv.createFpsMeter();
let acc = 0, last = performance.now();

function frame(now){
  tickFps(now);
  acc += Math.min((now - last) / 1000, 0.1);
  last = now;
  let n = 0;
  while (acc >= world.dt && n < 3){ world.step(); acc -= world.dt; n++; }
  if (n === 3) acc = 0;

  syncTetVisualMesh();
  cubeSpawner.sync();

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
