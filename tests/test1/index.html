<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Test 1: Cube Box - XPBD Dynamics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../src/common.css">
</head>
<body>
<div id="intro"><div class="card">
  <h1>Test 1: Cube Box</h1>
  <p>XPBD rigid bodies in a box. Your phone screen is the glass front. Tilt it to slide, shake to rattle, and twist to feel rotational inertia.</p>
  <button id="go">Start</button>
</div></div>
<div id="fps">-- FPS</div>
<div id="note"></div>
<div id="hud">
  <a id="back" href="../../">← Tests</a>
  <button id="add">Add Cube</button>
  <button id="shake" class="hidden">Shake</button>
  <button id="reset">Reset</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../../src/xpbd.js"></script>
<script src="../../src/room.js"></script>
<script>
(() => {
'use strict';

const V = THREE.Vector3;
const world = new XPBD.World();
const { bodies, box } = world;

/* ================= rendering & room ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 50);
const lights = RoomEnv.createLighting(scene);
let wallGroup = null;

function resize(){
  wallGroup = RoomEnv.updateRoom(camera, renderer, world, lights, wallGroup, scene);
}
window.addEventListener('resize', resize);
resize();

/* ================= cubes ================= */
const PALETTE = [0x2a5bd7, 0xf2b632, 0xef6f6c, 0x4fbf9f, 0xf3efe6, 0x7a5cc4, 0xff9f43];
const meshes = [];

function addCube(){
  if (bodies.length >= 30) return;
  const s = 0.36 + Math.random() * 0.14;
  const pos = new V();
  for (let tries = 0; tries < 20; tries++){
    pos.set((Math.random() - 0.5) * 2 * (box.hx - s*0.8), box.hy * (0.6*Math.random() - 0.1), -box.d * 0.5);
    if (!world.crowded(pos, s)) break;
  }
  world.addCube(s, pos,
    new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.random()*6, Math.random()*6, Math.random()*6)),
    new V((Math.random() - 0.5) * 0.8, 0, 0));
  const m = new THREE.Mesh(RoomEnv.roundedCube(s, s * 0.12, 4),
    new THREE.MeshStandardMaterial({ color: PALETTE[bodies.length % PALETTE.length], roughness: 0.38 }));
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  meshes.push(m);
}

function reset(){
  for (const m of meshes){ scene.remove(m); m.geometry.dispose(); m.material.dispose(); }
  meshes.length = 0;
  world.clear();
  for (let i = 0; i < 3; i++) addCube();
}
reset();

/* ================= motion & input ================= */
RoomEnv.setupMotionSensors({ world });

document.getElementById('add').addEventListener('click', addCube);
document.getElementById('reset').addEventListener('click', reset);
document.getElementById('shake').addEventListener('click', () => {
  for (const b of bodies){
    b.v.add(new V((Math.random() - 0.5) * 4, Math.random() * 3.5, (Math.random() - 0.3) * 2.5));
    b.w.add(new V((Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15));
  }
});

/* ================= animation loop ================= */
const tickFps = RoomEnv.createFpsMeter();
let acc = 0, last = performance.now();

function frame(now){
  tickFps(now);
  acc += Math.min((now - last) / 1000, 0.1);
  last = now;
  let n = 0;
  while (acc >= world.dt && n < 3){ world.step(); acc -= world.dt; n++; }
  if (n === 3) acc = 0;

  for (let i = 0; i < bodies.length; i++){
    meshes[i].position.copy(bodies[i].x);
    meshes[i].quaternion.copy(bodies[i].q);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
