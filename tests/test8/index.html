<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(() => {
'use strict';

const V = THREE.Vector3;
const Q = THREE.Quaternion;
const E = THREE.Euler;

/* ================= XPBD Physics World in Open Empty Space ================= */
const world = new XPBD.World({
  dt: 1/60,
  substeps: 10,
  positionIterations: 2,
  linearDamping: 1.25,
  selfCollision: false
});
// Gravity pulls the head-pinned Marshmallow Man soft body so its arms droop and body bounces naturally
world.accel.set(0, -6.2, 0);

// Wide open empty-space bounds (no 3m box walls; only open floor at y = -1.50m)
world.box.hx = 50;
world.box.hy = 1.5;
world.box.d = 100;
world.walls = [
  { n: new V(0, 1, 0), o: -1.5 } // Open floor at y = -1.50m
];
world.center.set(0, 0, -1.2);

/* ================= Rendering & Empty 3D Space Setup ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c1017);
scene.fog = new THREE.FogExp2(0x0c1017, 0.045);

const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 80);

// Studio 3-point lighting in open empty space
const keyLight = new THREE.DirectionalLight(0xfff4e6, 0.85);
keyLight.position.set(2.8, 4.2, 2.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 15;
keyLight.shadow.camera.left = -2.2;
keyLight.shadow.camera.right = 2.2;
keyLight.shadow.camera.top = 2.5;
keyLight.shadow.camera.bottom = -2.2;
keyLight.shadow.bias = -0.0005;
keyLight.shadow.radius = 2.5;
scene.add(keyLight);
keyLight.target.position.set(0, -0.5, -1.2);
scene.add(keyLight.target);

const fillLight = new THREE.DirectionalLight(0x90b8f8, 0.45);
fillLight.position.set(-3.0, 2.2, 1.5);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x60d0ff, 0.38);
rimLight.position.set(0.0, 2.5, -4.2);
scene.add(rimLight);

const ambLight = new THREE.AmbientLight(0xd0dcf0, 0.32);
scene.add(ambLight);

// Open Infinite-Space Ground Plane (shadow receiver, no walls or ceiling)
const groundMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({
    color: 0x11161f,
    roughness: 0.78,
    metalness: 0.08
  })
);
groundMesh.rotation.x = -Math.PI / 2;
groundMesh.position.set(0, -1.50, -1.2);
groundMesh.receiveShadow = true;
scene.add(groundMesh);

// Subtle open-space floor grid
const gridHelper = new THREE.GridHelper(16, 32, 0x2a3648, 0x18202c);
gridHelper.position.set(0, -1.499, -1.2);
scene.add(gridHelper);

const orbitTarget = new V(0, -0.52, -1.2);
let orbitControls = null;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
  if (orbitControls) orbitControls.update();
}
window.addEventListener('resize', resize);

/* ================= Humanoid Skeleton Hierarchy ================= */
// Floor is at y = -1.50m.
// Leg lengths: Hip offset (-0.04m) + UpLeg (0.42m) + Leg (0.41m) + Foot height (0.065m) = 0.935m
// Hips bind pose world position: (0, -0.565, -1.2) -> places feet right on the floor at y = -1.50m.
const HIP_BIND_POS = new V(0, -0.565, -1.2);

const BONE_DEFS = [
  { name: 'Hips',          parent: null,            pos: [0, -0.565, -1.2],   rSphere: 0.052, rCyl: 0.036 },
  // Spine & Head chain
  { name: 'Spine',         parent: 'Hips',          pos: [0, 0.11, 0],        rSphere: 0.042, rCyl: 0.036 },
  { name: 'Spine1',        parent: 'Spine',         pos: [0, 0.14, 0],        rSphere: 0.042, rCyl: 0.038 },
  { name: 'Spine2',        parent: 'Spine1',        pos: [0, 0.15, 0],        rSphere: 0.046, rCyl: 0.040 },
  { name: 'Neck',          parent: 'Spine2',        pos: [0, 0.13, 0],        rSphere: 0.032, rCyl: 0.026 },
  { name: 'Head',          parent: 'Neck',          pos: [0, 0.11, 0],        rSphere: 0.072, rCyl: 0.028 },
  { name: 'HeadTop_End',   parent: 'Head',          pos: [0, 0.14, 0],        rSphere: 0.048, rCyl: 0.036 },

  // Left Arm chain (T-Pose along +X)
  { name: 'LeftShoulder',  parent: 'Spine2',        pos: [0.045, 0.10, 0],    rSphere: 0.032, rCyl: 0.024 },
  { name: 'LeftArm',       parent: 'LeftShoulder',  pos: [0.135, 0, 0],       rSphere: 0.036, rCyl: 0.026 },
  { name: 'LeftForeArm',   parent: 'LeftArm',       pos: [0.26, 0, 0],        rSphere: 0.030, rCyl: 0.024 },
  { name: 'LeftHand',      parent: 'LeftForeArm',   pos: [0.24, 0, 0],        rSphere: 0.026, rCyl: 0.020 },
  { name: 'LeftHand_End',  parent: 'LeftHand',      pos: [0.09, 0, 0],        rSphere: 0.020, rCyl: 0.016 },

  // Right Arm chain (T-Pose along -X)
  { name: 'RightShoulder', parent: 'Spine2',        pos: [-0.045, 0.10, 0],   rSphere: 0.032, rCyl: 0.024 },
  { name: 'RightArm',      parent: 'RightShoulder', pos: [-0.135, 0, 0],      rSphere: 0.036, rCyl: 0.026 },
  { name: 'RightForeArm',  parent: 'RightArm',      pos: [-0.26, 0, 0],       rSphere: 0.030, rCyl: 0.024 },
  { name: 'RightHand',     parent: 'RightForeArm',  pos: [-0.24, 0, 0],       rSphere: 0.026, rCyl: 0.020 },
  { name: 'RightHand_End', parent: 'RightHand',     pos: [-0.09, 0, 0],       rSphere: 0.020, rCyl: 0.016 },

  // Left Leg chain (downward along -Y)
  { name: 'LeftUpLeg',     parent: 'Hips',          pos: [0.155, -0.04, 0],   rSphere: 0.044, rCyl: 0.030 },
  { name: 'LeftLeg',       parent: 'LeftUpLeg',     pos: [0, -0.42, 0],       rSphere: 0.038, rCyl: 0.032 },
  { name: 'LeftFoot',      parent: 'LeftLeg',       pos: [0, -0.41, 0],       rSphere: 0.034, rCyl: 0.026 },
  { name: 'LeftToeBase',   parent: 'LeftFoot',      pos: [0, -0.045, 0.14],   rSphere: 0.024, rCyl: 0.022 },
  { name: 'LeftToe_End',   parent: 'LeftToeBase',   pos: [0, 0, 0.06],        rSphere: 0.018, rCyl: 0.016 },

  // Right Leg chain (downward along -Y)
  { name: 'RightUpLeg',    parent: 'Hips',          pos: [-0.155, -0.04, 0],  rSphere: 0.044, rCyl: 0.030 },
  { name: 'RightLeg',      parent: 'RightUpLeg',    pos: [0, -0.42, 0],       rSphere: 0.038, rCyl: 0.032 },
  { name: 'RightFoot',     parent: 'RightLeg',      pos: [0, -0.41, 0],       rSphere: 0.034, rCyl: 0.026 },
  { name: 'RightToeBase',  parent: 'RightFoot',     pos: [0, -0.045, 0.14],   rSphere: 0.024, rCyl: 0.022 },
  { name: 'RightToe_End',  parent: 'RightToeBase',  pos: [0, 0, 0.06],        rSphere: 0.018, rCyl: 0.016 }
];

// PBR Materials for Joint Spheres & Bone Cylinders
const jointSphereMat = new THREE.MeshPhysicalMaterial({
  color: 0xf2b632,
  roughness: 0.22,
  metalness: 0.18,
  clearcoat: 0.40,
  clearcoatRoughness: 0.15
});

const headSphereMat = new THREE.MeshPhysicalMaterial({
  color: 0xff9800,
  roughness: 0.18,
  metalness: 0.20,
  clearcoat: 0.60,
  clearcoatRoughness: 0.10
});

const boneCylinderMat = new THREE.MeshPhysicalMaterial({
  color: 0x6289b0,
  roughness: 0.30,
  metalness: 0.25,
  clearcoat: 0.25,
  clearcoatRoughness: 0.20
});

const bonesByName = {};
const boneList = [];
const boneSegments = []; // Capsule segments { boneA, boneB, radius, isCore } for skeleton -> softbody coupling
const unitSphereGeom = new THREE.SphereGeometry(1, 20, 16);
const unitCylGeom = new THREE.CylinderGeometry(0.82, 1.0, 1, 16, 1);
const upVec = new V(0, 1, 0);

const characterRoot = new THREE.Group();
characterRoot.name = 'CharacterRoot';
scene.add(characterRoot);

let headSphereMesh = null;
const PIN_BONE_NAMES = new Set([
  'Head',
  'LeftForeArm', 'RightForeArm',
  'LeftHand', 'RightHand',
  'LeftLeg', 'RightLeg',
  'LeftFoot', 'RightFoot'
]);

// Build hierarchical THREE.Bone tree and parent a poly sphere + poly cylinder to every joint
for (const def of BONE_DEFS) {
  const bone = new THREE.Bone();
  bone.name = def.name;
  bone.position.set(def.pos[0], def.pos[1], def.pos[2]);

  // 1. Parent a poly sphere directly to the joint at its local origin (0, 0, 0)
  const isPinBone = PIN_BONE_NAMES.has(def.name);
  const sphereMesh = new THREE.Mesh(unitSphereGeom, isPinBone ? headSphereMat : jointSphereMat);
  sphereMesh.scale.setScalar(def.rSphere);
  sphereMesh.castShadow = true;
  sphereMesh.receiveShadow = true;
  bone.add(sphereMesh);
  bone._sphereMesh = sphereMesh;
  bone._rSphere = def.rSphere;
  if (def.name === 'Head') {
    headSphereMesh = sphereMesh;
  }

  if (def.parent) {
    const parentBone = bonesByName[def.parent];
    parentBone.add(bone);

    // 2. Parent a poly cylinder to the parent joint spanning from parent (0,0,0) to this child joint
    const offset = new V(def.pos[0], def.pos[1], def.pos[2]);
    const len = offset.length();
    if (len > 1e-4) {
      const cylMesh = new THREE.Mesh(unitCylGeom, boneCylinderMat);
      cylMesh.scale.set(def.rCyl, len, def.rCyl);
      cylMesh.position.copy(offset).multiplyScalar(0.5);
      const dir = offset.clone().normalize();
      cylMesh.quaternion.setFromUnitVectors(upVec, dir);
      cylMesh.castShadow = true;
      cylMesh.receiveShadow = true;
      parentBone.add(cylMesh);

      const isCore = def.name.startsWith('Spine') || def.name.includes('Leg') || def.name.includes('Foot');
      boneSegments.push({
        boneA: parentBone,
        boneB: bone,
        radius: Math.max(def.rCyl, Math.min(parentBone._rSphere, def.rSphere)) * 1.15,
        isCore
      });
    }
  } else {
    characterRoot.add(bone);
  }

  bonesByName[def.name] = bone;
  boneList.push(bone);
}

const rootBone = bonesByName['Hips'];
characterRoot.updateMatrixWorld(true);

/* ================= Marshmallow Man Soft-Body Meta-Mesh (Pinned to Head Bone Sphere) ================= */
// Smooth polynomial metaball union (smin) and primitive signed distance helpers
function smin(a, b, k) {
  const h = Math.max(k - Math.abs(a - b), 0.0) / k;
  return Math.min(a, b) - h * h * k * 0.25;
}
function sdSphere(px, py, pz, cx, cy, cz, r) {
  return Math.hypot(px - cx, py - cy, pz - cz) - r;
}
function sdCapsule(px, py, pz, ax, ay, az, bx, by, bz, r) {
  const vx = px - ax, vy = py - ay, vz = pz - az;
  const ux = bx - ax, uy = by - ay, uz = bz - az;
  const lenSq = ux * ux + uy * uy + uz * uz;
  let t = lenSq > 1e-8 ? (vx * ux + vy * uy + vz * uz) / lenSq : 0;
  if (t < 0) t = 0;
  else if (t > 1) t = 1;
  return Math.hypot(vx - ux * t, vy - uy * t, vz - uz * t) - r;
}

// Analytical Marshmallow Man Metaball SDF around the character's Bind Pose (T-Pose)
function marshmallowSDF(x, y, z) {
  const ax = Math.abs(x);
  const zc = z + 1.2;

  // 1. Puffy Marshmallow Head + Neck + 3 Stacked Torso Rolls (Chest, Belly, Pelvis)
  let dTorso = sdCapsule(ax, y, zc, 0.0, 0.08, 0.0, 0.0, 0.16, 0.0, 0.150);
  dTorso = smin(dTorso, sdSphere(ax, y, zc, 0.0, -0.02, 0.0, 0.098), 0.032);
  dTorso = smin(dTorso, sdCapsule(ax, y, zc, 0.0, -0.14, 0.0, 0.10, -0.13, 0.0, 0.156), 0.024);
  dTorso = smin(dTorso, sdCapsule(ax, y, zc, 0.0, -0.32, 0.015, 0.085, -0.32, 0.01, 0.178), 0.024);
  dTorso = smin(dTorso, sdCapsule(ax, y, zc, 0.0, -0.50, 0.0, 0.095, -0.52, 0.0, 0.154), 0.024);

  // 2. T-Pose Arms: 4 plump marshmallow spheres per arm (Shoulder, Bicep, Forearm, Round Mitt Hand)
  let dArm = sdSphere(ax, y, zc, 0.23, -0.065, 0.0, 0.106);
  dArm = smin(dArm, sdSphere(ax, y, zc, 0.38, -0.065, 0.0, 0.100), 0.020);
  dArm = smin(dArm, sdSphere(ax, y, zc, 0.53, -0.065, 0.0, 0.095), 0.020);
  dArm = smin(dArm, sdSphere(ax, y, zc, 0.68, -0.065, 0.0, 0.092), 0.020);

  // 3. Legs: 3 plump marshmallow spheres per leg (Thigh, Knee, Calf) + Rounded Marshmallow Boot Foot
  let dLeg = sdSphere(ax, y, zc, 0.160, -0.73, 0.0, 0.112);
  dLeg = smin(dLeg, sdSphere(ax, y, zc, 0.165, -0.95, 0.0, 0.106), 0.020);
  dLeg = smin(dLeg, sdSphere(ax, y, zc, 0.165, -1.17, 0.0, 0.100), 0.020);
  dLeg = smin(dLeg, sdCapsule(ax, y, zc, 0.165, -1.37, 0.0, 0.165, -1.39, 0.095, 0.095), 0.020);

  let d = smin(dTorso, dArm, 0.032);
  d = smin(d, dLeg, 0.032);
  return d;
}

function sdfGrad(x, y, z) {
  const e = 0.002;
  const gx = marshmallowSDF(x + e, y, z) - marshmallowSDF(x - e, y, z);
  const gy = marshmallowSDF(x, y + e, z) - marshmallowSDF(x, y - e, z);
  const gz = marshmallowSDF(x, y, z + e) - marshmallowSDF(x, y, z - e);
  const l = Math.hypot(gx, gy, gz) || 1;
  return [gx / l, gy / l, gz / l];
}

function calcSignedTetVol(a, b, c, d) {
  const ux = b.x.x - a.x.x, uy = b.x.y - a.x.y, uz = b.x.z - a.x.z;
  const vx = c.x.x - a.x.x, vy = c.x.y - a.x.y, vz = c.x.z - a.x.z;
  const wx = d.x.x - a.x.x, wy = d.x.y - a.x.y, wz = d.x.z - a.x.z;
  return ((uy * vz - uz * vy) * wx + (uz * vx - ux * vz) * wy + (ux * vy - uy * vx) * wz) / 6;
}

// Build volumetric tetrahedral Meta-Mesh + Surface-Net projected & Loop-subdivided Marshmallow Man surface
const dx = 0.072;
const cxN = 23, cyN = 26, czN = 7;
const nx = cxN + 1, ny = cyN + 1, nz = czN + 1;
const minX = -cxN * 0.5 * dx;
const maxY = 0.34;
const minZ = -1.2 - czN * 0.5 * dx;
const cIdx = (i, j, k) => (k * cyN + j) * cxN + i;
const cellActive = new Uint8Array(cxN * cyN * czN);
const midXCol = Math.floor(cxN / 2);

for (let k = 0; k < czN; k++) {
  for (let j = 0; j < cyN; j++) {
    for (let i = 0; i < cxN; i++) {
      const cx = minX + (i + 0.5) * dx;
      const cy = maxY - (j + 0.5) * dx;
      const cz = minZ + (k + 0.5) * dx;
      // Keep center column between legs clear below hips so left & right marshmallow legs are separate
      if (i === midXCol && cy < -0.66) continue;
      if (marshmallowSDF(cx, cy, cz) <= 0.016) {
        cellActive[cIdx(i, j, k)] = 1;
      }
    }
  }
}

// Prune any dangling 1-neighbor hex cell
for (let pass = 0; pass < 2; pass++) {
  for (let k = 0; k < czN; k++) {
    for (let j = 0; j < cyN; j++) {
      for (let i = 0; i < cxN; i++) {
        if (!cellActive[cIdx(i, j, k)]) continue;
        let n = 0;
        if (i > 0 && cellActive[cIdx(i - 1, j, k)]) n++;
        if (i < cxN - 1 && cellActive[cIdx(i + 1, j, k)]) n++;
        if (j > 0 && cellActive[cIdx(i, j - 1, k)]) n++;
        if (j < cyN - 1 && cellActive[cIdx(i, j + 1, k)]) n++;
        if (k > 0 && cellActive[cIdx(i, j, k - 1)]) n++;
        if (k < czN - 1 && cellActive[cIdx(i, j, k + 1)]) n++;
        if (n <= 1) cellActive[cIdx(i, j, k)] = 0;
      }
    }
  }
}

const gIdx = (i, j, k) => (k * ny + j) * nx + i;
const vertMap = new Map();
const blobParticles = [];
const metaMeshRef = {};

function getMetaVert(i, j, k) {
  const g = gIdx(i, j, k);
  if (!vertMap.has(g)) {
    vertMap.set(g, blobParticles.length);
    const p = world.addParticle(minX + i * dx, maxY - j * dx, minZ + k * dx, 0.048, dx * 0.25, 0.30);
    p._tetMesh = metaMeshRef;
    p._tx = i; p._ty = j; p._tz = k;
    p._isBoundary = false;
    blobParticles.push(p);
  }
  return vertMap.get(g);
}

const metaTets = [];
for (let k = 0; k < czN; k++) {
  for (let j = 0; j < cyN; j++) {
    for (let i = 0; i < cxN; i++) {
      if (!cellActive[cIdx(i, j, k)]) continue;
      const v0 = getMetaVert(i, j, k),         v1 = getMetaVert(i + 1, j, k),
            v2 = getMetaVert(i + 1, j + 1, k), v3 = getMetaVert(i, j + 1, k),
            v4 = getMetaVert(i, j, k + 1),     v5 = getMetaVert(i + 1, j, k + 1),
            v6 = getMetaVert(i + 1, j + 1, k + 1), v7 = getMetaVert(i, j + 1, k + 1);
      if ((i + j + k) % 2 === 0) {
        metaTets.push([v0, v1, v3, v4], [v1, v2, v3, v6], [v1, v4, v5, v6], [v3, v4, v6, v7], [v1, v3, v4, v6]);
      } else {
        metaTets.push([v0, v1, v2, v5], [v0, v2, v3, v7], [v0, v4, v5, v7], [v2, v5, v6, v7], [v0, v2, v5, v7]);
      }
    }
  }
}

for (let ti = 0; ti < metaTets.length; ti++) {
  const tet = metaTets[ti];
  if (calcSignedTetVol(blobParticles[tet[0]], blobParticles[tet[1]], blobParticles[tet[2]], blobParticles[tet[3]]) < 0) {
    const tmp = tet[1]; tet[1] = tet[2]; tet[2] = tmp;
  }
}

// Extract closed manifold outer surface triangles of the Marshmallow Man Meta-Mesh
const faceMap = new Map();
for (let ti = 0; ti < metaTets.length; ti++) {
  const tet = metaTets[ti];
  const fList = [
    [tet[0], tet[1], tet[2], tet[3]],
    [tet[0], tet[1], tet[3], tet[2]],
    [tet[0], tet[2], tet[3], tet[1]],
    [tet[1], tet[2], tet[3], tet[0]]
  ];
  for (let f = 0; f < 4; f++) {
    const [a, b, c, opp] = fList[f];
    const key = [a, b, c].sort((x, y) => x - y).join(',');
    if (!faceMap.has(key)) faceMap.set(key, { count: 0, a, b, c, opp });
    faceMap.get(key).count++;
  }
}

const boundaryNeighbors = blobParticles.map(() => new Set());
const allNeighbors = blobParticles.map(() => new Set());
const incidentTets = blobParticles.map(() => []);
for (let ti = 0; ti < metaTets.length; ti++) {
  const [a, b, c, d] = metaTets[ti];
  incidentTets[a].push(ti); incidentTets[b].push(ti);
  incidentTets[c].push(ti); incidentTets[d].push(ti);
  for (const [u, v] of [[a, b], [a, c], [a, d], [b, c], [b, d], [c, d]]) {
    allNeighbors[u].add(v);
    allNeighbors[v].add(u);
  }
}

const baseTris = [];
for (const [, val] of faceMap) {
  if (val.count === 1) {
    const { a, b, c, opp } = val;
    blobParticles[a]._isBoundary = true;
    blobParticles[b]._isBoundary = true;
    blobParticles[c]._isBoundary = true;
    boundaryNeighbors[a].add(b); boundaryNeighbors[a].add(c);
    boundaryNeighbors[b].add(a); boundaryNeighbors[b].add(c);
    boundaryNeighbors[c].add(a); boundaryNeighbors[c].add(b);

    const pa = blobParticles[a].x, pb = blobParticles[b].x, pc = blobParticles[c].x, po = blobParticles[opp].x;
    const ux = pb.x - pa.x, uy = pb.y - pa.y, uz = pb.z - pa.z;
    const vx = pc.x - pa.x, vy = pc.y - pa.y, vz = pc.z - pa.z;
    const fnx = uy * vz - uz * vy, fny = uz * vx - ux * vz, fnz = ux * vy - uy * vx;
    const ox = pa.x - po.x, oy = pa.y - po.y, oz = pa.z - po.z;
    if (fnx * ox + fny * oy + fnz * oz > 0) baseTris.push([a, b, c]);
    else baseTris.push([a, c, b]);
  }
}

// Constrained Elastic Surface-Net smoothing + exact Newton projection onto marshmallowSDF = 0
const minAllowedVol = (dx * dx * dx / 6) * 0.08;
for (let iter = 0; iter < 14; iter++) {
  for (let i = 0; i < blobParticles.length; i++) {
    const p = blobParticles[i];
    const oldX = p.x.x, oldY = p.x.y, oldZ = p.x.z;
    const nbrs = p._isBoundary ? boundaryNeighbors[i] : allNeighbors[i];
    let nxPos = oldX, nyPos = oldY, nzPos = oldZ;
    if (nbrs.size > 0) {
      let sx = 0, sy = 0, sz = 0;
      for (const j of nbrs) {
        sx += blobParticles[j].x.x;
        sy += blobParticles[j].x.y;
        sz += blobParticles[j].x.z;
      }
      const inv = 1 / nbrs.size;
      const w = p._isBoundary ? 0.42 : 0.35;
      nxPos = oldX * (1 - w) + sx * inv * w;
      nyPos = oldY * (1 - w) + sy * inv * w;
      nzPos = oldZ * (1 - w) + sz * inv * w;
    }
    if (p._isBoundary) {
      const d = marshmallowSDF(nxPos, nyPos, nzPos);
      const [gx, gy, gz] = sdfGrad(nxPos, nyPos, nzPos);
      const step = Math.max(-0.022, Math.min(0.022, d * 0.78));
      nxPos -= gx * step;
      nyPos -= gy * step;
      nzPos -= gz * step;
    }
    p.x.set(nxPos, nyPos, nzPos);
    let ok = true;
    for (const ti of incidentTets[i]) {
      const tet = metaTets[ti];
      if (calcSignedTetVol(blobParticles[tet[0]], blobParticles[tet[1]], blobParticles[tet[2]], blobParticles[tet[3]]) < minAllowedVol) {
        ok = false;
        break;
      }
    }
    if (!ok) {
      p.x.set(0.5 * (oldX + nxPos), 0.5 * (oldY + nyPos), 0.5 * (oldZ + nzPos));
      let ok2 = true;
      for (const ti of incidentTets[i]) {
        const tet = metaTets[ti];
        if (calcSignedTetVol(blobParticles[tet[0]], blobParticles[tet[1]], blobParticles[tet[2]], blobParticles[tet[3]]) < minAllowedVol) {
          ok2 = false;
          break;
        }
      }
      if (!ok2) p.x.set(oldX, oldY, oldZ);
    }
    p.px.copy(p.x);
  }
}

for (let i = 0; i < blobParticles.length; i++) {
  blobParticles[i]._bindPos = blobParticles[i].x.clone();
}

// Create XPBD Soft-Body Constraints (1-hop tet edges + 2-hop axial bending + TetVolumeConstraints)
const edgeSet = new Set();
const tetEdgeConstraints = [];
const bendEdgeConstraints = [];
function addMetaEdge(u, v, compliance, targetList) {
  const key = u < v ? u + ',' + v : v + ',' + u;
  if (!edgeSet.has(key)) {
    edgeSet.add(key);
    const c = world.addDistanceConstraint(blobParticles[u], blobParticles[v], compliance);
    if (targetList) targetList.push(c);
  }
}
for (let ti = 0; ti < metaTets.length; ti++) {
  const [a, b, c, d] = metaTets[ti];
  for (const [u, v] of [[a, b], [a, c], [a, d], [b, c], [b, d], [c, d]]) {
    addMetaEdge(u, v, 0.0040, tetEdgeConstraints);
  }
  world.volumeConstraints.push(new XPBD.TetVolumeConstraint(
    blobParticles[a], blobParticles[b], blobParticles[c], blobParticles[d], 0.0
  ));
}
// 2-hop axial structural bending constraints so marshmallow arms/torso/legs stay plump and bouncy
for (let u = 0; u < blobParticles.length; u++) {
  for (const m of allNeighbors[u]) {
    for (const v of allNeighbors[m]) {
      if (v > u) {
        const di = Math.abs(blobParticles[u]._tx - blobParticles[v]._tx);
        const dj = Math.abs(blobParticles[u]._ty - blobParticles[v]._ty);
        const dk = Math.abs(blobParticles[u]._tz - blobParticles[v]._tz);
        if (di + dj + dk === 2 && Math.max(di, dj, dk) === 2) {
          addMetaEdge(u, v, 0.0090, bendEdgeConstraints);
        }
      }
    }
  }
}

// Pin Head, Elbows (LeftForeArm/RightForeArm), Hands (LeftHand/RightHand),
// Knees (LeftLeg/RightLeg), and Feet (LeftFoot/RightFoot) particles directly to their bone spheres!
characterRoot.updateMatrixWorld(true);

const pinAnchors = {
  head:   bonesByName['Head']._sphereMesh,
  lElbow: bonesByName['LeftForeArm']._sphereMesh,
  rElbow: bonesByName['RightForeArm']._sphereMesh,
  lHand:  bonesByName['LeftHand']._sphereMesh,
  rHand:  bonesByName['RightHand']._sphereMesh,
  lKnee:  bonesByName['LeftLeg']._sphereMesh,
  rKnee:  bonesByName['RightLeg']._sphereMesh,
  lFoot:  bonesByName['LeftFoot']._sphereMesh,
  rFoot:  bonesByName['RightFoot']._sphereMesh
};

const pinBindPos = {};
const pinInvMat = {};
for (const [key, mesh] of Object.entries(pinAnchors)) {
  mesh.updateMatrixWorld(true);
  pinBindPos[key] = new V();
  mesh.getWorldPosition(pinBindPos[key]);
  pinInvMat[key] = new THREE.Matrix4().copy(mesh.matrixWorld).invert();
}

const blobPinnedParticles = [];
const pinMarkerGeom = new THREE.SphereGeometry(0.012, 10, 8);
const pinMarkerMat = new THREE.MeshBasicMaterial({ color: 0xff3b30 });

function attachParticleToAnchor(p, anchorKey) {
  const sphereMesh = pinAnchors[anchorKey];
  p.invM = 0;
  p._isPinned = true;
  p._pinSphereMesh = sphereMesh;
  p._pinLocalPos = p.x.clone().applyMatrix4(pinInvMat[anchorKey]);
  p._prevPinWorldPos = p.x.clone();
  p._targetPinWorldPos = p.x.clone();
  blobPinnedParticles.push(p);

  // Visual pin marker parented directly to the joint's poly sphere
  const pinDot = new THREE.Mesh(pinMarkerGeom, pinMarkerMat);
  pinDot.position.copy(p._pinLocalPos);
  sphereMesh.add(pinDot);
}

for (let i = 0; i < blobParticles.length; i++) {
  const p = blobParticles[i];
  p._isPinned = false;
  const px = p.x.x, py = p.x.y, pz = p.x.z;

  // 1. Head sphere pin (crown/head region around Head bone sphere)
  if (py >= 0.02 && Math.hypot(px - pinBindPos.head.x, py - 0.11, pz - pinBindPos.head.z) <= 0.175) {
    attachParticleToAnchor(p, 'head');
  }
  // 2. Left Hand sphere pin (left mitt hand around LeftHand bone sphere)
  else if (px >= 0.60 && Math.hypot(px - pinBindPos.lHand.x, py - pinBindPos.lHand.y, pz - pinBindPos.lHand.z) <= 0.135) {
    attachParticleToAnchor(p, 'lHand');
  }
  // 3. Right Hand sphere pin (right mitt hand around RightHand bone sphere)
  else if (px <= -0.60 && Math.hypot(px - pinBindPos.rHand.x, py - pinBindPos.rHand.y, pz - pinBindPos.rHand.z) <= 0.135) {
    attachParticleToAnchor(p, 'rHand');
  }
  // 4. Left Elbow sphere pin (around LeftForeArm elbow bone sphere)
  else if (px >= 0.36 && px <= 0.52 && Math.hypot(px - pinBindPos.lElbow.x, py - pinBindPos.lElbow.y, pz - pinBindPos.lElbow.z) <= 0.125) {
    attachParticleToAnchor(p, 'lElbow');
  }
  // 5. Right Elbow sphere pin (around RightForeArm elbow bone sphere)
  else if (px <= -0.36 && px >= -0.52 && Math.hypot(px - pinBindPos.rElbow.x, py - pinBindPos.rElbow.y, pz - pinBindPos.rElbow.z) <= 0.125) {
    attachParticleToAnchor(p, 'rElbow');
  }
  // 6. Left Foot sphere pin (left marshmallow boot around LeftFoot bone sphere)
  else if (px > 0.02 && py <= -1.30) {
    attachParticleToAnchor(p, 'lFoot');
  }
  // 7. Right Foot sphere pin (right marshmallow boot around RightFoot bone sphere)
  else if (px < -0.02 && py <= -1.30) {
    attachParticleToAnchor(p, 'rFoot');
  }
  // 8. Left Knee sphere pin (around LeftLeg knee bone sphere)
  else if (px > 0.02 && py >= -1.11 && py <= -0.94 && Math.hypot(px - pinBindPos.lKnee.x, py - pinBindPos.lKnee.y, pz - pinBindPos.lKnee.z) <= 0.135) {
    attachParticleToAnchor(p, 'lKnee');
  }
  // 9. Right Knee sphere pin (around RightLeg knee bone sphere)
  else if (px < -0.02 && py >= -1.11 && py <= -0.94 && Math.hypot(px - pinBindPos.rKnee.x, py - pinBindPos.rKnee.y, pz - pinBindPos.rKnee.z) <= 0.135) {
    attachParticleToAnchor(p, 'rKnee');
  }
}

// Build 1-level Loop-subdivided Meta-Mesh surface projected onto marshmallowSDF = 0 (~7,024 triangles)
const numBaseVerts = blobParticles.length;
const edgeMidMap = new Map();
const midEdges = []; // { u, v, oppA, oppB, offsetN }

function getOrCreateMidEdge(u, v, opp) {
  const key = u < v ? u + ',' + v : v + ',' + u;
  let eIdx = edgeMidMap.get(key);
  if (eIdx === undefined) {
    eIdx = midEdges.length;
    edgeMidMap.set(key, eIdx);
    midEdges.push({
      u: Math.min(u, v),
      v: Math.max(u, v),
      oppA: opp,
      oppB: opp,
      offsetN: 0
    });
  } else {
    midEdges[eIdx].oppB = opp;
  }
  return numBaseVerts + eIdx;
}

const subIndices = [];
for (let t = 0; t < baseTris.length; t++) {
  const [a, b, c] = baseTris[t];
  const mab = getOrCreateMidEdge(a, b, c);
  const mbc = getOrCreateMidEdge(b, c, a);
  const mca = getOrCreateMidEdge(c, a, b);
  subIndices.push(
    a, mab, mca,
    b, mbc, mab,
    c, mca, mbc,
    mab, mbc, mca
  );
}

// Compute bind-pose metaball curvature offset for each subdivided edge midpoint
for (let e = 0; e < midEdges.length; e++) {
  const me = midEdges[e];
  const pu = blobParticles[me.u].x;
  const pv = blobParticles[me.v].x;
  const pa = blobParticles[me.oppA].x;
  const pb = blobParticles[me.oppB].x;

  // Smooth Loop diamond stencil midpoint
  const mx0 = 0.375 * (pu.x + pv.x) + 0.125 * (pa.x + pb.x);
  const my0 = 0.375 * (pu.y + pv.y) + 0.125 * (pa.y + pb.y);
  const mz0 = 0.375 * (pu.z + pv.z) + 0.125 * (pa.z + pb.z);

  // Project onto analytical marshmallowSDF = 0 surface
  let sx = mx0, sy = my0, sz = mz0;
  for (let s = 0; s < 3; s++) {
    const d = marshmallowSDF(sx, sy, sz);
    const [gx, gy, gz] = sdfGrad(sx, sy, sz);
    sx -= gx * d * 0.85;
    sy -= gy * d * 0.85;
    sz -= gz * d * 0.85;
  }
  const [gnx, gny, gnz] = sdfGrad(mx0, my0, mz0);
  const off = (sx - mx0) * gnx + (sy - my0) * gny + (sz - mz0) * gnz;
  me.offsetN = Math.max(-0.012, Math.min(0.012, off));
}

const totalRenderVerts = numBaseVerts + midEdges.length;
const blobGeom = new THREE.BufferGeometry();
const blobPosArr = new Float32Array(totalRenderVerts * 3);
blobGeom.setAttribute('position', new THREE.BufferAttribute(blobPosArr, 3));
blobGeom.setIndex(subIndices);

// Light Gray PBR Shader for the Marshmallow Man Meta-Mesh
const blobMat = new THREE.MeshPhysicalMaterial({
  color: 0xd8dde4,
  roughness: 0.42,
  metalness: 0.03,
  clearcoat: 0.14,
  clearcoatRoughness: 0.38,
  reflectivity: 0.35
});

const blobMesh = new THREE.Mesh(blobGeom, blobMat);
blobMesh.castShadow = true;
blobMesh.receiveShadow = true;
scene.add(blobMesh);

function syncBlobMesh() {
  const posAttr = blobGeom.attributes.position;
  const arr = posAttr.array;

  // 1. Copy base XPBD soft-body particle positions
  for (let i = 0; i < numBaseVerts; i++) {
    const pt = blobParticles[i].x;
    const i3 = i * 3;
    arr[i3] = pt.x;
    arr[i3 + 1] = pt.y;
    arr[i3 + 2] = pt.z;
  }

  // 2. Interpolate Loop-subdivided edge midpoints with live diamond normal curvature offset
  for (let e = 0; e < midEdges.length; e++) {
    const me = midEdges[e];
    const pu = blobParticles[me.u].x;
    const pv = blobParticles[me.v].x;
    const pa = blobParticles[me.oppA].x;
    const pb = blobParticles[me.oppB].x;

    const mx = 0.375 * (pu.x + pv.x) + 0.125 * (pa.x + pb.x);
    const my = 0.375 * (pu.y + pv.y) + 0.125 * (pa.y + pb.y);
    const mz = 0.375 * (pu.z + pv.z) + 0.125 * (pa.z + pb.z);

    const idx3 = (numBaseVerts + e) * 3;
    if (Math.abs(me.offsetN) > 1e-5) {
      // Outward normal across the (oppA -> oppB) and (u -> v) diamond diagonals
      const ex = pv.x - pu.x, ey = pv.y - pu.y, ez = pv.z - pu.z;
      const dx1 = pa.x - pu.x, dy1 = pa.y - pu.y, dz1 = pa.z - pu.z;
      const dx2 = pb.x - pv.x, dy2 = pb.y - pv.y, dz2 = pb.z - pv.z;
      const nx1 = ey * dz1 - ez * dy1, ny1 = ez * dx1 - ex * dz1, nz1 = ex * dy1 - ey * dx1;
      const nx2 = dz2 * ey - dy2 * ez, ny2 = dx2 * ez - dz2 * ex, nz2 = dy2 * ex - dx2 * ey;
      let nx = nx1 + nx2, ny = ny1 + ny2, nz = nz1 + nz2;
      const nl = Math.hypot(nx, ny, nz) || 1;
      arr[idx3] = mx + (nx / nl) * me.offsetN;
      arr[idx3 + 1] = my + (ny / nl) * me.offsetN;
      arr[idx3 + 2] = mz + (nz / nl) * me.offsetN;
    } else {
      arr[idx3] = mx;
      arr[idx3 + 1] = my;
      arr[idx3 + 2] = mz;
    }
  }

  posAttr.needsUpdate = true;
  blobGeom.computeVertexNormals();

  // Copy live outward unit normals onto Marshmallow Man boundary particles for one-way shirt collision
  const normArr = blobGeom.attributes.normal.array;
  for (let i = 0; i < numBaseVerts; i++) {
    const bp = blobParticles[i];
    if (bp._isBoundary) {
      if (!bp._skinNormal) bp._skinNormal = new V(0, 0, 1);
      const i3 = i * 3;
      bp._skinNormal.set(normArr[i3], normArr[i3 + 1], normArr[i3 + 2]);
    }
  }
}
syncBlobMesh();

/* ================= Cyan Checker Cotton Shirt (One-Way Body Collision, Cotton Preset, No Self-Collision) ================= */
function createCyanCheckerShirtTextures() {
  const size = 512, threads = 32, repeat = 6;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');

  const bCanvas = document.createElement('canvas');
  bCanvas.width = bCanvas.height = size;
  const bCtx = bCanvas.getContext('2d');

  ctx.fillStyle = '#1498b4';
  ctx.fillRect(0, 0, size, size);
  bCtx.fillStyle = '#808080';
  bCtx.fillRect(0, 0, size, size);

  const step = size / threads;
  const halfThreads = threads / 2;

  for (let y = 0; y < size; y += step) {
    for (let x = 0; x < size; x += step) {
      const cx = Math.floor(x / step);
      const cy = Math.floor(y / step);
      const checkX = cx < halfThreads ? 0 : 1;
      const checkY = cy < halfThreads ? 0 : 1;
      const isBrightCyan = (checkX + checkY) % 2 === 0;
      const warpOnTop = (cx + cy) % 2 === 0;
      const lum = ((cx * 17 + cy * 11) % 15) - 7;

      // Crisp 2-tone Cyan Checkerboard: Vibrant Cyan (#20d6ee) vs Deep Cyan (#0b647e)
      const baseR = (isBrightCyan ? 32 : 11) + lum;
      const baseG = (isBrightCyan ? 214 : 100) + lum;
      const baseB = (isBrightCyan ? 238 : 126) + lum;

      const cDark = `rgb(${Math.max(0, baseR - 26)}, ${Math.max(0, baseG - 26)}, ${Math.max(0, baseB - 26)})`;
      const cMid  = `rgb(${Math.min(255, baseR + 5)}, ${Math.min(255, baseG + 5)}, ${Math.min(255, baseB + 5)})`;
      const cPeak = `rgb(${Math.min(255, baseR + 18)}, ${Math.min(255, baseG + 18)}, ${Math.min(255, baseB + 18)})`;

      if (warpOnTop) {
        const grad = ctx.createLinearGradient(x, 0, x + step, 0);
        grad.addColorStop(0, cDark);
        grad.addColorStop(0.2, cMid);
        grad.addColorStop(0.5, cPeak);
        grad.addColorStop(0.8, cMid);
        grad.addColorStop(1, cDark);
        ctx.fillStyle = grad;
        ctx.fillRect(x + 1, y, step - 2, step);

        const bGrad = bCtx.createLinearGradient(x, 0, x + step, 0);
        bGrad.addColorStop(0, '#484848');
        bGrad.addColorStop(0.5, '#ffffff');
        bGrad.addColorStop(1, '#484848');
        bCtx.fillStyle = bGrad;
        bCtx.fillRect(x + 1, y, step - 2, step);
      } else {
        const grad = ctx.createLinearGradient(0, y, 0, y + step);
        grad.addColorStop(0, cDark);
        grad.addColorStop(0.2, cMid);
        grad.addColorStop(0.5, cPeak);
        grad.addColorStop(0.8, cMid);
        grad.addColorStop(1, cDark);
        ctx.fillStyle = grad;
        ctx.fillRect(x, y + 1, step, step - 2);

        const bGrad = bCtx.createLinearGradient(0, y, 0, y + step);
        bGrad.addColorStop(0, '#484848');
        bGrad.addColorStop(0.5, '#ffffff');
        bGrad.addColorStop(1, '#484848');
        bCtx.fillStyle = bGrad;
        bCtx.fillRect(x, y + 1, step, step - 2);
      }
    }
  }

  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeat, repeat);

  const bump = new THREE.CanvasTexture(bCanvas);
  bump.wrapS = bump.wrapT = THREE.RepeatWrapping;
  bump.repeat.set(repeat * 3, repeat * 3);

  return { map: tex, bumpMap: bump };
}

const cottonTex = createCyanCheckerShirtTextures();

const shirtMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  map: cottonTex.map,
  bumpMap: cottonTex.bumpMap,
  bumpScale: 0.0012,
  roughness: 0.88,
  metalness: 0.0,
  side: THREE.DoubleSide,
  polygonOffset: true,
  polygonOffsetFactor: -1,
  polygonOffsetUnits: -1
});

const sNx = 31, sNy = 22;
const shirtHalfW = 0.455;
const shirtTopY = 0.068, shirtBotY = -0.572;
const sDx = (2 * shirtHalfW) / (sNx - 1);
const sDy = (shirtTopY - shirtBotY) / (sNy - 1);
const sleeveBotJ = 9;

function isCellInShirt(ci, cj) {
  const xMid = -shirtHalfW + (ci + 0.5) * sDx;
  const yMid = shirtTopY - (cj + 0.5) * sDy;
  // Scoop collar cutout at top center
  if (cj < 3 && Math.abs(xMid) < 0.145) {
    const nr = Math.hypot(xMid / 0.155, (yMid - shirtTopY) / 0.088);
    if (nr < 1.0) return false;
  }
  // Under-sleeve cutout below armpits
  if (cj >= sleeveBotJ && (ci < 5 || ci >= sNx - 1 - 5)) return false;
  return true;
}

function isShirtNodeUsed(i, j) {
  for (let dj = -1; dj <= 0; dj++) {
    for (let di = -1; di <= 0; di++) {
      const ci = i + di, cj = j + dj;
      if (ci >= 0 && ci < sNx - 1 && cj >= 0 && cj < sNy - 1) {
        if (isCellInShirt(ci, cj)) return true;
      }
    }
  }
  return false;
}

function isSharedSeamNode(i, j) {
  const c00 = (i > 0 && j > 0) ? isCellInShirt(i - 1, j - 1) : false;
  const c10 = (i < sNx - 1 && j > 0) ? isCellInShirt(i, j - 1) : false;
  const c01 = (i > 0 && j < sNy - 1) ? isCellInShirt(i - 1, j) : false;
  const c11 = (i < sNx - 1 && j < sNy - 1) ? isCellInShirt(i, j) : false;
  if (c00 && c10 && c01 && c11) return false; // interior node -> separate Front & Back panels
  if (i === 0 && j > 0 && j < sleeveBotJ) return false; // open right cuff
  if (i === sNx - 1 && j > 0 && j < sleeveBotJ) return false; // open left cuff
  if (j === sNy - 1 && i > 5 && i < sNx - 1 - 5) return false; // open bottom waist hem
  if (j <= 3 && i >= 10 && i <= 20) {
    if (j === 0 && (i === 10 || i === 20)) return true; // shoulder-collar seam corners
    return false; // open neck collar hole
  }
  return true;
}

const shirtFrontIdx = Array.from({ length: sNy }, () => new Int32Array(sNx).fill(-1));
const shirtBackIdx  = Array.from({ length: sNy }, () => new Int32Array(sNx).fill(-1));
const shirtParticles = [];
const shirtUVs = [];
const shirtParticleMass = 1.4 / 1024;

function createShirtParticle(x, y, z, side, i, j) {
  const idx = shirtParticles.length;
  const p = world.addParticle(x, y, z, shirtParticleMass, 0.014, 0.32);
  p._isShirt = true;
  p._side = side;
  p._si = i;
  p._sj = j;
  shirtParticles.push(p);
  shirtUVs.push(i / (sNx - 1), 1 - j / (sNy - 1));
  return idx;
}

for (let j = 0; j < sNy; j++) {
  for (let i = 0; i < sNx; i++) {
    if (!isShirtNodeUsed(i, j)) continue;
    const x0 = -shirtHalfW + i * sDx;
    const y0 = shirtTopY - j * sDy;
    let zOff = 0.215;
    if (j <= sleeveBotJ && (i < 5 || i > sNx - 1 - 5)) {
      const uArm = Math.max(-1, Math.min(1, (y0 - (-0.065)) / 0.145));
      zOff = 0.145 * Math.sqrt(Math.max(0.08, 1 - uArm * uArm));
    } else {
      const uTorso = Math.max(-1, Math.min(1, x0 / 0.315));
      zOff = 0.225 * Math.sqrt(Math.max(0.08, 1 - uTorso * uTorso));
    }
    if (isSharedSeamNode(i, j)) {
      const id = createShirtParticle(x0, y0, -1.2, 0, i, j);
      shirtFrontIdx[j][i] = id;
      shirtBackIdx[j][i] = id;
    } else {
      shirtFrontIdx[j][i] = createShirtParticle(x0, y0, -1.2 + zOff, 1, i, j);
      shirtBackIdx[j][i]  = createShirtParticle(x0, y0, -1.2 - zOff, -1, i, j);
    }
  }
}

const shirtNbrs = shirtParticles.map(() => new Set());
function linkShirtNbr(a, b) {
  if (a >= 0 && b >= 0 && a !== b) {
    shirtNbrs[a].add(b);
    shirtNbrs[b].add(a);
  }
}

const shirtIndices = [];
for (let j = 0; j < sNy - 1; j++) {
  for (let i = 0; i < sNx - 1; i++) {
    if (!isCellInShirt(i, j)) continue;
    // Front quad (+Z outward normal)
    const fa = shirtFrontIdx[j][i], fb = shirtFrontIdx[j][i + 1],
          fc = shirtFrontIdx[j + 1][i], fd = shirtFrontIdx[j + 1][i + 1];
    shirtIndices.push(fa, fc, fb, fb, fc, fd);
    linkShirtNbr(fa, fb); linkShirtNbr(fc, fd); linkShirtNbr(fa, fc); linkShirtNbr(fb, fd);

    // Back quad (-Z outward normal)
    const ba = shirtBackIdx[j][i], bb = shirtBackIdx[j][i + 1],
          bc = shirtBackIdx[j + 1][i], bd = shirtBackIdx[j + 1][i + 1];
    shirtIndices.push(ba, bb, bc, bb, bd, bc);
    linkShirtNbr(ba, bb); linkShirtNbr(bc, bd); linkShirtNbr(ba, bc); linkShirtNbr(bb, bd);
  }
}

// Mold the 20% bigger 3D T-Shirt in Bind Pose so every vertex starts at least +0.042m (4.2cm) outside Marshmallow Man skin
const shirtTargetOffset = 0.042;
for (let iter = 0; iter < 14; iter++) {
  for (let v = 0; v < shirtParticles.length; v++) {
    const p = shirtParticles[v];
    let sx = 0, sy = 0, sz = 0;
    const nSet = shirtNbrs[v];
    if (nSet.size > 0) {
      for (const nb of nSet) {
        sx += shirtParticles[nb].x.x;
        sy += shirtParticles[nb].x.y;
        sz += shirtParticles[nb].x.z;
      }
      const inv = 1 / nSet.size;
      const w = 0.25;
      p.x.x = p.x.x * (1 - w) + sx * inv * w;
      p.x.y = p.x.y * (1 - w) + sy * inv * w;
      p.x.z = p.x.z * (1 - w) + sz * inv * w;
    }
    if (p._side === 0) p.x.z = -1.2;
    const d = marshmallowSDF(p.x.x, p.x.y, p.x.z) - shirtTargetOffset;
    if (d < 0) {
      const [gx, gy, gz] = sdfGrad(p.x.x, p.x.y, p.x.z);
      const step = -d * 0.90;
      p.x.x += gx * step;
      p.x.y += gy * step;
      if (p._side !== 0) p.x.z += gz * step;
    }
    p.px.copy(p.x);
  }
}

// Add Cotton Preset XPBD Distance Constraints (compliance = 0.000004 warp/weft, shearCompliance = 0.02, bendCompliance = 0)
const shirtEdgeSet = new Set();
const shirtStructConstraints = [];
const shirtShearConstraints  = [];
const shirtBendConstraints   = [];

function addShirtEdge(u, v, compliance, bucket, enabled = true, isCollarLock = false) {
  if (u < 0 || v < 0 || u === v) return;
  const key = u < v ? u + ',' + v : v + ',' + u;
  if (!shirtEdgeSet.has(key)) {
    shirtEdgeSet.add(key);
    const c = world.addDistanceConstraint(shirtParticles[u], shirtParticles[v], compliance);
    c.enabled = enabled;
    c._isCollarLock = isCollarLock;
    if (bucket) bucket.push(c);
  }
}

const COTTON_STRUCT_COMPLIANCE = 0.000004;
const COTTON_SHEAR_COMPLIANCE  = 0.02;

for (let j = 0; j < sNy - 1; j++) {
  for (let i = 0; i < sNx - 1; i++) {
    if (!isCellInShirt(i, j)) continue;
    // Collar & top shoulder seam reinforcement keeps neckline inextensible
    const isCollar = (j <= 2 && i >= 8 && i <= 22);
    const structComp = isCollar ? 0.0 : COTTON_STRUCT_COMPLIANCE;
    for (const grid of [shirtFrontIdx, shirtBackIdx]) {
      const a = grid[j][i], b = grid[j][i + 1], c = grid[j + 1][i], d = grid[j + 1][i + 1];
      // Structural warp & weft
      addShirtEdge(a, b, structComp, shirtStructConstraints, true, isCollar);
      addShirtEdge(c, d, structComp, shirtStructConstraints, true, isCollar);
      addShirtEdge(a, c, structComp, shirtStructConstraints, true, isCollar);
      addShirtEdge(b, d, structComp, shirtStructConstraints, true, isCollar);
      // Diagonal cotton weave shear
      addShirtEdge(a, d, COTTON_SHEAR_COMPLIANCE, shirtShearConstraints, true, false);
      addShirtEdge(b, c, COTTON_SHEAR_COMPLIANCE, shirtShearConstraints, true, false);
    }
  }
}

// 2-hop bending constraints along warp & weft (disabled at 0% Bending for Cotton preset; enabled when Cloth Bending > 0%)
for (const grid of [shirtFrontIdx, shirtBackIdx]) {
  for (let j = 0; j < sNy; j++) {
    for (let i = 0; i < sNx; i++) {
      const a = grid[j][i];
      if (a < 0) continue;
      if (i + 2 < sNx && grid[j][i + 1] >= 0 && grid[j][i + 2] >= 0) {
        addShirtEdge(a, grid[j][i + 2], 0.01, shirtBendConstraints, false, false);
      }
      if (j + 2 < sNy && grid[j + 1][i] >= 0 && grid[j + 2][i] >= 0) {
        addShirtEdge(a, grid[j + 2][i], 0.01, shirtBendConstraints, false, false);
      }
    }
  }
}

// Bind each shirt particle to its anatomical bone for smooth frame transport & pre-link local Marshmallow Man skin particles
characterRoot.updateMatrixWorld(true);
const shirtBoneNames = ['Spine', 'Spine1', 'Spine2', 'LeftArm', 'RightArm'];
const shirtBoneInvBind = {};
for (const bName of shirtBoneNames) {
  bonesByName[bName].updateMatrixWorld(true);
  shirtBoneInvBind[bName] = new THREE.Matrix4().copy(bonesByName[bName].matrixWorld).invert();
}

for (let i = 0; i < shirtParticles.length; i++) {
  const p = shirtParticles[i];
  p._bindPos = p.x.clone();

  // 1. Assign primary anatomical bone & transport weight (carries sleeves with rotating arms while torso cloth drapes freely)
  let bName = 'Spine1';
  let transportW = 0.34;
  if (p._bindPos.y > -0.24 && p._bindPos.x > 0.215) {
    bName = 'LeftArm';
    transportW = 0.86;
  } else if (p._bindPos.y > -0.24 && p._bindPos.x < -0.215) {
    bName = 'RightArm';
    transportW = 0.86;
  } else if (p._bindPos.y > -0.22) {
    bName = 'Spine2';
    transportW = p._bindPos.y > -0.05 ? 0.86 : 0.56;
  } else if (p._bindPos.y <= -0.38) {
    bName = 'Spine';
    transportW = 0.28;
  }
  p._boneRef = bonesByName[bName];
  p._boneLocalBind = p._bindPos.clone().applyMatrix4(shirtBoneInvBind[bName]);
  p._prevBoneWorldPos = p._bindPos.clone();
  p._targetBoneWorldPos = p._bindPos.clone();
  p._boneStepDelta = new V();
  p._transportW = transportW;

  // 2. Pre-link nearby Marshmallow Man outer boundary particles for one-way soft-body skin collision
  p._skinNeighbors = [];
  for (let k = 0; k < numBaseVerts; k++) {
    const bp = blobParticles[k];
    if (!bp._isBoundary) continue;
    const d0 = p._bindPos.distanceTo(bp._bindPos);
    if (d0 < 0.20) {
      p._skinNeighbors.push(bp);
    }
  }
}

const shirtGeom = new THREE.BufferGeometry();
const shirtPosArr = new Float32Array(shirtParticles.length * 3);
shirtGeom.setAttribute('position', new THREE.BufferAttribute(shirtPosArr, 3));
shirtGeom.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(shirtUVs), 2));
shirtGeom.setIndex(shirtIndices);

const shirtMesh = new THREE.Mesh(shirtGeom, shirtMat);
shirtMesh.castShadow = true;
shirtMesh.receiveShadow = true;
scene.add(shirtMesh);

function syncShirtMesh() {
  const posAttr = shirtGeom.attributes.position;
  const arr = posAttr.array;
  for (let i = 0; i < shirtParticles.length; i++) {
    const pt = shirtParticles[i].x;
    const i3 = i * 3;
    arr[i3] = pt.x;
    arr[i3 + 1] = pt.y;
    arr[i3 + 2] = pt.z;
  }
  posAttr.needsUpdate = true;
  shirtGeom.computeVertexNormals();
}
syncShirtMesh();

// One-Way Body-to-Shirt Collision Solver:
// Runs once per substep in world.onPostParticleSubstep (after XPBD distance constraints and before velocity derivation).
// Shirt particles collide against the live deforming Marshmallow Man soft-body skin & core capsules,
// while Marshmallow Man particles NEVER react to the shirt!
const skinCenter = new V(), skinDiff = new V(), skinRelDisp = new V();
const R_SKIN_SPHERE = 0.048;
const R_SKIN_INSET  = 0.030;
let shirtBodyFriction = 0.32;
let clothDampingVal   = 0.80;

function solveShirtBodyCollision(h) {
  const dragK = Math.max(0, Math.min(1, clothDampingVal * h));
  const contactFric = Math.min(0.35, shirtBodyFriction * 0.35);

  for (let i = 0; i < shirtParticles.length; i++) {
    const p = shirtParticles[i];
    let hadSkinContact = false;

    // 1. Softly seat the top shoulder/collar seam onto the moving shoulder frame so the shirt hangs naturally from the shoulders
    if (p._sj === 0 && p._si >= 6 && p._si <= sNx - 1 - 6) {
      p.x.lerp(p._targetBoneWorldPos, 0.45);
      p.px.lerp(p._targetBoneWorldPos, 0.45);
    }

    // 2. Collide one-way against live deforming Marshmallow Man boundary skin particles (Normal-Inset Spheres)
    const skinNbrs = p._skinNeighbors;
    for (let k = 0; k < skinNbrs.length; k++) {
      const bp = skinNbrs[k];
      const nrm = bp._skinNormal;
      skinCenter.copy(bp.x).addScaledVector(nrm, -R_SKIN_INSET);
      skinDiff.subVectors(p.x, skinCenter);
      const d2 = skinDiff.lengthSq();
      if (d2 < R_SKIN_SPHERE * R_SKIN_SPHERE && d2 > 1e-12) {
        const d = Math.sqrt(d2);
        const pen = R_SKIN_SPHERE - d;
        skinDiff.divideScalar(d); // outward unit normal n
        p.x.addScaledVector(skinDiff, pen);
        hadSkinContact = true;
      }
    }

    // 3. Watertight fallback against upper-body skeleton capsules (prevents tunneling during fast arm swings or mouse grabs)
    for (let s = 0; s < boneSegments.length; s++) {
      const seg = boneSegments[s];
      if (s > 12) continue; // upper body & arms only
      const a = cachedSegA[s];
      const b = cachedSegB[s];
      const minR = seg.radius * 1.35 + p.radius;
      segAB.subVectors(b, a);
      segAP.subVectors(p.x, a);
      const abLenSq = segAB.lengthSq();
      let t = abLenSq > 1e-8 ? segAP.dot(segAB) / abLenSq : 0;
      if (t < 0) t = 0;
      else if (t > 1) t = 1;
      closestPt.copy(a).addScaledVector(segAB, t);
      pushDir.subVectors(p.x, closestPt);
      const d2 = pushDir.lengthSq();
      if (d2 < minR * minR && d2 > 1e-12) {
        const d = Math.sqrt(d2);
        const pen = minR - d;
        pushDir.divideScalar(d);
        p.x.addScaledVector(pushDir, pen);
        hadSkinContact = true;
      }
    }

    // 4. Apply cloth contact friction & cloth damping (strictly damps p.px toward p.x)
    const dampFactor = hadSkinContact ? Math.max(dragK, contactFric) : dragK;
    if (dampFactor > 0) {
      p.px.lerp(p.x, dampFactor);
    }

    // 5. Clamp per-substep relative displacement so one-way depenetration never injects explosive velocity
    skinRelDisp.subVectors(p.x, p.px);
    const maxStepDisp = 0.0032; // <= 1.9 m/s at 600Hz substep rate
    const dispLenSq = skinRelDisp.lengthSq();
    if (dispLenSq > maxStepDisp * maxStepDisp) {
      const scale = maxStepDisp / Math.sqrt(dispLenSq);
      p.px.x = p.x.x - skinRelDisp.x * scale;
      p.px.y = p.x.y - skinRelDisp.y * scale;
      p.px.z = p.x.z - skinRelDisp.z * scale;
    }
  }
}

// Update pinned Marshmallow Man particles (Head, Elbows, Hands, Knees, Feet) to follow their bone spheres,
// and transfer moving skeleton momentum into the unpinned soft-body tissue inside each substep
const segAB = new V(), segAP = new V(), closestPt = new V(), pushDir = new V();
const cachedSegA = boneSegments.map(() => new V());
const cachedSegB = boneSegments.map(() => new V());
const prevSegMid = boneSegments.map(() => new V());
const deltaSegSubstep = boneSegments.map(() => new V());
let hasPrevSegs = false;

function updateSkeletonBlobInteraction() {
  characterRoot.updateMatrixWorld(true);
  const invSub = 1 / world.substeps;

  // 1. Compute target world positions for all pinned Marshmallow Man particles
  for (let i = 0; i < blobPinnedParticles.length; i++) {
    const p = blobPinnedParticles[i];
    if (hasPrevSegs) {
      p._prevPinWorldPos.copy(p.x);
    }
    p._targetPinWorldPos.copy(p._pinLocalPos).applyMatrix4(p._pinSphereMesh.matrixWorld);
    if (!hasPrevSegs) {
      p._prevPinWorldPos.copy(p._targetPinWorldPos);
      p.x.copy(p._targetPinWorldPos);
      p.px.copy(p._targetPinWorldPos);
    }
  }

  // 2. Compute per-substep anatomical bone frame motion for the Cotton Shirt
  for (let i = 0; i < shirtParticles.length; i++) {
    const sp = shirtParticles[i];
    sp._targetBoneWorldPos.copy(sp._boneLocalBind).applyMatrix4(sp._boneRef.matrixWorld);
    if (hasPrevSegs) {
      sp._boneStepDelta.subVectors(sp._targetBoneWorldPos, sp._prevBoneWorldPos).multiplyScalar(invSub);
    } else {
      sp._boneStepDelta.set(0, 0, 0);
    }
    sp._prevBoneWorldPos.copy(sp._targetBoneWorldPos);
  }

  // 3. Compute world endpoints and per-substep motion delta of skeleton bone segments
  for (let s = 0; s < boneSegments.length; s++) {
    boneSegments[s].boneA.getWorldPosition(cachedSegA[s]);
    boneSegments[s].boneB.getWorldPosition(cachedSegB[s]);
    closestPt.addVectors(cachedSegA[s], cachedSegB[s]).multiplyScalar(0.5);
    if (hasPrevSegs) {
      deltaSegSubstep[s].subVectors(closestPt, prevSegMid[s]).multiplyScalar(invSub);
    } else {
      deltaSegSubstep[s].set(0, 0, 0);
    }
    prevSegMid[s].copy(closestPt);
  }
  hasPrevSegs = true;
}

world.onParticleSubstep = function(wWorld, h, substepIdx) {
  // 1. Smoothly advance pinned Head, Elbow, Hand, Knee, and Foot particles across substeps
  const alpha = (substepIdx + 1) / world.substeps;
  for (let i = 0; i < blobPinnedParticles.length; i++) {
    const p = blobPinnedParticles[i];
    p.x.lerpVectors(p._prevPinWorldPos, p._targetPinWorldPos, alpha);
    p.px.copy(p.x);
    p.v.set(0, 0, 0);
  }

  // 2. Transfer moving skeleton limb/torso momentum into unpinned Marshmallow Man soft-body particles
  for (let i = 0; i < numBaseVerts; i++) {
    const p = blobParticles[i];
    if (p.invM === 0) continue;

    for (let s = 0; s < boneSegments.length; s++) {
      const seg = boneSegments[s];
      const delta = deltaSegSubstep[s];
      const isMoving = delta.lengthSq() > 1e-10;
      if (!isMoving && !seg.isCore) continue;

      const a = cachedSegA[s];
      const b = cachedSegB[s];
      const rCap = seg.radius;
      const influenceR = rCap * 2.4;

      segAB.subVectors(b, a);
      segAP.subVectors(p.x, a);
      const abLenSq = segAB.lengthSq();
      let t = abLenSq > 1e-8 ? segAP.dot(segAB) / abLenSq : 0;
      if (t < 0) t = 0;
      else if (t > 1) t = 1;

      closestPt.copy(a).addScaledVector(segAB, t);
      pushDir.subVectors(p.x, closestPt);
      const d2 = pushDir.lengthSq();

      if (d2 < influenceR * influenceR) {
        const d = Math.sqrt(d2);
        const w = 1 - d / influenceR;
        if (isMoving) {
          p.x.addScaledVector(delta, 0.42 * w * w);
        }
        if (seg.isCore && p._isBoundary && d < rCap + p.radius && d > 1e-9) {
          const push = Math.min(0.0025, ((rCap + p.radius) - d) * 0.25);
          p.x.addScaledVector(pushDir, push / d);
        }
      }
    }
  }

  // 3. Transport Cotton Shirt sleeves/shoulders with rotating upper-arm/spine frames (zero velocity compounding)
  for (let i = 0; i < shirtParticles.length; i++) {
    const sp = shirtParticles[i];
    const wT = sp._transportW;
    sp.x.addScaledVector(sp._boneStepDelta, wT);
    sp.px.addScaledVector(sp._boneStepDelta, wT);
  }
};

// 4. Single-pass post-constraint one-way collision: project Cotton Shirt outside the solved Marshmallow Man surface before velocity derivation
world.onPostParticleSubstep = function(wWorld, h) {
  solveShirtBodyCollision(h);
};

function evalLegAngles(phi, p) {
  const rawHip = Math.sin(phi - 0.15) - 0.18 * Math.sin(2 * phi - 0.4);
  const hipX = rawHip < 0
    ? rawHip * p.hipSwingFwd
    : rawHip * p.hipSwingBack;

  const swingWave = Math.pow(0.5 - 0.5 * Math.cos(phi), 1.6);
  const stanceBump = Math.pow(Math.max(0, Math.cos(phi + 0.55)), 4.0);
  const kneeX = p.kneeMin + (p.kneeSwingPeak - p.kneeMin) * swingWave + p.kneeStancePeak * stanceBump;

  const ankleX = p.anklePush * Math.exp(-Math.pow(Math.sin((phi - 1.25) * 0.5), 2) / 0.12)
               + p.ankleLift * Math.sin(phi - 0.8);

  const toeX = -0.35 * Math.exp(-Math.pow(Math.sin((phi - 1.35) * 0.5), 2) / 0.10);

  return { hipX, kneeX, ankleX, toeX };
}

function buildMocapWalkClip(profile) {
  const numFrames = 60;
  const dur = profile.duration;
  const times = new Float32Array(numFrames + 1);
  for (let k = 0; k <= numFrames; k++) {
    times[k] = (k / numFrames) * dur;
  }

  const qTracks = {};
  for (const b of BONE_DEFS) {
    qTracks[b.name] = new Float32Array((numFrames + 1) * 4);
  }
  const hipPosTrack = new Float32Array((numFrames + 1) * 3);

  const qTmp = new Q();
  const qA = new Q();
  const qB = new Q();
  const eTmp = new E();

  function writeQuat(boneName, k, q) {
    const arr = qTracks[boneName];
    const idx = k * 4;
    arr[idx] = q.x;
    arr[idx + 1] = q.y;
    arr[idx + 2] = q.z;
    arr[idx + 3] = q.w;
  }

  const footCheckBones = [
    { bone: bonesByName['LeftFoot'],     r: 0.032 },
    { bone: bonesByName['LeftToeBase'],  r: 0.024 },
    { bone: bonesByName['LeftToe_End'],  r: 0.018 },
    { bone: bonesByName['RightFoot'],    r: 0.032 },
    { bone: bonesByName['RightToeBase'], r: 0.024 },
    { bone: bonesByName['RightToe_End'], r: 0.018 }
  ];
  const worldPt = new V();

  for (let k = 0; k <= numFrames; k++) {
    const u = (k % numFrames) / numFrames;
    const phiL = u * Math.PI * 2;
    const phiR = phiL + Math.PI;

    const pPitch = profile.pelvisTilt + 0.025 * Math.cos(2 * phiL);
    const pYaw = profile.pelvisYaw * Math.sin(phiL - 0.15);
    const pRoll = -profile.pelvisRoll * Math.cos(phiL);
    qTmp.setFromEuler(eTmp.set(pPitch, pYaw, pRoll, 'YXZ'));
    writeQuat('Hips', k, qTmp);
    bonesByName['Hips'].quaternion.copy(qTmp);

    const sPitch = profile.spineLean * 0.35 + 0.015 * Math.sin(2 * phiL);
    const sYaw = -profile.spineTwist * 0.38 * Math.sin(phiL - 0.1);
    const sRoll = profile.spineRoll * 0.35 * Math.cos(phiL);
    qTmp.setFromEuler(eTmp.set(sPitch, sYaw, sRoll, 'YXZ'));
    writeQuat('Spine', k, qTmp);
    writeQuat('Spine1', k, qTmp);
    writeQuat('Spine2', k, qTmp);

    const nPitch = -profile.spineLean * 0.25 + profile.headNod * Math.sin(2 * phiL + 0.5);
    const nYaw = profile.spineTwist * 0.42 * Math.sin(phiL - 0.1);
    const nRoll = -profile.spineRoll * 0.30 * Math.cos(phiL);
    qTmp.setFromEuler(eTmp.set(nPitch, nYaw, nRoll, 'YXZ'));
    writeQuat('Neck', k, qTmp);
    writeQuat('Head', k, qTmp);
    writeQuat('HeadTop_End', k, qTmp.identity());

    qTmp.setFromEuler(eTmp.set(0, -0.05 * Math.sin(phiL), -0.04, 'YXZ'));
    writeQuat('LeftShoulder', k, qTmp);
    qTmp.setFromEuler(eTmp.set(0, 0.05 * Math.sin(phiL), 0.04, 'YXZ'));
    writeQuat('RightShoulder', k, qTmp);

    const lArmPitch = profile.armSwingX * Math.sin(phiR - 0.15);
    qA.setFromEuler(eTmp.set(lArmPitch, 0, 0, 'XYZ'));
    qB.setFromEuler(eTmp.set(0, 0, -profile.armDownZ, 'XYZ'));
    qTmp.multiplyQuaternions(qA, qB);
    writeQuat('LeftArm', k, qTmp);

    const lElbow = profile.elbowBase + profile.elbowSwing * Math.max(-0.2, -Math.sin(phiR - 0.35));
    qTmp.setFromEuler(eTmp.set(0, -lElbow, 0, 'XYZ'));
    writeQuat('LeftForeArm', k, qTmp);
    writeQuat('LeftHand', k, qTmp.setFromEuler(eTmp.set(0, -0.08, -0.06, 'XYZ')));
    writeQuat('LeftHand_End', k, qTmp.identity());

    const rArmPitch = profile.armSwingX * Math.sin(phiL - 0.15);
    qA.setFromEuler(eTmp.set(rArmPitch, 0, 0, 'XYZ'));
    qB.setFromEuler(eTmp.set(0, 0, profile.armDownZ, 'XYZ'));
    qTmp.multiplyQuaternions(qA, qB);
    writeQuat('RightArm', k, qTmp);

    const rElbow = profile.elbowBase + profile.elbowSwing * Math.max(-0.2, -Math.sin(phiL - 0.35));
    qTmp.setFromEuler(eTmp.set(0, rElbow, 0, 'XYZ'));
    writeQuat('RightForeArm', k, qTmp);
    writeQuat('RightHand', k, qTmp.setFromEuler(eTmp.set(0, 0.08, 0.06, 'XYZ')));
    writeQuat('RightHand_End', k, qTmp.identity());

    const legL = evalLegAngles(phiL, profile);
    qTmp.setFromEuler(eTmp.set(legL.hipX, 0, profile.legAbduct + 0.04 * Math.cos(phiL), 'YXZ'));
    writeQuat('LeftUpLeg', k, qTmp);
    bonesByName['LeftUpLeg'].quaternion.copy(qTmp);
    qTmp.setFromEuler(eTmp.set(legL.kneeX, 0, 0, 'XYZ'));
    writeQuat('LeftLeg', k, qTmp);
    bonesByName['LeftLeg'].quaternion.copy(qTmp);
    qTmp.setFromEuler(eTmp.set(legL.ankleX, 0, 0, 'XYZ'));
    writeQuat('LeftFoot', k, qTmp);
    bonesByName['LeftFoot'].quaternion.copy(qTmp);
    qTmp.setFromEuler(eTmp.set(legL.toeX, 0, 0, 'XYZ'));
    writeQuat('LeftToeBase', k, qTmp);
    bonesByName['LeftToeBase'].quaternion.copy(qTmp);
    writeQuat('LeftToe_End', k, qTmp.identity());
    bonesByName['LeftToe_End'].quaternion.identity();

    const legR = evalLegAngles(phiR, profile);
    qTmp.setFromEuler(eTmp.set(legR.hipX, 0, -profile.legAbduct - 0.04 * Math.cos(phiR), 'YXZ'));
    writeQuat('RightUpLeg', k, qTmp);
    bonesByName['RightUpLeg'].quaternion.copy(qTmp);
    qTmp.setFromEuler(eTmp.set(legR.kneeX, 0, 0, 'XYZ'));
    writeQuat('RightLeg', k, qTmp);
    bonesByName['RightLeg'].quaternion.copy(qTmp);
    qTmp.setFromEuler(eTmp.set(legR.ankleX, 0, 0, 'XYZ'));
    writeQuat('RightFoot', k, qTmp);
    bonesByName['RightFoot'].quaternion.copy(qTmp);
    qTmp.setFromEuler(eTmp.set(legR.toeX, 0, 0, 'XYZ'));
    writeQuat('RightToeBase', k, qTmp);
    bonesByName['RightToeBase'].quaternion.copy(qTmp);
    writeQuat('RightToe_End', k, qTmp.identity());
    bonesByName['RightToe_End'].quaternion.identity();

    const hx = HIP_BIND_POS.x + profile.hipSwayX * Math.cos(phiL - 0.25);
    const hz = HIP_BIND_POS.z + profile.hipSurgeZ * Math.sin(2 * phiL);
    rootBone.position.set(hx, HIP_BIND_POS.y, hz);
    rootBone.updateMatrixWorld(true);

    let minFootBottomY = Infinity;
    for (let f = 0; f < footCheckBones.length; f++) {
      const fb = footCheckBones[f];
      fb.bone.getWorldPosition(worldPt);
      const bottomY = worldPt.y - fb.r;
      if (bottomY < minFootBottomY) minFootBottomY = bottomY;
    }

    const hy = HIP_BIND_POS.y + (-1.50 - minFootBottomY);
    hipPosTrack[k * 3] = hx;
    hipPosTrack[k * 3 + 1] = hy;
    hipPosTrack[k * 3 + 2] = hz;
  }

  rootBone.position.copy(HIP_BIND_POS);
  for (let i = 0; i < boneList.length; i++) {
    boneList[i].quaternion.identity();
  }
  rootBone.updateMatrixWorld(true);

  const tracks = [
    new THREE.VectorKeyframeTrack('Hips.position', times, hipPosTrack)
  ];
  for (const b of BONE_DEFS) {
    tracks.push(new THREE.QuaternionKeyframeTrack(b.name + '.quaternion', times, qTracks[b.name]));
  }

  return new THREE.AnimationClip(profile.id, dur, tracks);
}

function buildBindPoseClip() {
  const times = new Float32Array([0, 1.0]);
  const hipPos = new Float32Array([
    HIP_BIND_POS.x, HIP_BIND_POS.y, HIP_BIND_POS.z,
    HIP_BIND_POS.x, HIP_BIND_POS.y, HIP_BIND_POS.z
  ]);
  const tracks = [
    new THREE.VectorKeyframeTrack('Hips.position', times, hipPos)
  ];
  for (const b of BONE_DEFS) {
    const qArr = new Float32Array([0, 0, 0, 1, 0, 0, 0, 1]);
    tracks.push(new THREE.QuaternionKeyframeTrack(b.name + '.quaternion', times, qArr));
  }
  return new THREE.AnimationClip('bindpose', 1.0, tracks);
}

function transitionToWalk(index, blendDuration = 0.75) {
  if (bindPoseTimer) {
    clearTimeout(bindPoseTimer);
    bindPoseTimer = null;
  }
  activeWalkIndex = index;
  const nextAction = walkActions[index];
  if (currentAction !== nextAction) {
    nextAction.reset();
    nextAction.setEffectiveTimeScale(1.0);
    nextAction.setEffectiveWeight(1.0);
    nextAction.play();
    currentAction.crossFadeTo(nextAction, blendDuration, false);
    currentAction = nextAction;
  }
  stateLabel.textContent = MOCAP_PROFILES[index].name;
  updateButtonHighlights(false);
}

function startBindPoseSequence() {
  if (bindPoseTimer) {
    clearTimeout(bindPoseTimer);
    bindPoseTimer = null;
  }
  mixer.stopAllAction();
  rootBone.position.copy(HIP_BIND_POS);
  for (let i = 0; i < boneList.length; i++) {
    boneList[i].quaternion.identity();
  }
  characterRoot.updateMatrixWorld(true);
  hasPrevSegs = false;
  for (let i = 0; i < blobParticles.length; i++) {
    const p = blobParticles[i];
    p.x.copy(p._bindPos);
    p.px.copy(p._bindPos);
    p.v.set(0, 0, 0);
    if (p._prevPinWorldPos) {
      p._prevPinWorldPos.copy(p._bindPos);
      p._targetPinWorldPos.copy(p._bindPos);
    }
  }
  for (let i = 0; i < shirtParticles.length; i++) {
    const sp = shirtParticles[i];
    sp.x.copy(sp._bindPos);
    sp.px.copy(sp._bindPos);
    sp.v.set(0, 0, 0);
    sp._prevBoneWorldPos.copy(sp._bindPos);
    sp._targetBoneWorldPos.copy(sp._bindPos);
    sp._boneStepDelta.set(0, 0, 0);
  }
  syncBlobMesh();
  syncShirtMesh();

  bindPoseAction.reset();
  bindPoseAction.setEffectiveWeight(1.0);
  bindPoseAction.play();
  currentAction = bindPoseAction;

  stateLabel.textContent = 'Bind Pose (T-Pose) — Blending in 1.0s...';
  updateButtonHighlights(true);
  RoomEnv.showNote('Bind Pose (T-Pose). Cotton Shirt over Marshmallow Man (one-way body collision) — blending in 1.0s...', 2400);

  bindPoseTimer = setTimeout(() => {
    bindPoseTimer = null;
    transitionToWalk(activeWalkIndex, 0.85);
    RoomEnv.showNote('Blended into ' + MOCAP_PROFILES[activeWalkIndex].name, 2200);
  }, 1000);
}

const sliderSoftness  = document.getElementById('slider-softness');
const sliderBending   = document.getElementById('slider-bending');
const sliderVolume    = document.getElementById('slider-volume');
const sliderDamping   = document.getElementById('slider-damping');
const sliderGravity   = document.getElementById('slider-gravity');
const sliderMass      = document.getElementById('slider-mass');
const sliderWalkSpeed = document.getElementById('slider-walkspeed');

const valSoftness  = document.getElementById('val-softness');
const valBending   = document.getElementById('val-bending');
const valVolume    = document.getElementById('val-volume');
const valDamping   = document.getElementById('val-damping');
const valGravity   = document.getElementById('val-gravity');
const valMass      = document.getElementById('val-mass');
const valWalkSpeed = document.getElementById('val-walkspeed');

let walkSpeedScale = 1.0;

function applySoftBodySliders() {
  const softnessPct = parseFloat(sliderSoftness.value);
  const bendingPct  = parseFloat(sliderBending.value);
  const volumePct   = parseFloat(sliderVolume.value);
  const dampingVal  = parseFloat(sliderDamping.value);
  const gravityVal  = parseFloat(sliderGravity.value);
  const massScale   = parseFloat(sliderMass.value);
  walkSpeedScale    = parseFloat(sliderWalkSpeed.value);

  valSoftness.textContent  = Math.round(softnessPct) + '%';
  valBending.textContent   = Math.round(bendingPct) + '%';
  valVolume.textContent    = Math.round(volumePct) + '%';
  valDamping.textContent   = dampingVal.toFixed(2);
  valGravity.textContent   = gravityVal.toFixed(1);
  valMass.textContent      = massScale.toFixed(1) + 'x';
  valWalkSpeed.textContent = walkSpeedScale.toFixed(1) + 'x';

  // 1. 1-hop tetrahedral edge compliance (40% -> 0.0040)
  const edgeCompliance = softnessPct <= 0
    ? 0.00005
    : 0.025 * Math.pow(softnessPct / 100, 2.0);
  for (let i = 0; i < tetEdgeConstraints.length; i++) {
    tetEdgeConstraints[i].compliance = edgeCompliance;
  }

  // 2. 2-hop axial structural bending compliance (55% -> ~0.0090; higher % = firmer shape)
  const bendCompliance = 0.0002 + 0.0398 * Math.pow(1 - bendingPct / 100, 1.89);
  for (let i = 0; i < bendEdgeConstraints.length; i++) {
    bendEdgeConstraints[i].compliance = bendCompliance;
  }

  // 3. Tetrahedral volume preservation compliance (100% -> 0.0 incompressible)
  const volCompliance = 0.030 * Math.pow(1 - volumePct / 100, 2.0);
  for (let i = 0; i < world.volumeConstraints.length; i++) {
    world.volumeConstraints[i].compliance = volCompliance;
  }

  // 4. Linear damping & gravity
  world.linearDamping = dampingVal;
  world.accel.set(0, -gravityVal, 0);

  // 5. Unpinned Marshmallow Man particle mass scaling (Cotton Shirt keeps its cloth mass)
  const invParticleMass = 1 / (0.048 * massScale);
  for (let i = 0; i < blobParticles.length; i++) {
    const p = blobParticles[i];
    if (!p._isPinned) {
      p.invM = invParticleMass;
    }
  }
}

[sliderSoftness, sliderBending, sliderVolume, sliderDamping, sliderGravity, sliderMass, sliderWalkSpeed].forEach(el => {
  el.addEventListener('input', applySoftBodySliders);
});
applySoftBodySliders();

// Cloth Dynamics Sliders (for Cyan Checker Cotton Shirt)
const sliderClothStretch  = document.getElementById('slider-cloth-stretch');
const sliderClothShear    = document.getElementById('slider-cloth-shear');
const sliderClothBend     = document.getElementById('slider-cloth-bend');
const sliderClothFriction = document.getElementById('slider-cloth-friction');
const sliderClothDamping  = document.getElementById('slider-cloth-damping');
const sliderClothMass     = document.getElementById('slider-cloth-mass');

const valClothStretch  = document.getElementById('val-cloth-stretch');
const valClothShear    = document.getElementById('val-cloth-shear');
const valClothBend     = document.getElementById('val-cloth-bend');
const valClothFriction = document.getElementById('val-cloth-friction');
const valClothDamping  = document.getElementById('val-cloth-damping');
const valClothMass     = document.getElementById('val-cloth-mass');

function applyClothSliders() {
  const stretchPct  = parseFloat(sliderClothStretch.value);
  const shearPct    = parseFloat(sliderClothShear.value);
  const bendPct     = parseFloat(sliderClothBend.value);
  const frictionPct = parseFloat(sliderClothFriction.value);
  const dampingVal  = parseFloat(sliderClothDamping.value);
  const massVal     = parseFloat(sliderClothMass.value);

  valClothStretch.textContent  = Math.round(stretchPct) + '%';
  valClothShear.textContent    = Math.round(shearPct) + '%';
  valClothBend.textContent     = Math.round(bendPct) + '%';
  valClothFriction.textContent = Math.round(frictionPct) + '%';
  valClothDamping.textContent  = dampingVal.toFixed(2);
  valClothMass.textContent     = massVal.toFixed(1) + 'kg';

  // 1. Structural warp & weft stretch compliance (10% -> 0.000004 Cotton preset)
  const stretchComp = stretchPct <= 0 ? 0 : 0.004 * Math.pow(stretchPct / 100, 3);
  for (let i = 0; i < shirtStructConstraints.length; i++) {
    const c = shirtStructConstraints[i];
    c.compliance = c._isCollarLock ? 0.0 : stretchComp;
  }

  // 2. Diagonal weave shear compliance (20% -> 0.02 Cotton preset)
  const shearComp = (shearPct / 100) * 0.10;
  for (let i = 0; i < shirtShearConstraints.length; i++) {
    shirtShearConstraints[i].compliance = shearComp;
  }

  // 3. 2-hop bending stiffness (0% -> disabled for Cotton preset; >0% -> enabled with compliance)
  const bendEnabled = bendPct > 0;
  const bendComp = bendEnabled ? (0.02 * Math.pow(1 - bendPct / 100, 3) + 0.00002) : 0.01;
  for (let i = 0; i < shirtBendConstraints.length; i++) {
    const c = shirtBendConstraints[i];
    c.enabled = bendEnabled;
    c.compliance = bendComp;
  }

  // 4. Shirt-on-body contact friction & cloth air damping
  shirtBodyFriction = frictionPct / 100;
  clothDampingVal   = dampingVal;

  // 5. Shirt particle mass & friction
  const invShirtMass = 1 / Math.max(0.0001, massVal / shirtParticles.length);
  for (let i = 0; i < shirtParticles.length; i++) {
    const sp = shirtParticles[i];
    sp.friction = shirtBodyFriction;
    sp.invM = invShirtMass;
  }
}

[sliderClothStretch, sliderClothShear, sliderClothBend, sliderClothFriction, sliderClothDamping, sliderClothMass].forEach(el => {
  el.addEventListener('input', applyClothSliders);
});
applyClothSliders();

/* ================= Sliders Visibility (On/Off) & Mode Chooser (Softbody / Cloth) ================= */
const softControlsPanel = document.getElementById('soft-controls');
const groupSoftbody     = document.getElementById('sliders-softbody');
const groupCloth        = document.getElementById('sliders-cloth');
const tabSoftbody       = document.getElementById('tab-softbody');
const tabCloth          = document.getElementById('tab-cloth');
const tabToggle         = document.getElementById('tab-toggle');
const btnSliders        = document.getElementById('btn-sliders');
const btnSliderMode     = document.getElementById('btn-slider-mode');

let slidersVisible = true;
let activeSliderMode = 'softbody'; // 'softbody' | 'cloth'

function updateSlidersUI() {
  softControlsPanel.classList.toggle('collapsed', !slidersVisible);
  groupSoftbody.style.display = (slidersVisible && activeSliderMode === 'softbody') ? 'flex' : 'none';
  groupCloth.style.display    = (slidersVisible && activeSliderMode === 'cloth') ? 'flex' : 'none';

  tabSoftbody.classList.toggle('active', slidersVisible && activeSliderMode === 'softbody');
  tabCloth.classList.toggle('cloth-active', slidersVisible && activeSliderMode === 'cloth');

  tabToggle.classList.toggle('active', slidersVisible);
  tabToggle.textContent = slidersVisible ? 'Sliders: On' : 'Sliders: Off';

  btnSliders.classList.toggle('active', slidersVisible);
  btnSliders.textContent = slidersVisible ? 'Sliders: On' : 'Sliders: Off';

  btnSliderMode.textContent = activeSliderMode === 'softbody' ? 'Mode: Softbody' : 'Mode: Cloth';
  btnSliderMode.classList.toggle('active', activeSliderMode === 'cloth');
}

tabSoftbody.addEventListener('click', () => {
  activeSliderMode = 'softbody';
  slidersVisible = true;
  updateSlidersUI();
});

tabCloth.addEventListener('click', () => {
  activeSliderMode = 'cloth';
  slidersVisible = true;
  updateSlidersUI();
});

tabToggle.addEventListener('click', () => {
  slidersVisible = !slidersVisible;
  updateSlidersUI();
});

btnSliders.addEventListener('click', () => {
  slidersVisible = !slidersVisible;
  updateSlidersUI();
});

btnSliderMode.addEventListener('click', () => {
  activeSliderMode = activeSliderMode === 'softbody' ? 'cloth' : 'softbody';
  slidersVisible = true;
  updateSlidersUI();
  RoomEnv.showNote(activeSliderMode === 'softbody' ? 'Showing Softbody Dynamics Sliders' : 'Showing Cloth Dynamics Sliders (Cyan Checker Shirt)', 1800);
});

updateSlidersUI();

/* ================= HUD Controls & Keyboard Shortcuts ================= */
let wireActive = false;
document.getElementById('btn-wire').addEventListener('click', () => {
  wireActive = !wireActive;
  blobMat.wireframe = wireActive;
  shirtMat.wireframe = wireActive;
  const btn = document.getElementById('btn-wire');
  btn.classList.toggle('active', wireActive);
  btn.textContent = wireActive ? 'Wireframe: On' : 'Wireframe';
});

document.getElementById('btn-bindpose').addEventListener('click', startBindPoseSequence);
walkButtons.forEach((btn, idx) => {
  btn.addEventListener('click', () => {
    transitionToWalk(idx, 0.55);
    RoomEnv.showNote('Swapped to ' + MOCAP_PROFILES[idx].name, 1800);
  });
});

window.addEventListener('keydown', e => {
  if (e.key === '1') transitionToWalk(0, 0.55);
  else if (e.key === '2') transitionToWalk(1, 0.55);
  else if (e.key === '3') transitionToWalk(2, 0.55);
  else if (e.key === 'w' || e.key === 'W') document.getElementById('btn-wire').click();
  else if (e.key === 'r' || e.key === 'R' || e.key === '0') startBindPoseSequence();
});

/* ================= Animation & Soft-Body Physics Loop ================= */
const tickFps = RoomEnv.createFpsMeter();
let acc = 0, last = performance.now();

function frame(now) {
  tickFps(now);
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;

  // 1. Advance skeleton animation mixer (scaled by Walk Speed slider during walk cycles)
  mixer.update(dt * (currentAction === bindPoseAction ? 1.0 : walkSpeedScale));

  // 2. Pin soft-body particles to bone spheres & compute skeleton/shirt frame motion
  updateSkeletonBlobInteraction();

  // 3. Step XPBD soft-body & Cotton Shirt physics (with one-way body->shirt collision)
  acc += dt;
  let n = 0;
  while (acc >= world.dt && n < 2) {
    world.step();
    acc -= world.dt;
    n++;
  }
  if (n === 2) acc = 0;

  // 4. Sync soft-body Marshmallow Man & Cotton Shirt surface vertices & normals
  syncBlobMesh();
  syncShirtMesh();

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
