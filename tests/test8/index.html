<script>
(() => {
'use strict';

const V = THREE.Vector3;
const Q = THREE.Quaternion;
const E = THREE.Euler;

const {
  HIP_BIND_POS,
  BONE_DEFS,
  PIN_BONE_NAMES,
  buildSkeleton,
  smin,
  sdSphere,
  sdCapsule,
  marshmallowSDF,
  sdfGrad,
  calcSignedTetVol,
  createHumanSkinMaterial,
  createCyanCheckerShirtTextures,
  createShirtMaterial,
  MOCAP_PROFILES,
  evalLegAngles,
  buildMocapWalkClip,
  buildBindPoseClip
} = CharacterAsset;

/* ================= XPBD Physics World in Open Empty Space ================= */
const world = new XPBD.World({
  dt: 1/60,
  substeps: 10,
  positionIterations: 2,
  linearDamping: 1.25,
  selfCollision: false
});
// Gravity pulls the head-pinned Marshmallow Man soft body so its arms droop and body bounces naturally
world.accel.set(0, -6.2, 0);

// Wide open empty-space bounds (no 3m box walls; only open floor at y = -1.50m)
world.box.hx = 50;
world.box.hy = 1.5;
world.box.d = 100;
world.walls = [
  { n: new V(0, 1, 0), o: -1.5 } // Open floor at y = -1.50m
];
world.center.set(0, 0, -1.2);

/* ================= Rendering & Empty 3D Space Setup ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c1017);
scene.fog = new THREE.FogExp2(0x0c1017, 0.045);

const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 80);

// Studio 3-point lighting in open empty space
const keyLight = new THREE.DirectionalLight(0xfff4e6, 0.85);
keyLight.position.set(2.8, 4.2, 2.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 15;
keyLight.shadow.camera.left = -2.2;
keyLight.shadow.camera.right = 2.2;
keyLight.shadow.camera.top = 2.5;
keyLight.shadow.camera.bottom = -2.2;
keyLight.shadow.bias = -0.0005;
keyLight.shadow.radius = 2.5;
scene.add(keyLight);
keyLight.target.position.set(0, -0.5, -1.2);
scene.add(keyLight.target);

const fillLight = new THREE.DirectionalLight(0x90b8f8, 0.09);
fillLight.position.set(-3.0, 2.2, 1.5);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x60d0ff, 0.38);
rimLight.position.set(0.0, 2.5, -4.2);
scene.add(rimLight);

const ambLight = new THREE.AmbientLight(0xd0dcf0, 0.10);
scene.add(ambLight);

// Open Infinite-Space Ground Plane (shadow receiver, no walls or ceiling)
const groundMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({
    color: 0x11161f,
    roughness: 0.78,
    metalness: 0.08
  })
);
groundMesh.rotation.x = -Math.PI / 2;
groundMesh.position.set(0, -1.50, -1.2);
groundMesh.receiveShadow = true;
scene.add(groundMesh);

// Subtle open-space floor grid
const gridHelper = new THREE.GridHelper(16, 32, 0x2a3648, 0x18202c);
gridHelper.position.set(0, -1.499, -1.2);
scene.add(gridHelper);

const orbitTarget = new V(0, -0.52, -1.2);
let orbitControls = null;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
  if (orbitControls) orbitControls.update();
}
window.addEventListener('resize', resize);

/* ================= Humanoid Skeleton Hierarchy ================= */
const skeleton = buildSkeleton({ parentGroup: scene, visibleMeshes: false });
const {
  characterRoot,
  rootBone,
  bonesByName,
  boneList,
  boneSegments,
  headSphereMesh,
  pinAnchors
} = skeleton;

// PBR + Pre-Integrated Subsurface Scattering (SSS) Human Skin Shader for the Character Meta-Mesh
const blobMat = createHumanSkinMaterial();

/* ================= Cyan Checker Cotton Shirt Material ================= */
const cottonTex = createCyanCheckerShirtTextures();
const shirtMat = createShirtMaterial(cottonTex);
const pinMarkerGeom = new THREE.SphereGeometry(0.012, 10, 8);
const pinMarkerMat = new THREE.MeshBasicMaterial({ color: 0xff3b30 });
const pinDotMeshes = [];

let blobParticles = [];
let numBaseVerts = 0;
let midEdges = [];
let tetEdgeConstraints = [];
let bendEdgeConstraints = [];
let blobPinnedParticles = [];
let blobGeom = new THREE.BufferGeometry();
const blobMesh = new THREE.Mesh(blobGeom, blobMat);
blobMesh.castShadow = true;
blobMesh.receiveShadow = true;
scene.add(blobMesh);

let shirtParticles = [];
let shirtStructConstraints = [];
let shirtShearConstraints  = [];
let shirtBendConstraints   = [];
let shirtGeom = new THREE.BufferGeometry();
const shirtMesh = new THREE.Mesh(shirtGeom, shirtMat);
shirtMesh.castShadow = true;
shirtMesh.receiveShadow = true;
scene.add(shirtMesh);

let shirtEnabled = true;
let currentSoftDiv = 1;
let currentClothDiv = 1;
let currentShirtNx = 31;
let boundaryList = [];
let interiorList = [];
let draggableParticles = [];

function syncBlobMesh() {
  const posAttr = blobGeom.attributes.position;
  if (!posAttr) return;
  const arr = posAttr.array;

  // 1. Copy base XPBD soft-body particle positions
  for (let i = 0; i < numBaseVerts; i++) {
    const pt = blobParticles[i].x;
    const i3 = i * 3;
    arr[i3] = pt.x;
    arr[i3 + 1] = pt.y;
    arr[i3 + 2] = pt.z;
  }

  // 2. Interpolate Loop-subdivided edge midpoints with live diamond normal curvature offset
  for (let e = 0; e < midEdges.length; e++) {
    const me = midEdges[e];
    const pu = blobParticles[me.u].x;
    const pv = blobParticles[me.v].x;
    const pa = blobParticles[me.oppA].x;
    const pb = blobParticles[me.oppB].x;

    const mx = 0.375 * (pu.x + pv.x) + 0.125 * (pa.x + pb.x);
    const my = 0.375 * (pu.y + pv.y) + 0.125 * (pa.y + pb.y);
    const mz = 0.375 * (pu.z + pv.z) + 0.125 * (pa.z + pb.z);

    const idx3 = (numBaseVerts + e) * 3;
    if (Math.abs(me.offsetN) > 1e-5) {
      const ex = pv.x - pu.x, ey = pv.y - pu.y, ez = pv.z - pu.z;
      const dx1 = pa.x - pu.x, dy1 = pa.y - pu.y, dz1 = pa.z - pu.z;
      const dx2 = pb.x - pv.x, dy2 = pb.y - pv.y, dz2 = pb.z - pv.z;
      const nx1 = ey * dz1 - ez * dy1, ny1 = ez * dx1 - ex * dz1, nz1 = ex * dy1 - ey * dx1;
      const nx2 = dz2 * ey - dy2 * ez, ny2 = dx2 * ez - dz2 * ex, nz2 = dy2 * ex - dx2 * ey;
      const nx = nx1 + nx2, ny = ny1 + ny2, nz = nz1 + nz2;
      const nl = Math.hypot(nx, ny, nz) || 1;
      arr[idx3] = mx + (nx / nl) * me.offsetN;
      arr[idx3 + 1] = my + (ny / nl) * me.offsetN;
      arr[idx3 + 2] = mz + (nz / nl) * me.offsetN;
    } else {
      arr[idx3] = mx;
      arr[idx3 + 1] = my;
      arr[idx3 + 2] = mz;
    }
  }

  posAttr.needsUpdate = true;
  blobGeom.computeVertexNormals();

  // Copy live outward unit normals onto Marshmallow Man boundary particles and smooth across 1-ring boundary neighbors
  const normArr = blobGeom.attributes.normal.array;
  for (let i = 0; i < numBaseVerts; i++) {
    const bp = blobParticles[i];
    if (bp._isBoundary) {
      if (!bp._rawNormal) bp._rawNormal = new V(0, 0, 1);
      if (!bp._skinNormal) bp._skinNormal = new V(0, 0, 1);
      const i3 = i * 3;
      bp._rawNormal.set(normArr[i3], normArr[i3 + 1], normArr[i3 + 2]);
    }
  }
  for (let i = 0; i < numBaseVerts; i++) {
    const bp = blobParticles[i];
    if (bp._isBoundary) {
      bp._skinNormal.copy(bp._rawNormal).multiplyScalar(2.0);
      const bNbrs = bp._boundNbrs;
      if (bNbrs) {
        for (let k = 0; k < bNbrs.length; k++) {
          bp._skinNormal.add(bNbrs[k]._rawNormal);
        }
      }
      const nl = bp._skinNormal.length();
      if (nl > 1e-6) bp._skinNormal.divideScalar(nl);
    }
  }
}

function syncShirtMesh() {
  if (!shirtEnabled) return;
  const posAttr = shirtGeom.attributes.position;
  if (!posAttr) return;
  const arr = posAttr.array;
  for (let i = 0; i < shirtParticles.length; i++) {
    const pt = shirtParticles[i].x;
    const i3 = i * 3;
    arr[i3] = pt.x;
    arr[i3 + 1] = pt.y;
    arr[i3 + 2] = pt.z;
  }
  posAttr.needsUpdate = true;
  shirtGeom.computeVertexNormals();
}

function buildCharacterMeshes(softDiv, clothDiv) {
  currentSoftDiv = softDiv;
  currentClothDiv = clothDiv;

  // Reset skeleton to exact T-Pose (Bind Pose) before generating bind-pose meshes & pin anchors
  rootBone.position.copy(HIP_BIND_POS);
  for (let i = 0; i < boneList.length; i++) {
    boneList[i].quaternion.identity();
  }
  characterRoot.updateMatrixWorld(true);

  // Clear previous XPBD particles, constraints, volume constraints, and pin markers
  world.particles.length = 0;
  world.constraints.length = 0;
  world.volumeConstraints.length = 0;
  for (let i = 0; i < pinDotMeshes.length; i++) {
    if (pinDotMeshes[i].parent) pinDotMeshes[i].parent.remove(pinDotMeshes[i]);
  }
  pinDotMeshes.length = 0;

  // Increase solver substeps to 16 for 2x subdivided cloth/softbody (h = 1/960s)
  if (softDiv > 1 || clothDiv > 1) {
    world.substeps = 16;
    world.positionIterations = 1;
  } else {
    world.substeps = 10;
    world.positionIterations = 2;
  }

  /* ---- 1. Build Volumetric Tetrahedral Marshmallow Man Meta-Mesh (1x or 2x Divisions) ---- */
  const dx = softDiv === 1 ? 0.072 : 0.051;
  const cxN = softDiv === 1 ? 23 : 33;
  const cyN = softDiv === 1 ? 26 : 37;
  const czN = softDiv === 1 ? 7 : 11;
  const nx = cxN + 1, ny = cyN + 1, nz = czN + 1;
  const minX = -cxN * 0.5 * dx;
  const maxY = 0.34;
  const minZ = -1.2 - czN * 0.5 * dx;
  const cIdx = (i, j, k) => (k * cyN + j) * cxN + i;
  const cellActive = new Uint8Array(cxN * cyN * czN);
  const midXCol = Math.floor(cxN / 2);

  for (let k = 0; k < czN; k++) {
    for (let j = 0; j < cyN; j++) {
      for (let i = 0; i < cxN; i++) {
        const cx = minX + (i + 0.5) * dx;
        const cy = maxY - (j + 0.5) * dx;
        const cz = minZ + (k + 0.5) * dx;
        // Keep center column between legs clear below hips so left & right marshmallow legs are separate
        if (i === midXCol && cy < -0.66) continue;
        if (marshmallowSDF(cx, cy, cz) <= 0.016) {
          cellActive[cIdx(i, j, k)] = 1;
        }
      }
    }
  }

  // Prune any dangling 1-neighbor hex cell
  for (let pass = 0; pass < 2; pass++) {
    for (let k = 0; k < czN; k++) {
      for (let j = 0; j < cyN; j++) {
        for (let i = 0; i < cxN; i++) {
          if (!cellActive[cIdx(i, j, k)]) continue;
          let n = 0;
          if (i > 0 && cellActive[cIdx(i - 1, j, k)]) n++;
          if (i < cxN - 1 && cellActive[cIdx(i + 1, j, k)]) n++;
          if (j > 0 && cellActive[cIdx(i, j - 1, k)]) n++;
          if (j < cyN - 1 && cellActive[cIdx(i, j + 1, k)]) n++;
          if (k > 0 && cellActive[cIdx(i, j, k - 1)]) n++;
          if (k < czN - 1 && cellActive[cIdx(i, j, k + 1)]) n++;
          if (n <= 1) cellActive[cIdx(i, j, k)] = 0;
        }
      }
    }
  }

  const gIdx = (i, j, k) => (k * ny + j) * nx + i;
  const vertMap = new Map();
  blobParticles = [];
  const metaMeshRef = {};

  function getMetaVert(i, j, k) {
    const g = gIdx(i, j, k);
    if (!vertMap.has(g)) {
      vertMap.set(g, blobParticles.length);
      const p = world.addParticle(minX + i * dx, maxY - j * dx, minZ + k * dx, 0.048, dx * 0.25, 0.30);
      p._tetMesh = metaMeshRef;
      p._tx = i; p._ty = j; p._tz = k;
      p._isBoundary = false;
      blobParticles.push(p);
    }
    return vertMap.get(g);
  }

  const metaTets = [];
  for (let k = 0; k < czN; k++) {
    for (let j = 0; j < cyN; j++) {
      for (let i = 0; i < cxN; i++) {
        if (!cellActive[cIdx(i, j, k)]) continue;
        const v0 = getMetaVert(i, j, k),         v1 = getMetaVert(i + 1, j, k),
              v2 = getMetaVert(i + 1, j + 1, k), v3 = getMetaVert(i, j + 1, k),
              v4 = getMetaVert(i, j, k + 1),     v5 = getMetaVert(i + 1, j, k + 1),
              v6 = getMetaVert(i + 1, j + 1, k + 1), v7 = getMetaVert(i, j + 1, k + 1);
        if ((i + j + k) % 2 === 0) {
          metaTets.push([v0, v1, v3, v4], [v1, v2, v3, v6], [v1, v4, v5, v6], [v3, v4, v6, v7], [v1, v3, v4, v6]);
        } else {
          metaTets.push([v0, v1, v2, v5], [v0, v2, v3, v7], [v0, v4, v5, v7], [v2, v5, v6, v7], [v0, v2, v5, v7]);
        }
      }
    }
  }

  for (let ti = 0; ti < metaTets.length; ti++) {
    const tet = metaTets[ti];
    if (calcSignedTetVol(blobParticles[tet[0]], blobParticles[tet[1]], blobParticles[tet[2]], blobParticles[tet[3]]) < 0) {
      const tmp = tet[1]; tet[1] = tet[2]; tet[2] = tmp;
    }
  }

  const faceMap = new Map();
  for (let ti = 0; ti < metaTets.length; ti++) {
    const tet = metaTets[ti];
    const fList = [
      [tet[0], tet[1], tet[2], tet[3]],
      [tet[0], tet[1], tet[3], tet[2]],
      [tet[0], tet[2], tet[3], tet[1]],
      [tet[1], tet[2], tet[3], tet[0]]
    ];
    for (let f = 0; f < 4; f++) {
      const [a, b, c, opp] = fList[f];
      const key = [a, b, c].sort((x, y) => x - y).join(',');
      if (!faceMap.has(key)) faceMap.set(key, { count: 0, a, b, c, opp });
      faceMap.get(key).count++;
    }
  }

  const boundaryNeighbors = blobParticles.map(() => new Set());
  const allNeighbors = blobParticles.map(() => new Set());
  const incidentTets = blobParticles.map(() => []);
  for (let ti = 0; ti < metaTets.length; ti++) {
    const [a, b, c, d] = metaTets[ti];
    incidentTets[a].push(ti); incidentTets[b].push(ti);
    incidentTets[c].push(ti); incidentTets[d].push(ti);
    for (const [u, v] of [[a, b], [a, c], [a, d], [b, c], [b, d], [c, d]]) {
      allNeighbors[u].add(v);
      allNeighbors[v].add(u);
    }
  }

  const baseTris = [];
  for (const [, val] of faceMap) {
    if (val.count === 1) {
      const { a, b, c, opp } = val;
      blobParticles[a]._isBoundary = true;
      blobParticles[b]._isBoundary = true;
      blobParticles[c]._isBoundary = true;
      boundaryNeighbors[a].add(b); boundaryNeighbors[a].add(c);
      boundaryNeighbors[b].add(a); boundaryNeighbors[b].add(c);
      boundaryNeighbors[c].add(a); boundaryNeighbors[c].add(b);

      const pa = blobParticles[a].x, pb = blobParticles[b].x, pc = blobParticles[c].x, po = blobParticles[opp].x;
      const ux = pb.x - pa.x, uy = pb.y - pa.y, uz = pb.z - pa.z;
      const vx = pc.x - pa.x, vy = pc.y - pa.y, vz = pc.z - pa.z;
      const fnx = uy * vz - uz * vy, fny = uz * vx - ux * vz, fnz = ux * vy - uy * vx;
      const ox = pa.x - po.x, oy = pa.y - po.y, oz = pa.z - po.z;
      if (fnx * ox + fny * oy + fnz * oz > 0) baseTris.push([a, b, c]);
      else baseTris.push([a, c, b]);
    }
  }

  // Constrained Elastic Surface-Net smoothing + exact Newton projection onto marshmallowSDF = 0
  const minAllowedVol = (dx * dx * dx / 6) * 0.08;
  const maxProjStep = 0.022 / softDiv;
  for (let iter = 0; iter < 14; iter++) {
    for (let i = 0; i < blobParticles.length; i++) {
      const p = blobParticles[i];
      const oldX = p.x.x, oldY = p.x.y, oldZ = p.x.z;
      const nbrs = p._isBoundary ? boundaryNeighbors[i] : allNeighbors[i];
      let nxPos = oldX, nyPos = oldY, nzPos = oldZ;
      if (nbrs.size > 0) {
        let sx = 0, sy = 0, sz = 0;
        for (const j of nbrs) {
          sx += blobParticles[j].x.x;
          sy += blobParticles[j].x.y;
          sz += blobParticles[j].x.z;
        }
        const inv = 1 / nbrs.size;
        const w = p._isBoundary ? 0.42 : 0.35;
        nxPos = oldX * (1 - w) + sx * inv * w;
        nyPos = oldY * (1 - w) + sy * inv * w;
        nzPos = oldZ * (1 - w) + sz * inv * w;
      }
      if (p._isBoundary) {
        const d = marshmallowSDF(nxPos, nyPos, nzPos);
        const [gx, gy, gz] = sdfGrad(nxPos, nyPos, nzPos);
        const step = Math.max(-maxProjStep, Math.min(maxProjStep, d * 0.78));
        nxPos -= gx * step;
        nyPos -= gy * step;
        nzPos -= gz * step;
      }
      p.x.set(nxPos, nyPos, nzPos);
      let ok = true;
      for (const ti of incidentTets[i]) {
        const tet = metaTets[ti];
        if (calcSignedTetVol(blobParticles[tet[0]], blobParticles[tet[1]], blobParticles[tet[2]], blobParticles[tet[3]]) < minAllowedVol) {
          ok = false;
          break;
        }
      }
      if (!ok) {
        p.x.set(0.5 * (oldX + nxPos), 0.5 * (oldY + nyPos), 0.5 * (oldZ + nzPos));
        let ok2 = true;
        for (const ti of incidentTets[i]) {
          const tet = metaTets[ti];
          if (calcSignedTetVol(blobParticles[tet[0]], blobParticles[tet[1]], blobParticles[tet[2]], blobParticles[tet[3]]) < minAllowedVol) {
            ok2 = false;
            break;
          }
        }
        if (!ok2) p.x.set(oldX, oldY, oldZ);
      }
      p.px.copy(p.x);
    }
  }

  for (let i = 0; i < blobParticles.length; i++) {
    const bp = blobParticles[i];
    bp._bindPos = bp.x.clone();
    if (bp._isBoundary) {
      bp._boundNbrs = Array.from(boundaryNeighbors[i]).map(j => blobParticles[j]);
    }
  }

  // Create XPBD Soft-Body Constraints (1-hop tet edges + 2-hop axial bending + TetVolumeConstraints)
  const edgeSet = new Set();
  tetEdgeConstraints = [];
  bendEdgeConstraints = [];
  function addMetaEdge(u, v, compliance, targetList) {
    const key = u < v ? u + ',' + v : v + ',' + u;
    if (!edgeSet.has(key)) {
      edgeSet.add(key);
      const c = world.addDistanceConstraint(blobParticles[u], blobParticles[v], compliance);
      if (targetList) targetList.push(c);
    }
  }
  for (let ti = 0; ti < metaTets.length; ti++) {
    const [a, b, c, d] = metaTets[ti];
    for (const [u, v] of [[a, b], [a, c], [a, d], [b, c], [b, d], [c, d]]) {
      addMetaEdge(u, v, 0.0040, tetEdgeConstraints);
    }
    if (softDiv === 1 || ti % 5 === 4) {
      world.volumeConstraints.push(new XPBD.TetVolumeConstraint(
        blobParticles[a], blobParticles[b], blobParticles[c], blobParticles[d], 0.0
      ));
    }
  }
  for (let u = 0; u < blobParticles.length; u++) {
    for (const m of allNeighbors[u]) {
      for (const v of allNeighbors[m]) {
        if (v > u) {
          const di = Math.abs(blobParticles[u]._tx - blobParticles[v]._tx);
          const dj = Math.abs(blobParticles[u]._ty - blobParticles[v]._ty);
          const dk = Math.abs(blobParticles[u]._tz - blobParticles[v]._tz);
          if (di + dj + dk === 2 && Math.max(di, dj, dk) === 2) {
            addMetaEdge(u, v, 0.0090, bendEdgeConstraints);
          }
        }
      }
    }
  }

  // Pin Head, Elbows, Hands, and Feet particles directly to their bone spheres (knees unpinned!)
  const pinBindPos = {};
  const pinInvMat = {};
  for (const [key, mesh] of Object.entries(pinAnchors)) {
    mesh.updateMatrixWorld(true);
    pinBindPos[key] = new V();
    mesh.getWorldPosition(pinBindPos[key]);
    pinInvMat[key] = new THREE.Matrix4().copy(mesh.matrixWorld).invert();
  }

  blobPinnedParticles = [];
  function attachParticleToAnchor(p, anchorKey) {
    const sphereMesh = pinAnchors[anchorKey];
    p.invM = 0;
    p._isPinned = true;
    p._pinSphereMesh = sphereMesh;
    p._pinLocalPos = p.x.clone().applyMatrix4(pinInvMat[anchorKey]);
    p._prevPinWorldPos = p.x.clone();
    p._targetPinWorldPos = p.x.clone();
    blobPinnedParticles.push(p);

    const pinDot = new THREE.Mesh(pinMarkerGeom, pinMarkerMat);
    pinDot.position.copy(p._pinLocalPos);
    pinDot.visible = false;
    sphereMesh.add(pinDot);
    pinDotMeshes.push(pinDot);
  }

  for (let i = 0; i < blobParticles.length; i++) {
    const p = blobParticles[i];
    p._isPinned = false;
    const px = p.x.x, py = p.x.y, pz = p.x.z;

    if (py >= 0.02 && Math.hypot(px - pinBindPos.head.x, py - 0.11, pz - pinBindPos.head.z) <= 0.175) {
      attachParticleToAnchor(p, 'head');
    } else if (px >= 0.60 && Math.hypot(px - pinBindPos.lHand.x, py - pinBindPos.lHand.y, pz - pinBindPos.lHand.z) <= 0.135) {
      attachParticleToAnchor(p, 'lHand');
    } else if (px <= -0.60 && Math.hypot(px - pinBindPos.rHand.x, py - pinBindPos.rHand.y, pz - pinBindPos.rHand.z) <= 0.135) {
      attachParticleToAnchor(p, 'rHand');
    } else if (px >= 0.36 && px <= 0.52 && Math.hypot(px - pinBindPos.lElbow.x, py - pinBindPos.lElbow.y, pz - pinBindPos.lElbow.z) <= 0.125) {
      attachParticleToAnchor(p, 'lElbow');
    } else if (px <= -0.36 && px >= -0.52 && Math.hypot(px - pinBindPos.rElbow.x, py - pinBindPos.rElbow.y, pz - pinBindPos.rElbow.z) <= 0.125) {
      attachParticleToAnchor(p, 'rElbow');
    } else if (px > 0.02 && py <= -1.30) {
      attachParticleToAnchor(p, 'lFoot');
    } else if (px < -0.02 && py <= -1.30) {
      attachParticleToAnchor(p, 'rFoot');
    }
  }

  // Build 1-level Loop-subdivided Meta-Mesh surface projected onto marshmallowSDF = 0
  numBaseVerts = blobParticles.length;
  const edgeMidMap = new Map();
  midEdges = [];

  function getOrCreateMidEdge(u, v, opp) {
    const key = u < v ? u + ',' + v : v + ',' + u;
    let eIdx = edgeMidMap.get(key);
    if (eIdx === undefined) {
      eIdx = midEdges.length;
      edgeMidMap.set(key, eIdx);
      midEdges.push({
        u: Math.min(u, v),
        v: Math.max(u, v),
        oppA: opp,
        oppB: opp,
        offsetN: 0
      });
    } else {
      midEdges[eIdx].oppB = opp;
    }
    return numBaseVerts + eIdx;
  }

  const subIndices = [];
  for (let t = 0; t < baseTris.length; t++) {
    const [a, b, c] = baseTris[t];
    const mab = getOrCreateMidEdge(a, b, c);
    const mbc = getOrCreateMidEdge(b, c, a);
    const mca = getOrCreateMidEdge(c, a, b);
    subIndices.push(
      a, mab, mca,
      b, mbc, mab,
      c, mca, mbc,
      mab, mbc, mca
    );
  }

  const maxCurvOff = 0.012 / softDiv;
  for (let e = 0; e < midEdges.length; e++) {
    const me = midEdges[e];
    const pu = blobParticles[me.u].x;
    const pv = blobParticles[me.v].x;
    const pa = blobParticles[me.oppA].x;
    const pb = blobParticles[me.oppB].x;

    const mx0 = 0.375 * (pu.x + pv.x) + 0.125 * (pa.x + pb.x);
    const my0 = 0.375 * (pu.y + pv.y) + 0.125 * (pa.y + pb.y);
    const mz0 = 0.375 * (pu.z + pv.z) + 0.125 * (pa.z + pb.z);

    let sx = mx0, sy = my0, sz = mz0;
    for (let s = 0; s < 3; s++) {
      const d = marshmallowSDF(sx, sy, sz);
      const [gx, gy, gz] = sdfGrad(sx, sy, sz);
      sx -= gx * d * 0.85;
      sy -= gy * d * 0.85;
      sz -= gz * d * 0.85;
    }
    const [gnx, gny, gnz] = sdfGrad(mx0, my0, mz0);
    const off = (sx - mx0) * gnx + (sy - my0) * gny + (sz - mz0) * gnz;
    me.offsetN = Math.max(-maxCurvOff, Math.min(maxCurvOff, off));
  }

  const totalRenderVerts = numBaseVerts + midEdges.length;
  if (blobGeom) blobGeom.dispose();
  blobGeom = new THREE.BufferGeometry();
  const blobPosArr = new Float32Array(totalRenderVerts * 3);
  blobGeom.setAttribute('position', new THREE.BufferAttribute(blobPosArr, 3));
  blobGeom.setIndex(subIndices);
  blobMesh.geometry = blobGeom;
  syncBlobMesh();

  /* ---- 2. Build Cyan Checker Cotton Shirt Mesh (1x or 2x Divisions) ---- */
  const S = clothDiv;
  const sNx = 30 * S + 1;
  const sNy = 31 * S + 1;
  currentShirtNx = sNx;
  const shirtHalfW = 0.455;
  const shirtTopY = 0.068, shirtBotY = -0.872;
  const sDx = (2 * shirtHalfW) / (sNx - 1);
  const sDy = (shirtTopY - shirtBotY) / (sNy - 1);
  const sleeveBotJ = 9 * S;

  function isCellInShirt(ci, cj) {
    const xMid = -shirtHalfW + (ci + 0.5) * sDx;
    const yMid = shirtTopY - (cj + 0.5) * sDy;
    if (cj < 3 * S && Math.abs(xMid) < 0.145) {
      const nr = Math.hypot(xMid / 0.155, (yMid - shirtTopY) / 0.088);
      if (nr < 1.0) return false;
    }
    if (cj >= sleeveBotJ && (ci < 5 * S || ci >= sNx - 1 - 5 * S)) return false;
    return true;
  }

  function isShirtNodeUsed(i, j) {
    for (let dj = -1; dj <= 0; dj++) {
      for (let di = -1; di <= 0; di++) {
        const ci = i + di, cj = j + dj;
        if (ci >= 0 && ci < sNx - 1 && cj >= 0 && cj < sNy - 1) {
          if (isCellInShirt(ci, cj)) return true;
        }
      }
    }
    return false;
  }

  function isSharedSeamNode(i, j) {
    const c00 = (i > 0 && j > 0) ? isCellInShirt(i - 1, j - 1) : false;
    const c10 = (i < sNx - 1 && j > 0) ? isCellInShirt(i, j - 1) : false;
    const c01 = (i > 0 && j < sNy - 1) ? isCellInShirt(i - 1, j) : false;
    const c11 = (i < sNx - 1 && j < sNy - 1) ? isCellInShirt(i, j) : false;
    if (c00 && c10 && c01 && c11) return false; // interior node -> separate Front & Back panels
    if (i === 0 && j > 0 && j < sleeveBotJ) return false; // open right cuff
    if (i === sNx - 1 && j > 0 && j < sleeveBotJ) return false; // open left cuff
    if (j === sNy - 1 && i > 5 * S && i < sNx - 1 - 5 * S) return false; // open bottom waist hem
    if (j <= 3 * S && i >= 10 * S && i <= 20 * S) {
      if (j === 0 && (i === 10 * S || i === 20 * S)) return true; // shoulder-collar seam corners
      return false; // open neck collar hole
    }
    return true;
  }

  const shirtFrontIdx = Array.from({ length: sNy }, () => new Int32Array(sNx).fill(-1));
  const shirtBackIdx  = Array.from({ length: sNy }, () => new Int32Array(sNx).fill(-1));
  shirtParticles = [];
  const shirtUVs = [];
  const shirtParticleMass = 1.4 / (1400 * S * S);
  const shirtRadius = 0.014 / Math.sqrt(S);

  function createShirtParticle(x, y, z, side, i, j) {
    const idx = shirtParticles.length;
    const p = world.addParticle(x, y, z, shirtParticleMass, shirtRadius, 0.32);
    p._isShirt = true;
    p._side = side;
    p._si = i;
    p._sj = j;
    shirtParticles.push(p);
    shirtUVs.push(i / (sNx - 1), 1 - j / (sNy - 1));
    return idx;
  }

  for (let j = 0; j < sNy; j++) {
    for (let i = 0; i < sNx; i++) {
      if (!isShirtNodeUsed(i, j)) continue;
      const x0 = -shirtHalfW + i * sDx;
      const y0 = shirtTopY - j * sDy;
      const uTorso = Math.max(-1, Math.min(1, x0 / 0.310));
      const uTop = Math.max(0, Math.min(1, (y0 - (-0.12)) / (shirtTopY - (-0.12))));
      const topArch = Math.sqrt(Math.max(0.10, 1 - 0.90 * uTop * uTop));
      const zTorso = 0.225 * Math.sqrt(Math.max(0.14, 1 - uTorso * uTorso)) * topArch;
      const uArm = Math.max(-1, Math.min(1, (y0 - (-0.065)) / 0.145));
      const zArm = 0.145 * Math.sqrt(Math.max(0.10, 1 - uArm * uArm));
      const tArm = Math.max(0, Math.min(1, (Math.abs(x0) - 0.16) / 0.14));
      const armBlend = (j <= sleeveBotJ) ? (tArm * tArm * (3 - 2 * tArm)) : 0;
      const zOff = zTorso * (1 - armBlend) + zArm * armBlend;
      if (isSharedSeamNode(i, j)) {
        const id = createShirtParticle(x0, y0, -1.2, 0, i, j);
        shirtFrontIdx[j][i] = id;
        shirtBackIdx[j][i] = id;
      } else {
        shirtFrontIdx[j][i] = createShirtParticle(x0, y0, -1.2 + zOff, 1, i, j);
        shirtBackIdx[j][i]  = createShirtParticle(x0, y0, -1.2 - zOff, -1, i, j);
      }
    }
  }

  const shirtNbrs = shirtParticles.map(() => new Set());
  function linkShirtNbr(a, b) {
    if (a >= 0 && b >= 0 && a !== b) {
      shirtNbrs[a].add(b);
      shirtNbrs[b].add(a);
    }
  }

  const shirtIndices = [];
  for (let j = 0; j < sNy - 1; j++) {
    for (let i = 0; i < sNx - 1; i++) {
      if (!isCellInShirt(i, j)) continue;
      const fa = shirtFrontIdx[j][i], fb = shirtFrontIdx[j][i + 1],
            fc = shirtFrontIdx[j + 1][i], fd = shirtFrontIdx[j + 1][i + 1];
      shirtIndices.push(fa, fc, fb, fb, fc, fd);
      linkShirtNbr(fa, fb); linkShirtNbr(fc, fd); linkShirtNbr(fa, fc); linkShirtNbr(fb, fd);

      const ba = shirtBackIdx[j][i], bb = shirtBackIdx[j][i + 1],
            bc = shirtBackIdx[j + 1][i], bd = shirtBackIdx[j + 1][i + 1];
      shirtIndices.push(ba, bb, bc, bb, bd, bc);
      linkShirtNbr(ba, bb); linkShirtNbr(bc, bd); linkShirtNbr(ba, bc); linkShirtNbr(bb, bd);
    }
  }

  // Mold the 3D T-Shirt in Bind Pose using a neck-cleared body SDF (excluding the bulbous head sphere above the collar)
  // and pattern-length-preserving edge relaxation so inner-shoulder triangles never collapse or pile up!
  function shirtMoldSDF(x, y, z) {
    const ax = Math.abs(x), zc = z + 1.2;
    let dT = sdSphere(ax, y, zc, 0.0, -0.02, 0.0, 0.095);
    dT = smin(dT, sdCapsule(ax, y, zc, 0.0, -0.14, 0.0, 0.10, -0.13, 0.0, 0.156), 0.024);
    dT = smin(dT, sdCapsule(ax, y, zc, 0.0, -0.32, 0.015, 0.085, -0.32, 0.01, 0.178), 0.024);
    dT = smin(dT, sdCapsule(ax, y, zc, 0.0, -0.50, 0.0, 0.095, -0.52, 0.0, 0.154), 0.024);
    dT = smin(dT, sdCapsule(ax, y, zc, 0.0, -0.68, -0.01, 0.085, -0.69, -0.01, 0.142), 0.020);
    let dA = sdSphere(ax, y, zc, 0.23, -0.065, 0.0, 0.106);
    dA = smin(dA, sdSphere(ax, y, zc, 0.38, -0.065, 0.0, 0.100), 0.020);
    dA = smin(dA, sdSphere(ax, y, zc, 0.53, -0.065, 0.0, 0.095), 0.020);
    let dL = sdSphere(ax, y, zc, 0.105, -0.85, 0.0, 0.118);
    return smin(smin(dT, dA, 0.032), dL, 0.025);
  }
  const shirtTargetOffset = 0.038;
  const moldIters = 14 * S;
  for (let iter = 0; iter < moldIters; iter++) {
    // 1. Pattern-distance-preserving edge relaxation (prevents open collar boundaries from shrinking onto shoulder seams)
    for (let v = 0; v < shirtParticles.length; v++) {
      const p = shirtParticles[v];
      const nSet = shirtNbrs[v];
      for (const nb of nSet) {
        if (nb <= v) continue;
        const q = shirtParticles[nb];
        const rest2D = Math.hypot((p._si - q._si) * sDx, (p._sj - q._sj) * sDy);
        const dx = q.x.x - p.x.x, dy = q.x.y - p.x.y, dz = q.x.z - p.x.z;
        const dist = Math.hypot(dx, dy, dz);
        if (dist > 1e-6) {
          const corr = (dist - rest2D) * 0.22 / dist;
          p.x.x += dx * corr; p.x.y += dy * corr; p.x.z += dz * corr;
          q.x.x -= dx * corr; q.x.y -= dy * corr; q.x.z -= dz * corr;
        }
      }
    }
    // 2. Gentle interior-only Laplacian fairing + SDF surface projection
    for (let v = 0; v < shirtParticles.length; v++) {
      const p = shirtParticles[v];
      const nSet = shirtNbrs[v];
      const isCollarEdge = (p._sj <= 3 * S && p._si >= 9 * S && p._si <= 21 * S);
      if (nSet.size >= 4 && !isCollarEdge) {
        let sx = 0, sy = 0, sz = 0;
        for (const nb of nSet) {
          sx += shirtParticles[nb].x.x;
          sy += shirtParticles[nb].x.y;
          sz += shirtParticles[nb].x.z;
        }
        const inv = 1 / nSet.size;
        p.x.x = p.x.x * 0.88 + sx * inv * 0.12;
        p.x.y = p.x.y * 0.88 + sy * inv * 0.12;
        p.x.z = p.x.z * 0.85 + sz * inv * 0.15;
      }
      if (p._side === 0) p.x.z = -1.2;
      const d = shirtMoldSDF(p.x.x, p.x.y, p.x.z) - shirtTargetOffset;
      if (d < 0) {
        const e = 0.002;
        let gx = shirtMoldSDF(p.x.x + e, p.x.y, p.x.z) - shirtMoldSDF(p.x.x - e, p.x.y, p.x.z);
        let gy = shirtMoldSDF(p.x.x, p.x.y + e, p.x.z) - shirtMoldSDF(p.x.x, p.x.y - e, p.x.z);
        let gz = shirtMoldSDF(p.x.x, p.x.y, p.x.z + e) - shirtMoldSDF(p.x.x, p.x.y, p.x.z - e);
        const gl = Math.hypot(gx, gy, gz) || 1;
        gx /= gl; gy /= gl; gz /= gl;
        const step = -d * 0.88;
        if (!isCollarEdge) p.x.x += gx * step;
        p.x.y += gy * step;
        if (p._side !== 0) p.x.z += gz * step;
      }
      p.px.copy(p.x);
    }
  }

  const shirtEdgeSet = new Set();
  shirtStructConstraints = [];
  shirtShearConstraints  = [];
  shirtBendConstraints   = [];

  function addShirtEdge(u, v, compliance, bucket, enabled = true, isCollarLock = false, tensionOnly = false) {
    if (u < 0 || v < 0 || u === v) return;
    const key = u < v ? u + ',' + v : v + ',' + u;
    if (!shirtEdgeSet.has(key)) {
      shirtEdgeSet.add(key);
      const pU = shirtParticles[u], pV = shirtParticles[v];
      const patternDist = Math.hypot((pU._si - pV._si) * sDx, (pU._sj - pV._sj) * sDy);
      const restLen = Math.max(pU.x.distanceTo(pV.x), patternDist * 0.80);
      const c = world.addDistanceConstraint(pU, pV, compliance, restLen);
      c.enabled = enabled;
      c._isCollarLock = isCollarLock;
      c.tensionOnly = tensionOnly;
      if (!tensionOnly && bucket === shirtStructConstraints) {
        c.compressCompliance = 0.004;
      }
      if (bucket) bucket.push(c);
    }
  }

  const COTTON_STRUCT_COMPLIANCE = 0.000004;
  const COTTON_SHEAR_COMPLIANCE  = 0.02;

  for (let j = 0; j < sNy - 1; j++) {
    for (let i = 0; i < sNx - 1; i++) {
      if (!isCellInShirt(i, j)) continue;
      const isCollar = (j <= 2 * S && i >= 8 * S && i <= 22 * S);
      const structComp = isCollar ? 0.0 : COTTON_STRUCT_COMPLIANCE;
      for (const grid of [shirtFrontIdx, shirtBackIdx]) {
        const a = grid[j][i], b = grid[j][i + 1], c = grid[j + 1][i], d = grid[j + 1][i + 1];
        addShirtEdge(a, b, structComp, shirtStructConstraints, true, isCollar);
        addShirtEdge(c, d, structComp, shirtStructConstraints, true, isCollar);
        addShirtEdge(a, c, structComp, shirtStructConstraints, true, isCollar);
        addShirtEdge(b, d, structComp, shirtStructConstraints, true, isCollar);
        addShirtEdge(a, d, COTTON_SHEAR_COMPLIANCE, shirtShearConstraints, true, false);
        addShirtEdge(b, c, COTTON_SHEAR_COMPLIANCE, shirtShearConstraints, true, false);
      }
    }
  }

  for (const grid of [shirtFrontIdx, shirtBackIdx]) {
    for (let j = 0; j < sNy; j++) {
      for (let i = 0; i < sNx; i++) {
        const a = grid[j][i];
        if (a < 0) continue;
        // When cloth is subdivided 2x, embed the 1x coarse structural grid on even nodes (tension-only)
        // so 2x cloth has the exact same membrane tensile resistance as 1x cloth without compression buckling
        if (S > 1 && (i % 2 === 0) && (j % 2 === 0)) {
          const isCollar = (j <= 2 * S && i >= 8 * S && i <= 22 * S);
          const structComp = isCollar ? 0.0 : COTTON_STRUCT_COMPLIANCE;
          if (i + 2 < sNx && grid[j][i + 1] >= 0 && grid[j][i + 2] >= 0) {
            addShirtEdge(a, grid[j][i + 2], structComp, shirtStructConstraints, true, isCollar, true);
          }
          if (j + 2 < sNy && grid[j + 1][i] >= 0 && grid[j + 2][i] >= 0) {
            addShirtEdge(a, grid[j + 2][i], structComp, shirtStructConstraints, true, isCollar, true);
          }
        }
        if (i + 2 < sNx && grid[j][i + 1] >= 0 && grid[j][i + 2] >= 0) {
          addShirtEdge(a, grid[j][i + 2], 0.01, shirtBendConstraints, false, false);
        }
        if (j + 2 < sNy && grid[j + 1][i] >= 0 && grid[j + 2][i] >= 0) {
          addShirtEdge(a, grid[j + 2][i], 0.01, shirtBendConstraints, false, false);
        }
      }
    }
  }

  // Collar rib-knit structural chords (strictly cloth-to-cloth, tension-only, zero pinning to the body!)
  const cLeft = shirtFrontIdx[0][10 * S];
  const cRight = shirtFrontIdx[0][20 * S];
  addShirtEdge(cLeft, cRight, 0.0, shirtStructConstraints, true, true, true);
  for (const grid of [shirtFrontIdx, shirtBackIdx]) {
    const cMid = grid[3 * S][15 * S];
    addShirtEdge(cLeft, cMid, 0.0, shirtStructConstraints, true, true, true);
    addShirtEdge(cRight, cMid, 0.0, shirtStructConstraints, true, true, true);
  }

  // Collect boundary and interior Marshmallow Man meta-mesh particles for live one-way collision
  // Cloth collides ONLY with the Marshmallow Man meta-mesh (zero bone collision and zero bone pins!)
  boundaryList.length = 0;
  interiorList.length = 0;
  for (let k = 0; k < numBaseVerts; k++) {
    const bp = blobParticles[k];
    bp._prevFrameX = bp.x.clone();
    bp._stepDelta = new V();
    if (bp._isBoundary) {
      boundaryList.push(bp);
    } else if (bp._bindPos.y > -0.95) {
      interiorList.push(bp);
    }
  }
  // Compute each interior meta-mesh particle's safe soft-body sphere radius strictly inside the meta-mesh skin
  for (let i = 0; i < interiorList.length; i++) {
    const ip = interiorList[i];
    let minD = 999;
    for (let k = 0; k < boundaryList.length; k++) {
      const d = ip._bindPos.distanceTo(boundaryList[k]._bindPos);
      if (d < minD) minD = d;
    }
    ip._innerR = Math.min(0.052, minD * 0.72);
  }

  for (let i = 0; i < shirtParticles.length; i++) {
    const p = shirtParticles[i];
    p._bindPos = p.x.clone();
    p._liveSkinNbrs = [];
    p._liveInnerNbrs = [];
  }

  if (shirtGeom) shirtGeom.dispose();
  shirtGeom = new THREE.BufferGeometry();
  const shirtPosArr = new Float32Array(shirtParticles.length * 3);
  shirtGeom.setAttribute('position', new THREE.BufferAttribute(shirtPosArr, 3));
  shirtGeom.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(shirtUVs), 2));
  shirtGeom.setIndex(shirtIndices);
  shirtMesh.geometry = shirtGeom;
  syncShirtMesh();

  shirtMesh.visible = shirtEnabled;
  draggableParticles = shirtEnabled ? shirtParticles.concat(blobParticles) : blobParticles;
}

buildCharacterMeshes(1, 1);

// One-Way Meta-Mesh-to-Shirt Collision Solver (100% Meta-Mesh Only — Zero Bone Collision, Zero Pins!):
// Runs in both onParticleSubstep (pre-constraint) and onPostParticleSubstep (post-constraint).
// Shirt particles collide one-way strictly against the Marshmallow Man meta-mesh (its interior volumetric
// soft-body particles and its outer boundary skin particles with live surface normals), while the meta-mesh NEVER reacts to the shirt!
const skinCenter = new V(), skinDiff = new V(), contactDelta = new V(), netPush = new V();
const segAB = new V(), segAP = new V(), closestPt = new V(), pushDir = new V();
// 10.5cm sphere radius inset by 8.6cm (+1.9cm skin offset) smoothly bridges the meta-mesh boundary vertices
const R_SKIN_SPHERE = 0.105;
const R_SKIN_INSET  = 0.086;
let shirtBodyFriction = 0.32;
let clothDampingVal   = 0.80;

// Live 3D Spatial Grid for Marshmallow Man Meta-Mesh (boundary skin particles + interior volumetric particles):
// Uses 3x3 cell neighborhood scatter with 0.16m cell width so 100% of meta-mesh particles within 15cm of any shirt vertex are found every frame without broadphase ping-pong!
const SKIN_GX = 20, SKIN_GY = 22;
const SKIN_CELL = 0.16;
const SKIN_MIN_X = -0.95, SKIN_MIN_Y = -1.45;
const skinGridBuckets  = Array.from({ length: SKIN_GX * SKIN_GY }, () => []);
const innerGridBuckets = Array.from({ length: SKIN_GX * SKIN_GY }, () => []);

function rebuildSkinGrid() {
  if (!shirtEnabled) return;
  for (let i = 0; i < skinGridBuckets.length; i++) skinGridBuckets[i].length = 0;
  for (let i = 0; i < innerGridBuckets.length; i++) innerGridBuckets[i].length = 0;

  for (let k = 0; k < boundaryList.length; k++) {
    const bp = boundaryList[k];
    if (bp.x.y < -0.95) continue;
    const cx = Math.floor((bp.x.x - SKIN_MIN_X) / SKIN_CELL);
    const cy = Math.floor((bp.x.y - SKIN_MIN_Y) / SKIN_CELL);
    const x0 = Math.max(0, cx - 1), x1 = Math.min(SKIN_GX - 1, cx + 1);
    const y0 = Math.max(0, cy - 1), y1 = Math.min(SKIN_GY - 1, cy + 1);
    for (let jy = y0; jy <= y1; jy++) {
      for (let jx = x0; jx <= x1; jx++) {
        skinGridBuckets[jy * SKIN_GX + jx].push(bp);
      }
    }
  }

  for (let k = 0; k < interiorList.length; k++) {
    const ip = interiorList[k];
    const cx = Math.floor((ip.x.x - SKIN_MIN_X) / SKIN_CELL);
    const cy = Math.floor((ip.x.y - SKIN_MIN_Y) / SKIN_CELL);
    const x0 = Math.max(0, cx - 1), x1 = Math.min(SKIN_GX - 1, cx + 1);
    const y0 = Math.max(0, cy - 1), y1 = Math.min(SKIN_GY - 1, cy + 1);
    for (let jy = y0; jy <= y1; jy++) {
      for (let jx = x0; jx <= x1; jx++) {
        innerGridBuckets[jy * SKIN_GX + jx].push(ip);
      }
    }
  }

  for (let i = 0; i < shirtParticles.length; i++) {
    const p = shirtParticles[i];
    const px = p.x.x, py = p.x.y, pz = p.x.z;
    const liveNbrs = p._liveSkinNbrs;
    const liveInner = p._liveInnerNbrs;
    liveNbrs.length = 0;
    liveInner.length = 0;

    const ix = Math.floor((px - SKIN_MIN_X) / SKIN_CELL);
    const iy = Math.floor((py - SKIN_MIN_Y) / SKIN_CELL);
    if (ix >= 0 && ix < SKIN_GX && iy >= 0 && iy < SKIN_GY) {
      const cell = skinGridBuckets[iy * SKIN_GX + ix];
      for (let k = 0; k < cell.length; k++) {
        const bp = cell[k];
        const dx = px - bp.x.x, dy = py - bp.x.y, dz = pz - bp.x.z;
        if (dx * dx + dy * dy + dz * dz < 0.0225) {
          liveNbrs.push(bp);
        }
      }
      const iCell = innerGridBuckets[iy * SKIN_GX + ix];
      for (let k = 0; k < iCell.length; k++) {
        const ip = iCell[k];
        const rCheck = ip._innerR + 0.085;
        const dx = px - ip.x.x, dy = py - ip.x.y, dz = pz - ip.x.z;
        if (dx * dx + dy * dy + dz * dz < rCheck * rCheck) {
          liveInner.push(ip);
        }
      }
    }
  }
}

function solveShirtBodyCollision(h, applyFrictionCarry) {
  if (!shirtEnabled) return;
  const dragK = Math.max(0, Math.min(1, clothDampingVal * h * 0.5));
  const contactFric = Math.min(0.36, shirtBodyFriction * 0.32);
  const fricCarry = applyFrictionCarry ? Math.min(0.82, shirtBodyFriction * 1.85) : 0;

  for (let i = 0; i < shirtParticles.length; i++) {
    const p = shirtParticles[i];
    let hadSkinContact = false;
    contactDelta.set(0, 0, 0);
    let contactCount = 0;

    // Order-independent weighted normal accumulation across all contacting interior & boundary skin spheres
    netPush.set(0, 0, 0);
    let weightSum = 0;
    let maxPen = 0;

    // 1. Collide one-way against interior Marshmallow Man meta-mesh particles (solid soft-body volume, zero bone collision)
    const innerNbrs = p._liveInnerNbrs;
    for (let k = 0; k < innerNbrs.length; k++) {
      const ip = innerNbrs[k];
      const minR = ip._innerR;
      skinDiff.subVectors(p.x, ip.x);
      const d2 = skinDiff.lengthSq();
      if (d2 < minR * minR && d2 > 1e-12) {
        const d = Math.sqrt(d2);
        const pen = minR - d;
        const w = pen * pen + 1e-4;
        skinDiff.divideScalar(d);
        netPush.addScaledVector(skinDiff, pen * w);
        weightSum += w;
        if (pen > maxPen) maxPen = pen;
        if (ip._stepDelta) {
          contactDelta.add(ip._stepDelta);
          contactCount++;
        }
        hadSkinContact = true;
      }
    }

    // 2. Collide one-way against live deforming Marshmallow Man boundary meta-mesh skin particles (Normal-Inset Spheres)
    const skinNbrs = p._liveSkinNbrs;
    for (let k = 0; k < skinNbrs.length; k++) {
      const bp = skinNbrs[k];
      const nrm = bp._skinNormal;
      skinCenter.copy(bp.x).addScaledVector(nrm, -R_SKIN_INSET);
      skinDiff.subVectors(p.x, skinCenter);
      if (skinDiff.dot(nrm) <= 0) continue;
      const d2 = skinDiff.lengthSq();
      if (d2 < R_SKIN_SPHERE * R_SKIN_SPHERE && d2 > 1e-12) {
        const d = Math.sqrt(d2);
        const pen = R_SKIN_SPHERE - d;
        const w = pen * pen + 1e-4;
        skinDiff.divideScalar(d); // outward unit normal n
        netPush.addScaledVector(skinDiff, pen * w);
        weightSum += w;
        if (pen > maxPen) maxPen = pen;
        if (bp._stepDelta) {
          contactDelta.add(bp._stepDelta);
          contactCount++;
        }
        hadSkinContact = true;
      }
    }

    if (hadSkinContact && weightSum > 0) {
      netPush.divideScalar(weightSum);
      const pushLen = netPush.length();
      if (pushLen > 1e-9) {
        const targetMag = Math.min(maxPen, pushLen * 1.15);
        netPush.multiplyScalar(targetMag / pushLen);
        p.x.add(netPush);

        if (applyFrictionCarry) {
          // Pre-constraint pass: project velocity onto smooth skin tangent plane
          skinDiff.copy(netPush).divideScalar(targetMag);
          const vn = (p.x.x - p.px.x) * skinDiff.x + (p.x.y - p.px.y) * skinDiff.y + (p.x.z - p.px.z) * skinDiff.z;
          p.px.addScaledVector(skinDiff, vn);
          // Dampen oscillation when pinched in a concave crease (e.g. armpit between opposing arm & torso normals)
          if (contactCount >= 3 && pushLen < maxPen * 0.75) {
            p.px.lerp(p.x, 0.50);
          }
        } else {
          // Post-constraint pass: velocity-neutral projection so curved-surface chord pull-in never injects bounce velocity
          p.px.add(netPush);
          skinDiff.copy(netPush).divideScalar(targetMag);
          const vn = (p.x.x - p.px.x) * skinDiff.x + (p.x.y - p.px.y) * skinDiff.y + (p.x.z - p.px.z) * skinDiff.z;
          if (vn < 0) p.px.addScaledVector(skinDiff, vn);
        }
      }
    }

    // 3. Physical contact friction: carry contacting cloth with the moving meta-mesh skin surface (no pins!)
    if (hadSkinContact && contactCount > 0 && fricCarry > 0) {
      const s = fricCarry / contactCount;
      p.x.addScaledVector(contactDelta, s);
      p.px.addScaledVector(contactDelta, s);
    }

    // 4. Apply cloth contact friction & air damping
    const dampFactor = hadSkinContact ? Math.max(dragK, contactFric) : dragK;
    if (dampFactor > 0) {
      p.px.lerp(p.x, dampFactor);
    }
  }
}

// Update pinned Marshmallow Man particles (Head, Elbows, Hands, Knees, Feet) to follow their bone spheres,
// and transfer moving skeleton momentum into the unpinned soft-body tissue inside each substep
const cachedSegA = boneSegments.map(() => new V());
const cachedSegB = boneSegments.map(() => new V());
const prevSegMid = boneSegments.map(() => new V());
const deltaSegSubstep = boneSegments.map(() => new V());
let hasPrevSegs = false;

function updateSkeletonBlobInteraction() {
  characterRoot.updateMatrixWorld(true);
  const invSub = 1 / world.substeps;

  // 1. Compute target world positions for all pinned Marshmallow Man particles
  for (let i = 0; i < blobPinnedParticles.length; i++) {
    const p = blobPinnedParticles[i];
    if (hasPrevSegs) {
      p._prevPinWorldPos.copy(p.x);
    }
    p._targetPinWorldPos.copy(p._pinLocalPos).applyMatrix4(p._pinSphereMesh.matrixWorld);
    if (!hasPrevSegs) {
      p._prevPinWorldPos.copy(p._targetPinWorldPos);
      p.x.copy(p._targetPinWorldPos);
      p.px.copy(p._targetPinWorldPos);
    }
  }

  // 2. Compute per-substep displacement for Marshmallow Man meta-mesh particles
  for (let i = 0; i < numBaseVerts; i++) {
    const bp = blobParticles[i];
    if (!bp._prevFrameX) continue;
    if (hasPrevSegs) {
      bp._stepDelta.subVectors(bp.x, bp._prevFrameX).multiplyScalar(invSub);
    } else {
      bp._stepDelta.set(0, 0, 0);
      bp._prevFrameX.copy(bp.x);
    }
  }

  // 3. Rebuild live 3D spatial grid of Marshmallow Man meta-mesh particles for each shirt vertex
  rebuildSkinGrid();

  // 4. Compute world endpoints and per-substep motion delta of skeleton bone segments (for Marshmallow Man softbody only)
  for (let s = 0; s < boneSegments.length; s++) {
    boneSegments[s].boneA.getWorldPosition(cachedSegA[s]);
    boneSegments[s].boneB.getWorldPosition(cachedSegB[s]);
    closestPt.addVectors(cachedSegA[s], cachedSegB[s]).multiplyScalar(0.5);
    if (hasPrevSegs) {
      deltaSegSubstep[s].subVectors(closestPt, prevSegMid[s]).multiplyScalar(invSub);
    } else {
      deltaSegSubstep[s].set(0, 0, 0);
    }
    prevSegMid[s].copy(closestPt);
  }
  hasPrevSegs = true;
}

world.onParticleSubstep = function(wWorld, h, substepIdx) {
  // 1. Smoothly advance pinned Head, Elbow, Hand, Knee, and Foot particles across substeps
  const alpha = (substepIdx + 1) / world.substeps;
  for (let i = 0; i < blobPinnedParticles.length; i++) {
    const p = blobPinnedParticles[i];
    p.x.lerpVectors(p._prevPinWorldPos, p._targetPinWorldPos, alpha);
    p.px.copy(p.x);
    p.v.set(0, 0, 0);
  }

  if (substepIdx === world.substeps - 1) {
    for (let i = 0; i < numBaseVerts; i++) {
      const bp = blobParticles[i];
      if (bp._prevFrameX) bp._prevFrameX.copy(bp.x);
    }
  }

  // 2. Transfer moving skeleton limb/torso momentum into unpinned Marshmallow Man soft-body particles
  for (let i = 0; i < numBaseVerts; i++) {
    const p = blobParticles[i];
    if (p.invM === 0) continue;

    for (let s = 0; s < boneSegments.length; s++) {
      const seg = boneSegments[s];
      const delta = deltaSegSubstep[s];
      const isMoving = delta.lengthSq() > 1e-10;
      if (!isMoving && !seg.isCore) continue;

      const a = cachedSegA[s];
      const b = cachedSegB[s];
      const rCap = seg.radius;
      const influenceR = rCap * 2.4;

      segAB.subVectors(b, a);
      segAP.subVectors(p.x, a);
      const abLenSq = segAB.lengthSq();
      let t = abLenSq > 1e-8 ? segAP.dot(segAB) / abLenSq : 0;
      if (t < 0) t = 0;
      else if (t > 1) t = 1;

      closestPt.copy(a).addScaledVector(segAB, t);
      pushDir.subVectors(p.x, closestPt);
      const d2 = pushDir.lengthSq();

      if (d2 < influenceR * influenceR) {
        const d = Math.sqrt(d2);
        const w = 1 - d / influenceR;
        if (isMoving) {
          const kMove = 0.42 * w * w;
          p.x.addScaledVector(delta, kMove);
          p.px.addScaledVector(delta, kMove * 0.65);
        }
        if (seg.isCore && p._isBoundary && d < rCap + p.radius && d > 1e-9) {
          const push = Math.min(0.0025, ((rCap + p.radius) - d) * 0.25);
          const sPush = push / d;
          p.x.addScaledVector(pushDir, sPush);
          p.px.addScaledVector(pushDir, sPush * 0.70);
        }
      }
    }
  }

  // 3. Pre-constraint one-way body->shirt collision + contact friction (supports unpinned shirt on shoulders before cloth constraints run)
  solveShirtBodyCollision(h, true);

  // 3b. When Cloth is subdivided 2x (60x62 grid), run 2 stretch-only structural sweeps with damped px so 2x cloth has zero extra gravity sag and zero buckling flutter
  if (shirtEnabled && currentClothDiv > 1) {
    for (let it = 0; it < 2; it++) {
      for (let i = 0; i < shirtStructConstraints.length; i++) {
        const c = shirtStructConstraints[i];
        const p1 = c.p1, p2 = c.p2;
        const dx = p1.x.x - p2.x.x;
        const dy = p1.x.y - p2.x.y;
        const dz = p1.x.z - p2.x.z;
        const len = Math.hypot(dx, dy, dz);
        if (len <= c.restLength || len < 1e-9) continue;
        const corr = ((c.restLength - len) / len) * 0.35;
        const pxCorr = corr * 0.70;
        p1.x.x += dx * corr; p1.x.y += dy * corr; p1.x.z += dz * corr;
        p2.x.x -= dx * corr; p2.x.y -= dy * corr; p2.x.z -= dz * corr;
        p1.px.x += dx * pxCorr; p1.px.y += dy * pxCorr; p1.px.z += dz * pxCorr;
        p2.px.x -= dx * pxCorr; p2.px.y -= dy * pxCorr; p2.px.z -= dz * pxCorr;
      }
    }
  }
};

// 4. Post-constraint one-way collision: project Cotton Shirt outside the solved Marshmallow Man surface before velocity derivation
world.onPostParticleSubstep = function(wWorld, h) {
  solveShirtBodyCollision(h, false);
};

function transitionToWalk(index, blendDuration = 0.75) {
  bindPoseCountdown = 0;
  activeWalkIndex = index;
  const nextAction = walkActions[index];
  if (currentAction !== nextAction) {
    nextAction.reset();
    nextAction.setEffectiveTimeScale(1.0);
    nextAction.setEffectiveWeight(1.0);
    nextAction.play();
    currentAction.crossFadeTo(nextAction, blendDuration, false);
    currentAction = nextAction;
  }
  stateLabel.textContent = MOCAP_PROFILES[index].name;
  updateButtonHighlights(false);
}

function startBindPoseSequence() {
  bindPoseCountdown = 1.0;
  mixer.stopAllAction();

  // Apply queued 2x mesh redivision when user clicks Bind Pose button
  const redivided = (pendingSoftDiv !== currentSoftDiv || pendingClothDiv !== currentClothDiv);
  if (redivided) {
    buildCharacterMeshes(pendingSoftDiv, pendingClothDiv);
    if (typeof applySoftBodySliders === 'function') applySoftBodySliders();
    if (typeof applyClothSliders === 'function') applyClothSliders();
    updateSubdivButtonsUI();
  }

  rootBone.position.copy(HIP_BIND_POS);
  for (let i = 0; i < boneList.length; i++) {
    boneList[i].quaternion.identity();
  }
  characterRoot.updateMatrixWorld(true);
  hasPrevSegs = false;
  for (let i = 0; i < blobParticles.length; i++) {
    const p = blobParticles[i];
    p.x.copy(p._bindPos);
    p.px.copy(p._bindPos);
    p.v.set(0, 0, 0);
    if (p._prevPinWorldPos) {
      p._prevPinWorldPos.copy(p._bindPos);
      p._targetPinWorldPos.copy(p._bindPos);
    }
    if (p._prevFrameX) {
      p._prevFrameX.copy(p._bindPos);
      p._stepDelta.set(0, 0, 0);
    }
  }
  for (let i = 0; i < shirtParticles.length; i++) {
    const sp = shirtParticles[i];
    sp.x.copy(sp._bindPos);
    sp.px.copy(sp._bindPos);
    sp.v.set(0, 0, 0);
  }
  syncBlobMesh();
  syncShirtMesh();

  bindPoseAction.reset();
  bindPoseAction.setEffectiveWeight(1.0);
  bindPoseAction.play();
  currentAction = bindPoseAction;

  stateLabel.textContent = 'Bind Pose (T-Pose) — Blending in 1.0s...';
  updateButtonHighlights(true);
  if (redivided) {
    RoomEnv.showNote(`Applied mesh divisions (Softbody ${currentSoftDiv}×, Cloth ${currentClothDiv}×) in Bind Pose — blending in 1.0s...`, 2600);
  } else {
    RoomEnv.showNote('Bind Pose (T-Pose). Cotton Shirt over Marshmallow Man (one-way meta-mesh collision) — blending in 1.0s...', 2400);
  }
}

function applySoftBodySliders() {
  const softnessPct  = parseFloat(sliderSoftness.value);
  const bendingPct   = parseFloat(sliderBending.value);
  const volumePct    = parseFloat(sliderVolume.value);
  const dampingVal   = parseFloat(sliderDamping.value);
  const gravityVal   = parseFloat(sliderGravity.value);
  const massScale    = parseFloat(sliderMass.value);
  const walkSpeedPct = parseFloat(sliderWalkSpeed.value);
  walkSpeedScale     = walkSpeedPct / 100;

  valSoftness.textContent  = Math.round(softnessPct) + '%';
  valBending.textContent   = Math.round(bendingPct) + '%';
  valVolume.textContent    = Math.round(volumePct) + '%';
  valDamping.textContent   = dampingVal.toFixed(2);
  valGravity.textContent   = gravityVal.toFixed(1);
  valMass.textContent      = massScale.toFixed(1) + 'x';
  valWalkSpeed.textContent = Math.round(walkSpeedPct) + '%';

  // 1. 1-hop tetrahedral edge compliance (40% -> 0.0040)
  const edgeCompliance = (softnessPct <= 0
    ? 0.00005
    : 0.025 * Math.pow(softnessPct / 100, 2.0)) / currentSoftDiv;
  for (let i = 0; i < tetEdgeConstraints.length; i++) {
    tetEdgeConstraints[i].compliance = edgeCompliance;
  }

  // 2. 2-hop axial structural bending compliance (55% -> ~0.0090; higher % = firmer shape)
  const bendCompliance = (0.0002 + 0.0398 * Math.pow(1 - bendingPct / 100, 1.89)) / currentSoftDiv;
  for (let i = 0; i < bendEdgeConstraints.length; i++) {
    bendEdgeConstraints[i].compliance = bendCompliance;
  }

  // 3. Tetrahedral volume preservation compliance (100% -> 0.0 incompressible)
  const volCompliance = 0.030 * Math.pow(1 - volumePct / 100, 2.0);
  for (let i = 0; i < world.volumeConstraints.length; i++) {
    world.volumeConstraints[i].compliance = volCompliance;
  }

  // 4. Linear damping & gravity
  world.linearDamping = dampingVal;
  world.accel.set(0, -gravityVal, 0);

  // 5. Unpinned Marshmallow Man particle mass scaling (total softbody mass preserved across 1x/2x divisions)
  const baseParticleMass = 0.048 * (1130 / Math.max(1, blobParticles.length));
  const invParticleMass = 1 / (baseParticleMass * massScale);
  for (let i = 0; i < blobParticles.length; i++) {
    const p = blobParticles[i];
    if (!p._isPinned) {
      p.invM = invParticleMass;
    }
  }
}

function applyClothSliders() {
  const stretchPct  = parseFloat(sliderClothStretch.value);
  const shearPct    = parseFloat(sliderClothShear.value);
  const bendPct     = parseFloat(sliderClothBend.value);
  const frictionPct = parseFloat(sliderClothFriction.value);
  const dampingVal  = parseFloat(sliderClothDamping.value);
  const massVal     = parseFloat(sliderClothMass.value);

  valClothStretch.textContent  = Math.round(stretchPct) + '%';
  valClothShear.textContent    = Math.round(shearPct) + '%';
  valClothBend.textContent     = Math.round(bendPct) + '%';
  valClothFriction.textContent = Math.round(frictionPct) + '%';
  valClothDamping.textContent  = dampingVal.toFixed(2);
  valClothMass.textContent     = massVal.toFixed(1) + 'kg';

  // 1. Structural warp & weft stretch compliance (10% -> 0.000004 Cotton preset)
  const stretchComp = stretchPct <= 0 ? 0 : (0.004 * Math.pow(stretchPct / 100, 3)) / (currentClothDiv * currentClothDiv);
  for (let i = 0; i < shirtStructConstraints.length; i++) {
    const c = shirtStructConstraints[i];
    c.compliance = c._isCollarLock ? 0.0 : stretchComp;
  }

  // 2. Diagonal weave shear compliance (20% -> 0.02 Cotton preset)
  const shearComp = ((shearPct / 100) * 0.10) / currentClothDiv;
  for (let i = 0; i < shirtShearConstraints.length; i++) {
    shirtShearConstraints[i].compliance = shearComp;
  }

  // 3. 2-hop bending stiffness (0% -> disabled; >0% -> enabled with compliance, default 2%)
  const bendEnabled = bendPct > 0;
  const bendComp = bendEnabled ? (0.02 * Math.pow(1 - bendPct / 100, 3) + 0.00002) : 0.01;
  for (let i = 0; i < shirtBendConstraints.length; i++) {
    const c = shirtBendConstraints[i];
    c.enabled = bendEnabled;
    c.compliance = bendComp;
  }

  // 4. Shirt-on-body contact friction & cloth air damping
  shirtBodyFriction = frictionPct / 100;
  clothDampingVal   = dampingVal;

  // 5. Shirt particle mass & friction (shared seam nodes _side === 0 carry both Front & Back panel constraints so they get 2x mass)
  const invShirtMass = 1 / Math.max(0.0001, massVal / shirtParticles.length);
  for (let i = 0; i < shirtParticles.length; i++) {
    const sp = shirtParticles[i];
    sp.friction = shirtBodyFriction;
    sp.invM = !shirtEnabled ? 0 : ((sp._side === 0) ? invShirtMass * 0.5 : invShirtMass);
  }
}

    if (bindPoseCountdown <= 0) {
      bindPoseCountdown = 0;
      transitionToWalk(activeWalkIndex, 0.85);
      RoomEnv.showNote('Blended into ' + MOCAP_PROFILES[activeWalkIndex].name, 2200);
    }
  }

  // 1. Advance skeleton animation mixer (scaled by Walk Speed slider during walk cycles)
  mixer.update(dt * (currentAction === bindPoseAction ? 1.0 : walkSpeedScale));

  // 1b. Apply Arm Lift abduction angle so swinging arms stay lifted clear of the puffy torso
  const walkWeight = 1.0 - (bindPoseAction ? bindPoseAction.getEffectiveWeight() : 0.0);
  if (armLiftRad > 0 && walkWeight > 1e-4) {
    const lift = armLiftRad * walkWeight;
    qArmLiftL.setFromAxisAngle(Z_AXIS, lift);
    qArmLiftR.setFromAxisAngle(Z_AXIS, -lift);
    bonesByName['LeftArm'].quaternion.multiply(qArmLiftL);
    bonesByName['RightArm'].quaternion.multiply(qArmLiftR);
  }
}

// Single canonical 60Hz simulation step shared by both Realtime and Playblast
// Ensures world.dt is always 1/60s (preserving exact XPBD compliance alphaTilde = alpha/h^2)
// and that skeleton animation, skin normals, and XPBD substeps advance in 1:1 lockstep.
function stepSingleSimulationFrame() {
  world.dt = FIXED_SIM_DT;
  advanceAnimationAndArmLift(FIXED_SIM_DT);
  updateSkeletonBlobInteraction();
  world.step();
  syncBlobMesh();
  syncShirtMesh();
}

const btnPlayblast      = document.getElementById('btn-playblast');
const playblastPopover  = document.getElementById('playblast-popover');
const btnPlayblastStart = document.getElementById('btn-playblast-start');
const pbFpsSelect       = document.getElementById('pb-fps');
const pbDurationSelect  = document.getElementById('pb-duration');
const pbResSelect       = document.getElementById('pb-res');
const pbResetCheck      = document.getElementById('pb-reset');
const pbHudCheck        = document.getElementById('pb-hud');

const playblastCtrl = Playblast.createPlayblastController({
  renderer,
  scene,
  camera,
  stepSimulation(stepDt) {
    pbSimAcc += stepDt;
    while (pbSimAcc + 1e-6 >= FIXED_SIM_DT) {
      stepSingleSimulationFrame();
      pbSimAcc -= FIXED_SIM_DT;
    }
  },
  onStartPlayblast({ resetFirst, fps, totalFrames, outW, outH, codec }) {
    playblastPopover.classList.remove('open');
    btnPlayblast.classList.add('recording');
    btnPlayblast.textContent = `⏹ Stop (0/${totalFrames})`;
    pbSimAcc = 0;
    acc = 0;
    if (resetFirst) {
      startBindPoseSequence();
    }
    const codecLabel = codec === 'avc1' ? 'H.264' : 'Motion-JPEG';
    RoomEnv.showNote(`Playblasting ${totalFrames} frames @ ${fps}fps (${outW}×${outH} ${codecLabel} .mov)...`, 3000);
  },
  onFinishPlayblast() {
    world.dt = FIXED_SIM_DT;
    pbSimAcc = 0;
    acc = 0;
    last = performance.now();
    btnPlayblast.classList.remove('recording');
    btnPlayblast.textContent = '🎬 Playblast';
  },
  getHudInfo() {
    return {
      title: 'Test 08 — Marshmallow Man & Cotton Shirt',
      subtitle: `Softbody: ${currentSoftDiv}×  |  Cloth: ${shirtEnabled ? currentClothDiv + '×' : 'Off'}  |  Substeps: ${world.substeps}`,
      bottomLeft: stateLabel.textContent
    };
  },
  showNote: RoomEnv.showNote
});

btnPlayblast.addEventListener('click', () => {
  if (playblastCtrl.isActive()) {
    playblastCtrl.stop();
  } else {
    playblastPopover.classList.toggle('open');
  }
});

btnPlayblastStart.addEventListener('click', () => {
  playblastCtrl.runPlayblast({
    fps: parseInt(pbFpsSelect.value, 10) || 30,
    duration: parseInt(pbDurationSelect.value, 10) || 8,
    resolution: pbResSelect.value || '720p',
    resetFirst: pbResetCheck.checked,
    hudBurnIn: pbHudCheck.checked,
    onProgress(f, total) {
      btnPlayblast.textContent = `⏹ Stop (${f}/${total})`;
    }
  });
});

function frame(now) {
  tickFps(now);
  if (playblastCtrl.isActive()) {
    last = now;
    requestAnimationFrame(frame);
    return;
  }

  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;

  // Step animation + XPBD soft-body + Cotton Shirt physics in exact 60Hz lockstep (identical to Playblast)
  acc += dt;
  if (acc >= FIXED_SIM_DT) {
    stepSingleSimulationFrame();
    acc = Math.min(acc - FIXED_SIM_DT, FIXED_SIM_DT * 0.5);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
