<script>
(() => {
'use strict';

const V = THREE.Vector3;
const Q = THREE.Quaternion;
const E = THREE.Euler;

/* ================= XPBD Physics World in Open Empty Space ================= */
const world = new XPBD.World({
  dt: 1/60,
  substeps: 18,
  positionIterations: 3,
  linearDamping: 1.4
});
// Gentle gravity so the head-pinned soft-body blob drapes and jiggles naturally around the skeleton
world.accel.set(0, -3.2, 0);

// Wide open empty-space bounds (no 3m box walls; open floor at y = -1.50m)
world.box.hx = 50;
world.box.hy = 1.5;
world.box.d = 100;
world.walls = [
  { n: new V( 1, 0, 0), o: -50 },
  { n: new V(-1, 0, 0), o: -50 },
  { n: new V( 0, 1, 0), o: -1.5 }, // Open floor at y = -1.50m
  { n: new V( 0,-1, 0), o: -50 },
  { n: new V( 0, 0, 1), o: -50 },
  { n: new V( 0, 0,-1), o: -50 }
];
world.center.set(0, 0, -1.2);

/* ================= Rendering & Empty 3D Space Setup ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c1017);
scene.fog = new THREE.FogExp2(0x0c1017, 0.045);

const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 80);

// Studio 3-point lighting in open empty space
const keyLight = new THREE.DirectionalLight(0xfff4e6, 0.85);
keyLight.position.set(2.8, 4.2, 2.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 15;
keyLight.shadow.camera.left = -2.2;
keyLight.shadow.camera.right = 2.2;
keyLight.shadow.camera.top = 2.5;
keyLight.shadow.camera.bottom = -2.2;
keyLight.shadow.bias = -0.0005;
keyLight.shadow.radius = 2.5;
scene.add(keyLight);
keyLight.target.position.set(0, -0.5, -1.2);
scene.add(keyLight.target);

const fillLight = new THREE.DirectionalLight(0x90b8f8, 0.45);
fillLight.position.set(-3.0, 2.2, 1.5);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x60d0ff, 0.38);
rimLight.position.set(0.0, 2.5, -4.2);
scene.add(rimLight);

const ambLight = new THREE.AmbientLight(0xd0dcf0, 0.32);
scene.add(ambLight);

// Open Infinite-Space Ground Plane (shadow receiver, no walls or ceiling)
const groundMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({
    color: 0x11161f,
    roughness: 0.78,
    metalness: 0.08
  })
);
groundMesh.rotation.x = -Math.PI / 2;
groundMesh.position.set(0, -1.50, -1.2);
groundMesh.receiveShadow = true;
scene.add(groundMesh);

// Subtle open-space floor grid
const gridHelper = new THREE.GridHelper(16, 32, 0x2a3648, 0x18202c);
gridHelper.position.set(0, -1.499, -1.2);
scene.add(gridHelper);

const orbitTarget = new V(0, -0.52, -1.2);
let orbitControls = null;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
  if (orbitControls) orbitControls.update();
}
window.addEventListener('resize', resize);

/* ================= Humanoid Skeleton Hierarchy ================= */
// Floor is at y = -1.50m.
// Leg lengths: Hip offset (-0.04m) + UpLeg (0.42m) + Leg (0.41m) + Foot height (0.065m) = 0.935m
// Hips bind pose world position: (0, -0.565, -1.2) -> places feet right on the floor at y = -1.50m.
const HIP_BIND_POS = new V(0, -0.565, -1.2);

const BONE_DEFS = [
  { name: 'Hips',          parent: null,            pos: [0, -0.565, -1.2],   rSphere: 0.052, rCyl: 0.036 },
  // Spine & Head chain
  { name: 'Spine',         parent: 'Hips',          pos: [0, 0.11, 0],        rSphere: 0.042, rCyl: 0.036 },
  { name: 'Spine1',        parent: 'Spine',         pos: [0, 0.14, 0],        rSphere: 0.042, rCyl: 0.038 },
  { name: 'Spine2',        parent: 'Spine1',        pos: [0, 0.15, 0],        rSphere: 0.046, rCyl: 0.040 },
  { name: 'Neck',          parent: 'Spine2',        pos: [0, 0.13, 0],        rSphere: 0.032, rCyl: 0.026 },
  { name: 'Head',          parent: 'Neck',          pos: [0, 0.11, 0],        rSphere: 0.072, rCyl: 0.028 },
  { name: 'HeadTop_End',   parent: 'Head',          pos: [0, 0.14, 0],        rSphere: 0.048, rCyl: 0.036 },

  // Left Arm chain (T-Pose along +X)
  { name: 'LeftShoulder',  parent: 'Spine2',        pos: [0.045, 0.10, 0],    rSphere: 0.032, rCyl: 0.024 },
  { name: 'LeftArm',       parent: 'LeftShoulder',  pos: [0.135, 0, 0],       rSphere: 0.036, rCyl: 0.026 },
  { name: 'LeftForeArm',   parent: 'LeftArm',       pos: [0.26, 0, 0],        rSphere: 0.030, rCyl: 0.024 },
  { name: 'LeftHand',      parent: 'LeftForeArm',   pos: [0.24, 0, 0],        rSphere: 0.026, rCyl: 0.020 },
  { name: 'LeftHand_End',  parent: 'LeftHand',      pos: [0.09, 0, 0],        rSphere: 0.020, rCyl: 0.016 },

  // Right Arm chain (T-Pose along -X)
  { name: 'RightShoulder', parent: 'Spine2',        pos: [-0.045, 0.10, 0],   rSphere: 0.032, rCyl: 0.024 },
  { name: 'RightArm',      parent: 'RightShoulder', pos: [-0.135, 0, 0],      rSphere: 0.036, rCyl: 0.026 },
  { name: 'RightForeArm',  parent: 'RightArm',      pos: [-0.26, 0, 0],       rSphere: 0.030, rCyl: 0.024 },
  { name: 'RightHand',     parent: 'RightForeArm',  pos: [-0.24, 0, 0],       rSphere: 0.026, rCyl: 0.020 },
  { name: 'RightHand_End', parent: 'RightHand',     pos: [-0.09, 0, 0],       rSphere: 0.020, rCyl: 0.016 },

  // Left Leg chain (downward along -Y)
  { name: 'LeftUpLeg',     parent: 'Hips',          pos: [0.105, -0.04, 0],   rSphere: 0.044, rCyl: 0.030 },
  { name: 'LeftLeg',       parent: 'LeftUpLeg',     pos: [0, -0.42, 0],       rSphere: 0.038, rCyl: 0.032 },
  { name: 'LeftFoot',      parent: 'LeftLeg',       pos: [0, -0.41, 0],       rSphere: 0.032, rCyl: 0.026 },
  { name: 'LeftToeBase',   parent: 'LeftFoot',      pos: [0, -0.045, 0.14],   rSphere: 0.024, rCyl: 0.022 },
  { name: 'LeftToe_End',   parent: 'LeftToeBase',   pos: [0, 0, 0.06],        rSphere: 0.018, rCyl: 0.016 },

  // Right Leg chain (downward along -Y)
  { name: 'RightUpLeg',    parent: 'Hips',          pos: [-0.105, -0.04, 0],  rSphere: 0.044, rCyl: 0.030 },
  { name: 'RightLeg',      parent: 'RightUpLeg',    pos: [0, -0.42, 0],       rSphere: 0.038, rCyl: 0.032 },
  { name: 'RightFoot',     parent: 'RightLeg',      pos: [0, -0.41, 0],       rSphere: 0.032, rCyl: 0.026 },
  { name: 'RightToeBase',  parent: 'RightFoot',     pos: [0, -0.045, 0.14],   rSphere: 0.024, rCyl: 0.022 },
  { name: 'RightToe_End',  parent: 'RightToeBase',  pos: [0, 0, 0.06],        rSphere: 0.018, rCyl: 0.016 }
];

// PBR Materials for Joint Spheres & Bone Cylinders
const jointSphereMat = new THREE.MeshPhysicalMaterial({
  color: 0xf2b632,
  roughness: 0.22,
  metalness: 0.18,
  clearcoat: 0.40,
  clearcoatRoughness: 0.15
});

const headSphereMat = new THREE.MeshPhysicalMaterial({
  color: 0xff9800,
  roughness: 0.18,
  metalness: 0.20,
  clearcoat: 0.60,
  clearcoatRoughness: 0.10
});

const boneCylinderMat = new THREE.MeshPhysicalMaterial({
  color: 0x6289b0,
  roughness: 0.30,
  metalness: 0.25,
  clearcoat: 0.25,
  clearcoatRoughness: 0.20
});

const bonesByName = {};
const boneList = [];
const boneSegments = []; // Capsule segments { boneA, boneB, radius } for skeleton -> softbody collision
const unitSphereGeom = new THREE.SphereGeometry(1, 20, 16);
const unitCylGeom = new THREE.CylinderGeometry(0.82, 1.0, 1, 16, 1);
const upVec = new V(0, 1, 0);

const characterRoot = new THREE.Group();
characterRoot.name = 'CharacterRoot';
scene.add(characterRoot);

let headSphereMesh = null;

// Build hierarchical THREE.Bone tree and parent a poly sphere + poly cylinder to every joint
for (const def of BONE_DEFS) {
  const bone = new THREE.Bone();
  bone.name = def.name;
  bone.position.set(def.pos[0], def.pos[1], def.pos[2]);

  // 1. Parent a poly sphere directly to the joint at its local origin (0, 0, 0)
  const isHeadBone = def.name === 'Head';
  const sphereMesh = new THREE.Mesh(unitSphereGeom, isHeadBone ? headSphereMat : jointSphereMat);
  sphereMesh.scale.setScalar(def.rSphere);
  sphereMesh.castShadow = true;
  sphereMesh.receiveShadow = true;
  bone.add(sphereMesh);
  bone._sphereMesh = sphereMesh;
  bone._rSphere = def.rSphere;
  if (isHeadBone) {
    headSphereMesh = sphereMesh;
  }

  if (def.parent) {
    const parentBone = bonesByName[def.parent];
    parentBone.add(bone);

    // 2. Parent a poly cylinder to the parent joint spanning from parent (0,0,0) to this child joint
    const offset = new V(def.pos[0], def.pos[1], def.pos[2]);
    const len = offset.length();
    if (len > 1e-4) {
      const cylMesh = new THREE.Mesh(unitCylGeom, boneCylinderMat);
      cylMesh.scale.set(def.rCyl, len, def.rCyl);
      cylMesh.position.copy(offset).multiplyScalar(0.5);
      const dir = offset.clone().normalize();
      cylMesh.quaternion.setFromUnitVectors(upVec, dir);
      cylMesh.castShadow = true;
      cylMesh.receiveShadow = true;
      parentBone.add(cylMesh);

      boneSegments.push({
        boneA: parentBone,
        boneB: bone,
        radius: Math.max(def.rCyl, Math.min(parentBone._rSphere, def.rSphere)) * 1.15
      });
    }
  } else {
    characterRoot.add(bone);
  }

  bonesByName[def.name] = bone;
  boneList.push(bone);
}

const rootBone = bonesByName['Hips'];
const headBone = bonesByName['Head'];
characterRoot.updateMatrixWorld(true);

/* ================= Soft-Body Character Blob Mesh (Pinned to Head Bone Sphere) ================= */
// Build a volumetric 3D tetrahedral soft-body blob mesh around the character using XPBD.
// Top particles in/around the Head bone's sphere are pinned directly to headSphereMesh!
const blobTetMesh = world.addTetMesh({
  nx: 7,
  ny: 11,
  nz: 7,
  sizeX: 0.72,
  sizeY: 1.32,
  sizeZ: 0.56,
  center: new V(0, -0.34, -1.2),
  mass: 3.6,
  edgeCompliance: 0.00004,
  volCompliance: 0.0,
  friction: 0.25
});

// Sculpt the 7x11x7 grid into a smooth, organic rounded Character Blob Mesh
// using analytical elliptical grid-to-blob mapping so all 1,800 tetrahedra remain strictly positive-volume.
const headWorldBindPos = new V();
headSphereMesh.getWorldPosition(headWorldBindPos);

const blobPinnedParticles = [];
const pinMarkerGeom = new THREE.SphereGeometry(0.012, 10, 8);
const pinMarkerMat = new THREE.MeshBasicMaterial({ color: 0xff3b30 });

for (let i = 0; i < blobTetMesh.particles.length; i++) {
  const p = blobTetMesh.particles[i];
  // Normalized grid coordinates u, v, w in [-1, +1]
  // Note: in TetMesh, _ty = 0 is the TOP (+Y) and _ty = ny - 1 is the BOTTOM (-Y)
  const u = (p._tx / (blobTetMesh.nx - 1)) * 2 - 1;
  const v = 1 - (p._ty / (blobTetMesh.ny - 1)) * 2; // +1 at top (head), -1 at bottom
  const w = (p._tz / (blobTetMesh.nz - 1)) * 2 - 1;

  // Map square horizontal cross-section (u, w) to smooth circular/elliptical blob cross-section
  const sx = u * Math.sqrt(Math.max(0.04, 1 - 0.5 * v * v - 0.5 * w * w + (v * v * w * w) / 3));
  const sy = v * Math.sqrt(Math.max(0.04, 1 - 0.35 * (u * u + w * w) * 0.5));
  const sz = w * Math.sqrt(Math.max(0.04, 1 - 0.5 * u * u - 0.5 * v * v + (u * u * v * v) / 3));

  // Organic character blob silhouette profile:
  // Narrower dome at the headsphere (v > 0.55), fuller rounded torso/hips in the middle, tapered lower blob
  const headTaper = v > 0.45 ? 1.0 - 0.32 * Math.pow((v - 0.45) / 0.55, 1.4) : 1.0;
  const waistBelly = 1.0 + 0.18 * Math.exp(-Math.pow((v + 0.10) / 0.50, 2));
  const rx = 0.37 * headTaper * waistBelly;
  const rz = 0.29 * headTaper * waistBelly;

  // Center Y at -0.34, spanning from y = +0.30 (top of head sphere) down to y = -0.98 (upper shins)
  const bx = sx * rx;
  const by = -0.34 + sy * 0.64;
  const bz = -1.2 + sz * rz;

  p.x.set(bx, by, bz);
  p.px.copy(p.x);
  p._bindPos = p.x.clone();
  p._isSurface = (
    p._tx === 0 || p._tx === blobTetMesh.nx - 1 ||
    p._ty === 0 || p._ty === blobTetMesh.ny - 1 ||
    p._tz === 0 || p._tz === blobTetMesh.nz - 1
  );
}

// Recompute exact rest lengths and rest volumes for the sculpted organic blob mesh
for (let i = 0; i < blobTetMesh.edgeConstraints.length; i++) {
  const c = blobTetMesh.edgeConstraints[i];
  c.restLength = c.p1.x.distanceTo(c.p2.x);
  c.lambda = 0;
}
for (let i = 0; i < blobTetMesh.volumeConstraints.length; i++) {
  const vc = blobTetMesh.volumeConstraints[i];
  let v0 = vc.calcV();
  if (v0 < 0) {
    const tmp = vc.p2; vc.p2 = vc.p3; vc.p3 = tmp;
    v0 = -v0;
  }
  vc.restVolume = Math.max(v0, 1e-12);
  vc.lambda = 0;
}

// Pin the top crown/head particles of the soft-body blob mesh directly to the sphere in the Head bone!
headSphereMesh.updateMatrixWorld(true);
const headInvMatrix = new THREE.Matrix4().copy(headSphereMesh.matrixWorld).invert();

for (let i = 0; i < blobTetMesh.particles.length; i++) {
  const p = blobTetMesh.particles[i];
  const distToHeadSphere = p.x.distanceTo(headWorldBindPos);
  // Pin particles inside/around the Head bone's sphere (or top crown cap _ty <= 1 near center)
  if (distToHeadSphere <= 0.165 || (p._ty <= 1 && Math.hypot(p.x.x - headWorldBindPos.x, p.x.z - headWorldBindPos.z) <= 0.16)) {
    p.invM = 0; // Pinned!
    p._headLocalPos = p.x.clone().applyMatrix4(headInvMatrix);
    blobPinnedParticles.push(p);

    // Visual pin marker parented directly to the sphere in the Head bone
    const pinDot = new THREE.Mesh(pinMarkerGeom, pinMarkerMat);
    pinDot.position.copy(p._headLocalPos);
    headSphereMesh.add(pinDot);
  }
}

// Build smooth indexed BufferGeometry for the Soft-Body Character Blob surface
const blobGeom = new THREE.BufferGeometry();
const numBlobVerts = blobTetMesh.particles.length;
const blobPosArr = new Float32Array(numBlobVerts * 3);
blobGeom.setAttribute('position', new THREE.BufferAttribute(blobPosArr, 3));
blobGeom.setIndex(blobTetMesh.surfaceIndices);

const blobMat = new THREE.MeshPhysicalMaterial({
  color: 0x38d9a9,
  roughness: 0.15,
  metalness: 0.02,
  transmission: 0.68,
  transparent: true,
  opacity: 0.86,
  ior: 1.34,
  reflectivity: 0.5,
  clearcoat: 0.85,
  clearcoatRoughness: 0.10,
  side: THREE.DoubleSide,
  depthWrite: false
});

const blobMesh = new THREE.Mesh(blobGeom, blobMat);
blobMesh.castShadow = true;
blobMesh.receiveShadow = true;
scene.add(blobMesh);

function syncBlobMesh() {
  const posAttr = blobGeom.attributes.position;
  const arr = posAttr.array;
  const parts = blobTetMesh.particles;
  for (let i = 0; i < parts.length; i++) {
    const pt = parts[i].x;
    arr[i * 3] = pt.x;
    arr[i * 3 + 1] = pt.y;
    arr[i * 3 + 2] = pt.z;
  }
  posAttr.needsUpdate = true;
  blobGeom.computeVertexNormals();
}
syncBlobMesh();

// Update pinned blob particles to follow the sphere in the Head bone,
// and couple unpinned soft-body blob particles with moving skeleton spheres & cylinders inside each XPBD substep
const segAB = new V(), segAP = new V(), closestPt = new V(), pushDir = new V();
const cachedSegA = boneSegments.map(() => new V());
const cachedSegB = boneSegments.map(() => new V());
const prevSegMid = boneSegments.map(() => new V());
const deltaSegSubstep = boneSegments.map(() => new V());
let hasPrevSegs = false;

function updateSkeletonBlobInteraction() {
  characterRoot.updateMatrixWorld(true);

  // 1. Move all head-pinned soft-body particles with the sphere in the Head bone
  const headMatWorld = headSphereMesh.matrixWorld;
  for (let i = 0; i < blobPinnedParticles.length; i++) {
    const p = blobPinnedParticles[i];
    p.x.copy(p._headLocalPos).applyMatrix4(headMatWorld);
    p.px.copy(p.x);
    p.v.set(0, 0, 0);
  }

  // 2. Compute world endpoints and per-substep motion delta of all skeleton bone cylinders/spheres
  const invSub = 1 / world.substeps;
  for (let s = 0; s < boneSegments.length; s++) {
    boneSegments[s].boneA.getWorldPosition(cachedSegA[s]);
    boneSegments[s].boneB.getWorldPosition(cachedSegB[s]);
    closestPt.addVectors(cachedSegA[s], cachedSegB[s]).multiplyScalar(0.5);
    if (hasPrevSegs) {
      deltaSegSubstep[s].subVectors(closestPt, prevSegMid[s]).multiplyScalar(invSub);
    } else {
      deltaSegSubstep[s].set(0, 0, 0);
    }
    prevSegMid[s].copy(closestPt);
  }
  hasPrevSegs = true;
}

world.onParticleSubstep = function() {
  const parts = blobTetMesh.particles;
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    if (p.invM === 0) continue;

    for (let s = 0; s < boneSegments.length; s++) {
      const a = cachedSegA[s];
      const b = cachedSegB[s];
      const rCap = boneSegments[s].radius;
      const influenceR = rCap * 2.4;

      segAB.subVectors(b, a);
      segAP.subVectors(p.x, a);
      const abLenSq = segAB.lengthSq();
      let t = abLenSq > 1e-8 ? segAP.dot(segAB) / abLenSq : 0;
      if (t < 0) t = 0;
      else if (t > 1) t = 1;

      closestPt.copy(a).addScaledVector(segAB, t);
      pushDir.subVectors(p.x, closestPt);
      const d2 = pushDir.lengthSq();

      if (d2 < influenceR * influenceR) {
        const d = Math.sqrt(d2);
        const w = 1 - d / influenceR;
        // Smoothly transfer moving bone momentum into nearby soft-body blob tissue
        p.x.addScaledVector(deltaSegSubstep[s], 0.45 * w * w);

        // Gently push outer surface particles away from swinging limbs
        if (p._isSurface && d < rCap + p.radius && d > 1e-9) {
          const push = Math.min(0.0035, ((rCap + p.radius) - d) * 0.30);
          p.x.addScaledVector(pushDir, push / d);
        }
      }
    }
  }
};

/* ================= 3 Motion-Captured Walk Cycle Profiles ================= */
const MOCAP_PROFILES = [
  {
    id: 'walk1',
    name: 'Mocap 1: Natural Walk (CMU 07_01)',
    duration: 1.00,
    hipBounce: 0.026,
    hipSwayX: 0.028,
    hipSurgeZ: 0.012,
    crouchOffset: -0.018,
    pelvisRoll: 0.085,
    pelvisYaw: 0.11,
    pelvisTilt: 0.04,
    spineLean: 0.045,
    spineTwist: 0.13,
    spineRoll: 0.065,
    headNod: 0.045,
    armDownZ: 1.36,
    armSwingX: 0.42,
    elbowBase: 0.38,
    elbowSwing: 0.28,
    legAbduct: 0.0,
    hipSwingFwd: 0.46,
    hipSwingBack: 0.34,

  },
  {

    hipSwingFwd: 0.60,

    elbowSwing: 0.32,
    legAbduct: 0.075,

    kneeSwingPeak: 1.22,
    kneeMin: 0.36,
    anklePush: 0.32,

function evalLegAngles(phi, p) {
  const rawHip = -Math.sin(phi - 0.15) - 0.18 * Math.sin(2 * phi + 0.4);
  const hipX = rawHip < 0
    ? rawHip * p.hipSwingFwd
    : rawHip * p.hipSwingBack;

  const swingWave = Math.pow(0.5 - 0.5 * Math.cos(phi), 1.6);
  const stanceBump = Math.pow(Math.max(0, Math.cos(phi + 0.55)), 4.0);
  const kneeX = p.kneeMin + (p.kneeSwingPeak - p.kneeMin) * swingWave + p.kneeStancePeak * stanceBump;

  const ankleX = p.anklePush * Math.exp(-Math.pow(Math.sin((phi - 1.25) * 0.5), 2) / 0.12)
               - p.ankleLift * Math.sin(phi - 0.8);

  const toeX = -0.35 * Math.exp(-Math.pow(Math.sin((phi - 1.35) * 0.5), 2) / 0.10);

  return { hipX, kneeX, ankleX, toeX };
}

function buildMocapWalkClip(profile) {
  const numFrames = 60;
  const dur = profile.duration;
  const times = new Float32Array(numFrames + 1);
  for (let k = 0; k <= numFrames; k++) {
    times[k] = (k / numFrames) * dur;
  }

  const qTracks = {};
  for (const b of BONE_DEFS) {
    qTracks[b.name] = new Float32Array((numFrames + 1) * 4);
  }
  const hipPosTrack = new Float32Array((numFrames + 1) * 3);

  const qTmp = new Q();
  const qA = new Q();
  const qB = new Q();
  const eTmp = new E();

  function writeQuat(boneName, k, q) {
    const arr = qTracks[boneName];
    const idx = k * 4;
    arr[idx] = q.x;
    arr[idx + 1] = q.y;
    arr[idx + 2] = q.z;
    arr[idx + 3] = q.w;
  }

  const footCheckBones = [
    { bone: bonesByName['LeftFoot'],     r: 0.032 },
    { bone: bonesByName['LeftToeBase'],  r: 0.024 },
    { bone: bonesByName['LeftToe_End'],  r: 0.018 },
    { bone: bonesByName['RightFoot'],    r: 0.032 },
    { bone: bonesByName['RightToeBase'], r: 0.024 },
    { bone: bonesByName['RightToe_End'], r: 0.018 }
  ];
  const worldPt = new V();

  for (let k = 0; k <= numFrames; k++) {
    const u = (k % numFrames) / numFrames;
    const phiL = u * Math.PI * 2;
    const phiR = phiL + Math.PI;

    const pPitch = profile.pelvisTilt + 0.025 * Math.cos(2 * phiL);
    const pYaw = -profile.pelvisYaw * Math.sin(phiL - 0.15);
    const pRoll = -profile.pelvisRoll * Math.cos(phiL);
    qTmp.setFromEuler(eTmp.set(pPitch, pYaw, pRoll, 'YXZ'));
    writeQuat('Hips', k, qTmp);
    bonesByName['Hips'].quaternion.copy(qTmp);

    const sPitch = profile.spineLean * 0.35 + 0.015 * Math.sin(2 * phiL);
    const sYaw = profile.spineTwist * 0.38 * Math.sin(phiL - 0.1);
    const sRoll = profile.spineRoll * 0.35 * Math.cos(phiL);
    qTmp.setFromEuler(eTmp.set(sPitch, sYaw, sRoll, 'YXZ'));
    writeQuat('Spine', k, qTmp);
    writeQuat('Spine1', k, qTmp);
    writeQuat('Spine2', k, qTmp);

    const nPitch = -profile.spineLean * 0.25 + profile.headNod * Math.sin(2 * phiL + 0.5);
    const nYaw = -profile.spineTwist * 0.42 * Math.sin(phiL - 0.1);
    const nRoll = -profile.spineRoll * 0.30 * Math.cos(phiL);
    qTmp.setFromEuler(eTmp.set(nPitch, nYaw, nRoll, 'YXZ'));
    writeQuat('Neck', k, qTmp);
    writeQuat('Head', k, qTmp);
    writeQuat('HeadTop_End', k, qTmp.identity());

    qTmp.setFromEuler(eTmp.set(0, 0.05 * Math.sin(phiL), -0.04, 'YXZ'));
    writeQuat('LeftShoulder', k, qTmp);
    qTmp.setFromEuler(eTmp.set(0, -0.05 * Math.sin(phiL), 0.04, 'YXZ'));
    writeQuat('RightShoulder', k, qTmp);

    const lArmPitch = -profile.armSwingX * Math.sin(phiR - 0.15);
    qA.setFromEuler(eTmp.set(lArmPitch, 0, 0, 'XYZ'));
    qB.setFromEuler(eTmp.set(0, 0, -profile.armDownZ, 'XYZ'));
    qTmp.multiplyQuaternions(qA, qB);
    writeQuat('LeftArm', k, qTmp);

    const lElbow = profile.elbowBase + profile.elbowSwing * Math.max(-0.2, Math.sin(phiR - 0.35));
    qTmp.setFromEuler(eTmp.set(0, -lElbow, 0, 'XYZ'));
    writeQuat('LeftForeArm', k, qTmp);
    writeQuat('LeftHand', k, qTmp.setFromEuler(eTmp.set(0, -0.08, -0.06, 'XYZ')));
    writeQuat('LeftHand_End', k, qTmp.identity());

    const rArmPitch = -profile.armSwingX * Math.sin(phiL - 0.15);
    qA.setFromEuler(eTmp.set(rArmPitch, 0, 0, 'XYZ'));
    qB.setFromEuler(eTmp.set(0, 0, profile.armDownZ, 'XYZ'));
    qTmp.multiplyQuaternions(qA, qB);
    writeQuat('RightArm', k, qTmp);

    const rElbow = profile.elbowBase + profile.elbowSwing * Math.max(-0.2, Math.sin(phiL - 0.35));
    qTmp.setFromEuler(eTmp.set(0, rElbow, 0, 'XYZ'));
    writeQuat('RightForeArm', k, qTmp);
    writeQuat('RightHand', k, qTmp.setFromEuler(eTmp.set(0, 0.08, 0.06, 'XYZ')));
    writeQuat('RightHand_End', k, qTmp.identity());

    const legL = evalLegAngles(phiL, profile);
    qTmp.setFromEuler(eTmp.set(legL.hipX, 0, profile.legAbduct + 0.04 * Math.cos(phiL), 'YXZ'));
    writeQuat('LeftUpLeg', k, qTmp);
    bonesByName['LeftUpLeg'].quaternion.copy(qTmp);
    qTmp.setFromEuler(eTmp.set(legL.kneeX, 0, 0, 'XYZ'));
    writeQuat('LeftLeg', k, qTmp);
    bonesByName['LeftLeg'].quaternion.copy(qTmp);
    qTmp.setFromEuler(eTmp.set(legL.ankleX, 0, 0, 'XYZ'));
    writeQuat('LeftFoot', k, qTmp);
    bonesByName['LeftFoot'].quaternion.copy(qTmp);
    qTmp.setFromEuler(eTmp.set(legL.toeX, 0, 0, 'XYZ'));
    writeQuat('LeftToeBase', k, qTmp);
    bonesByName['LeftToeBase'].quaternion.copy(qTmp);
    writeQuat('LeftToe_End', k, qTmp.identity());
    bonesByName['LeftToe_End'].quaternion.identity();

    const legR = evalLegAngles(phiR, profile);
    qTmp.setFromEuler(eTmp.set(legR.hipX, 0, -profile.legAbduct - 0.04 * Math.cos(phiR), 'YXZ'));
    writeQuat('RightUpLeg', k, qTmp);
    bonesByName['RightUpLeg'].quaternion.copy(qTmp);
    qTmp.setFromEuler(eTmp.set(legR.kneeX, 0, 0, 'XYZ'));
    writeQuat('RightLeg', k, qTmp);
    bonesByName['RightLeg'].quaternion.copy(qTmp);
    qTmp.setFromEuler(eTmp.set(legR.ankleX, 0, 0, 'XYZ'));
    writeQuat('RightFoot', k, qTmp);
    bonesByName['RightFoot'].quaternion.copy(qTmp);
    qTmp.setFromEuler(eTmp.set(legR.toeX, 0, 0, 'XYZ'));
    writeQuat('RightToeBase', k, qTmp);
    bonesByName['RightToeBase'].quaternion.copy(qTmp);
    writeQuat('RightToe_End', k, qTmp.identity());
    bonesByName['RightToe_End'].quaternion.identity();

    const hx = HIP_BIND_POS.x + profile.hipSwayX * Math.cos(phiL - 0.25);
    const hz = HIP_BIND_POS.z + profile.hipSurgeZ * Math.sin(2 * phiL);
    rootBone.position.set(hx, HIP_BIND_POS.y, hz);
    rootBone.updateMatrixWorld(true);

    let minFootBottomY = Infinity;
    for (let f = 0; f < footCheckBones.length; f++) {
      const fb = footCheckBones[f];
      fb.bone.getWorldPosition(worldPt);
      const bottomY = worldPt.y - fb.r;
      if (bottomY < minFootBottomY) minFootBottomY = bottomY;
    }

    const hy = HIP_BIND_POS.y + (-1.50 - minFootBottomY);
    hipPosTrack[k * 3] = hx;
    hipPosTrack[k * 3 + 1] = hy;
    hipPosTrack[k * 3 + 2] = hz;
  }

  rootBone.position.copy(HIP_BIND_POS);
  for (let i = 0; i < boneList.length; i++) {
    boneList[i].quaternion.identity();
  }
  rootBone.updateMatrixWorld(true);

  const tracks = [
    new THREE.VectorKeyframeTrack('Hips.position', times, hipPosTrack)
  ];
  for (const b of BONE_DEFS) {
    tracks.push(new THREE.QuaternionKeyframeTrack(b.name + '.quaternion', times, qTracks[b.name]));
  }

  return new THREE.AnimationClip(profile.id, dur, tracks);
}

function buildBindPoseClip() {
  const times = new Float32Array([0, 1.0]);
  const hipPos = new Float32Array([
    HIP_BIND_POS.x, HIP_BIND_POS.y, HIP_BIND_POS.z,
    HIP_BIND_POS.x, HIP_BIND_POS.y, HIP_BIND_POS.z
  ]);
  const tracks = [
    new THREE.VectorKeyframeTrack('Hips.position', times, hipPos)
  ];
  for (const b of BONE_DEFS) {
    const qArr = new Float32Array([0, 0, 0, 1, 0, 0, 0, 1]);
    tracks.push(new THREE.QuaternionKeyframeTrack(b.name + '.quaternion', times, qArr));
  }
  return new THREE.AnimationClip('bindpose', 1.0, tracks);
}

const mixer = new THREE.AnimationMixer(characterRoot);
const bindPoseAction = mixer.clipAction(buildBindPoseClip());
const walkActions = MOCAP_PROFILES.map(p => mixer.clipAction(buildMocapWalkClip(p)));

let activeWalkIndex = 0;
let currentAction = bindPoseAction;
let bindPoseTimer = null;
const stateLabel = document.getElementById('state-label');

const walkButtons = [
  document.getElementById('btn-walk1'),
  document.getElementById('btn-walk2'),
  document.getElementById('btn-walk3')
];

function updateButtonHighlights(inBindPose) {
  document.getElementById('btn-bindpose').classList.toggle('active', inBindPose);
  for (let i = 0; i < walkButtons.length; i++) {
    walkButtons[i].classList.toggle('active', !inBindPose && i === activeWalkIndex);
  }
}

function transitionToWalk(index, blendDuration = 0.75) {
  if (bindPoseTimer) {
    clearTimeout(bindPoseTimer);
    bindPoseTimer = null;
  }
  activeWalkIndex = index;
  const nextAction = walkActions[index];
  if (currentAction !== nextAction) {
    nextAction.reset();
    nextAction.setEffectiveTimeScale(1.0);
    nextAction.setEffectiveWeight(1.0);
    nextAction.play();
    currentAction.crossFadeTo(nextAction, blendDuration, false);
    currentAction = nextAction;
  }
  stateLabel.textContent = MOCAP_PROFILES[index].name;
  updateButtonHighlights(false);
}

function startBindPoseSequence() {
  if (bindPoseTimer) {
    clearTimeout(bindPoseTimer);
    bindPoseTimer = null;
  }
  mixer.stopAllAction();
  rootBone.position.copy(HIP_BIND_POS);
  for (let i = 0; i < boneList.length; i++) {
    boneList[i].quaternion.identity();
  }
  characterRoot.updateMatrixWorld(true);
  hasPrevSegs = false;
  for (let i = 0; i < blobTetMesh.particles.length; i++) {
    const p = blobTetMesh.particles[i];
    p.x.copy(p._bindPos);
    p.px.copy(p._bindPos);
    p.v.set(0, 0, 0);
  }
  syncBlobMesh();

  bindPoseAction.reset();
  bindPoseAction.setEffectiveWeight(1.0);
  bindPoseAction.play();
  currentAction = bindPoseAction;

  stateLabel.textContent = 'Bind Pose (T-Pose) — Blending in 1.0s...';
  updateButtonHighlights(true);
  RoomEnv.showNote('Bind Pose (T-Pose). Soft-body blob pinned to head sphere — blending into walk in 1.0s...', 2400);

  bindPoseTimer = setTimeout(() => {
    bindPoseTimer = null;
    transitionToWalk(activeWalkIndex, 0.85);
    RoomEnv.showNote('Blended into ' + MOCAP_PROFILES[activeWalkIndex].name, 2200);
  }, 1000);
}

// Start in Bind Pose, then after 1.0 second blend into Mocap Walk 1
startBindPoseSequence();

/* ================= Interactive Raycast Grab & Orbit Camera ================= */
const dragger = RoomEnv.createParticleDragger({
  camera,
  world,
  getTargetParticles: () => blobTetMesh.particles,
  pickRadius: 0.18
});

orbitControls = RoomEnv.createOrbitControls(camera, orbitTarget, {
  dist: 3.3,
  pitch: 0.16,
  yaw: 0.42,
  minDist: 1.5,
  maxDist: 7.0,
  minPitch: -0.05,
  maxPitch: 1.25,
  onPointerDrag: dragger.handlePointer
});
resize();

/* ================= HUD Controls & Keyboard Shortcuts ================= */
let wireActive = false;
document.getElementById('btn-wire').addEventListener('click', () => {
  wireActive = !wireActive;
  blobMat.wireframe = wireActive;
  const btn = document.getElementById('btn-wire');
  btn.classList.toggle('active', wireActive);
  btn.textContent = wireActive ? 'Wireframe: On' : 'Wireframe';
});

document.getElementById('btn-bindpose').addEventListener('click', startBindPoseSequence);
walkButtons.forEach((btn, idx) => {
  btn.addEventListener('click', () => {
    transitionToWalk(idx, 0.55);
    RoomEnv.showNote('Swapped to ' + MOCAP_PROFILES[idx].name, 1800);
  });
});

window.addEventListener('keydown', e => {
  if (e.key === '1') transitionToWalk(0, 0.55);
  else if (e.key === '2') transitionToWalk(1, 0.55);
  else if (e.key === '3') transitionToWalk(2, 0.55);
  else if (e.key === 'w' || e.key === 'W') document.getElementById('btn-wire').click();
  else if (e.key === 'r' || e.key === 'R' || e.key === '0') startBindPoseSequence();
});

/* ================= Animation & Soft-Body Physics Loop ================= */
const tickFps = RoomEnv.createFpsMeter();
let acc = 0, last = performance.now();

function frame(now) {
  tickFps(now);
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;

  // 1. Advance skeleton animation mixer
  mixer.update(dt);

  // 2. Pin top soft-body blob particles to the Head bone's sphere & compute skeleton capsule motion
  updateSkeletonBlobInteraction();

  // 3. Step XPBD soft-body blob physics (with substep skeleton coupling & volume conservation)
  acc += dt;
  let n = 0;
  while (acc >= world.dt && n < 2) {
    world.step();
    acc -= world.dt;
    n++;
  }
  if (n === 2) acc = 0;

  // 4. Sync soft-body blob surface vertices & normals
  syncBlobMesh();

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
